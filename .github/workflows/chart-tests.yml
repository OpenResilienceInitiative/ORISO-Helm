name: Chart tests

# The chart's render tests were only ever run by narrowly-scoped workflows that
# each named individual files, so a newly added test file ran nowhere until
# somebody remembered to wire it up. This runs the whole suite.

on:
  pull_request:
  push:
    branches:
      - pre-dev

permissions:
  contents: read

jobs:
  render:
    name: Chart render tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.0.2

      - name: Run the chart render suite
        run: python -m pytest -q tests/
