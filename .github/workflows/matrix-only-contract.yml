name: Matrix-only Helm Contract

on:
  pull_request:
  push:
    branches:
      - pre-dev
      - dev

permissions:
  contents: read

jobs:
  no-legacy-chat-runtime:
    name: no Rocket.Chat or Jitsi runtime contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify the Matrix-only chart boundary
        run: python3 tests/render_no_chat_legacy_test.py
