name: Matrix-only Helm Contract

on:
  pull_request:
  push:
    branches:
      - pre-dev
      - dev

permissions:
  contents: read

concurrency:
  group: matrix-only-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-legacy-chat-runtime:
    name: no Rocket.Chat or Jitsi runtime contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Verify the Matrix-only chart boundary
        run: python3 tests/render_no_chat_legacy_test.py
