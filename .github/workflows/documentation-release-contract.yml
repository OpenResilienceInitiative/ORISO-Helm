name: Documentation release coordinator contract
on:
  pull_request:
    paths: ['scripts/release_documentation.py', 'tests/test_release_documentation.py', '.github/workflows/release-helm-chart.yml', '.github/workflows/documentation-release-contract.yml']
  push:
    branches: [dev]
    paths: ['scripts/release_documentation.py', 'tests/test_release_documentation.py', '.github/workflows/release-helm-chart.yml', '.github/workflows/documentation-release-contract.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check out the reviewed receiver contract for offline integration tests
        uses: actions/checkout@v4
        with:
          repository: OpenResilienceInitiative/ORISO-Docs
          ref: 18d7fe0bf52028bb554ec7c3d209a2ae367219ce
          path: _contract_docs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Test exact inputs, failed publication and immutable retry boundaries
        env:
          ORISO_DOCS_SOURCE_ROOT: ${{ github.workspace }}/_contract_docs
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p test_release_documentation.py -q
