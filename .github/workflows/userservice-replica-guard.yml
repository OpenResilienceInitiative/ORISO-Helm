name: UserService replica safety

on:
  pull_request:
    branches:
      - pre-dev
    paths:
      - "templates/userservice/**"
      - "values*.yaml*"
      - "secrets.yaml.default"
      - "tests/render_userservice_replica_guard_test.py"
      - ".github/workflows/userservice-replica-guard.yml"
  push:
    branches:
      - pre-dev

permissions:
  contents: read

jobs:
  verify:
    name: Supported UserService replica count
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.0.2

      - name: Lint chart with repository fixtures
        run: helm lint . -f values.yaml.default -f secrets.yaml.default

      - name: Verify the replica safety boundary
        run: python -m pytest -q tests/render_userservice_replica_guard_test.py
