name: SigNoz conformance

on:
  pull_request:
    branches:
      - pre-dev
    paths:
      - "templates/signoz/**"
      - "observability/**"
      - "scripts/signoz_conformance.py"
      - "tests/render_signoz_conformance_test.py"
      - "tests/test_signoz_conformance.py"
      - "values*.yaml*"
      - ".github/workflows/signoz-conformance.yml"
  push:
    branches:
      - pre-dev

permissions:
  contents: read

jobs:
  verify:
    name: SigNoz conformance contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 pytest==9.0.2

      - name: Lint observability render
        run: >-
          helm lint .
          -f values.yaml.default
          -f secrets.yaml.default
          --set signoz.enabled=true

      - name: Verify signal, retention, and live-gate contracts
        run: >-
          python -m pytest -q
          tests/render_signoz_conformance_test.py
          tests/test_signoz_conformance.py

      - name: Verify live-gate command is executable
        run: python scripts/signoz_conformance.py --help
