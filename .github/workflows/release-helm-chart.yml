name: Release Helm Chart

run-name: Release Helm chart v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 2.0.1
        required: true
        type: string
      create_tag:
        description: Create and push Git tag from main
        required: true
        default: true
        type: boolean
      release_manifest:
        description: Reviewed oriso.platform-release/v1 JSON with all exact released repository commits
        required: true
        type: string

concurrency:
  group: helm-platform-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative
  CHART_REPOSITORY: charts

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create tag and publish Helm chart
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 -m pip install PyYAML==6.0.3

      - name: Prepare exact platform release inputs
        id: release-input
        env:
          ORISO_DOCS_RELEASE_TOKEN: ${{ secrets.ORISO_DOCS_RELEASE_TOKEN }}
        run: python3 scripts/release_documentation.py prepare --manifest "$RUNNER_TEMP/platform-release.json"

      - name: Fetch the exact released Docs validator
        env:
          DOCS_RELEASE_REVISION: ${{ steps.release-input.outputs.documentation-revision }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/docs-release-source"
          git -C "$RUNNER_TEMP/docs-release-source" fetch --quiet --depth 1 https://github.com/OpenResilienceInitiative/ORISO-Docs.git "$DOCS_RELEASE_REVISION"
          git -C "$RUNNER_TEMP/docs-release-source" checkout --quiet --detach FETCH_HEAD

      - name: Verify exact public release sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORISO_DOCS_RELEASE_TOKEN: ${{ secrets.ORISO_DOCS_RELEASE_TOKEN }}
        run: python3 scripts/release_documentation.py verify --manifest "$RUNNER_TEMP/platform-release.json" --docs-root "$RUNNER_TEMP/docs-release-source"

      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format, for example 2.0.1"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This workflow must run from main after the release PR is merged."
            echo "Current ref is ${GITHUB_REF_NAME}"
            exit 1
          fi

          CHART_VERSION="$(awk -F': *' '$1 == "version" { print $2; exit }' Chart.yaml | tr -d '"')"
          APP_VERSION="$(awk -F': *' '$1 == "appVersion" { print $2; exit }' Chart.yaml | tr -d '"')"

          if [[ "$CHART_VERSION" != "$VERSION" ]]; then
            echo "Chart.yaml version is ${CHART_VERSION}, but workflow input is ${VERSION}"
            exit 1
          fi

          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Chart.yaml appVersion is ${APP_VERSION}, but workflow input is ${VERSION}"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} already exists. Choose a new version or delete the incorrect tag first."
            exit 1
          fi

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail

          # values.yaml.default configures an SMTP transport and the chart's
          # render gate requires non-empty SMTP credentials with it, so the
          # validation render supplies placeholders the same way real deploys
          # supply the credentials from persistent secret values.
          # global.domainName has no default on purpose (ORISO-Helm#366), so
          # the validation render names a private .internal host (reserved example
          # hosts are rejected as placeholders).
          # Generic installs require their own product and legal organisation
          # names. The fixture provides synthetic render-only values.
          # The render fixture also supplies a test-only Matrix identity;
          # values.yaml.default intentionally ships an invalid placeholder.
          helm lint . -f values.yaml.default -f tests/fixtures/values-render-domain.yaml -f secrets.yaml.default \
            --set-string global.domainName=release-validation.oriso.internal \
            --set-string global.emailBrandingName='Render Test Platform' \
            --set-string userService.smtpUser=smtp-validation-user \
            --set-string userService.smtpPassword=smtp-validation-password \
            -f tests/fixtures/render-required-secrets.yaml
          helm template oriso . -f values.yaml.default -f tests/fixtures/values-render-domain.yaml -f secrets.yaml.default \
            --set-string global.domainName=release-validation.oriso.internal \
            --set-string global.emailBrandingName='Render Test Platform' \
            --set-string userService.smtpUser=smtp-validation-user \
            --set-string userService.smtpPassword=smtp-validation-password \
            -f tests/fixtures/render-required-secrets.yaml \
            >/tmp/oriso-rendered.yaml
          # Without a domain the chart must refuse to render.
          if helm template oriso . -f values.yaml.default -f tests/fixtures/values-render-domain.yaml -f secrets.yaml.default \
            --set-string global.domainName= \
            --set-string global.emailBrandingName='Render Test Platform' \
            --set-string userService.smtpUser=smtp-validation-user \
            --set-string userService.smtpPassword=smtp-validation-password \
            -f tests/fixtures/render-required-secrets.yaml \
            >/dev/null 2>/tmp/oriso-no-domain.err; then
            echo "helm template rendered without global.domainName"; exit 1
          fi
          grep -q "global.domainName" /tmp/oriso-no-domain.err

      - name: Package Helm chart
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          helm package . --destination dist
          ls -lh dist

      - name: Create and push release tag
        if: ${{ inputs.create_tag }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$RELEASE_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release Helm chart v${VERSION}"
          git push origin "v${VERSION}"

      - name: Login to GitHub Container Registry
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push Helm chart to GHCR
        shell: bash
        run: |
          set -euo pipefail

          CHART_PACKAGE="$(find dist -maxdepth 1 -name '*.tgz' -print -quit)"

          if [[ -z "$CHART_PACKAGE" ]]; then
            echo "No packaged Helm chart found in dist/"
            exit 1
          fi

          helm push "$CHART_PACKAGE" "oci://${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.CHART_REPOSITORY }}"

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### Helm chart release"
            echo ""
            echo "- Git tag: \`v${{ inputs.version }}\`"
            echo "- Chart version: \`${{ inputs.version }}\`"
            echo "- Registry: \`oci://${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.CHART_REPOSITORY }}/online-counseling\`"
            echo ""
            echo "Deploy with:"
            echo ""
            echo "\`\`\`bash"
            echo "helm upgrade --install oriso oci://${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.CHART_REPOSITORY }}/online-counseling --version ${{ inputs.version }} --namespace oriso"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  documentation:
    name: Publish release sources and trigger documentation
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Rebuild the same source list from the original workflow event
        id: release-input
        env:
          ORISO_DOCS_RELEASE_TOKEN: ${{ secrets.ORISO_DOCS_RELEASE_TOKEN }}
        run: python3 scripts/release_documentation.py prepare --manifest "$RUNNER_TEMP/platform-release.json"
      - name: Fetch the same released Docs validator
        env:
          DOCS_RELEASE_REVISION: ${{ steps.release-input.outputs.documentation-revision }}
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/docs-release-source"
          git -C "$RUNNER_TEMP/docs-release-source" fetch --quiet --depth 1 https://github.com/OpenResilienceInitiative/ORISO-Docs.git "$DOCS_RELEASE_REVISION"
          git -C "$RUNNER_TEMP/docs-release-source" checkout --quiet --detach FETCH_HEAD
      - name: Publish immutable release source asset and send the same lock to Docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORISO_DOCS_RELEASE_TOKEN: ${{ secrets.ORISO_DOCS_RELEASE_TOKEN }}
        run: python3 scripts/release_documentation.py publish-and-dispatch --manifest "$RUNNER_TEMP/platform-release.json" --docs-root "$RUNNER_TEMP/docs-release-source"
      - name: Record the receiver acceptance boundary
        run: |
          echo 'Helm source manifest published; Docs event accepted. Check Docs/Understand workflow results and actual public bytes before calling publication complete.' >> "$GITHUB_STEP_SUMMARY"
