name: SigNoz private OTLP

on:
  pull_request:
    paths:
      - ".github/workflows/signoz-private-otlp.yml"
      - "charts/signoz/templates/otel-collector/**"
      - "charts/signoz/values.yaml"
      - "templates/signoz/private-otlp-validation.yaml"
      - "scripts/signoz_runtime_acceptance.py"
      - "tests/private_otlp_runtime.py"
      - "tests/render_signoz_private_otlp_test.py"

permissions:
  contents: read

jobs:
  private-otlp:
    name: Pinned Collector and private proxy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out chart
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt opentelemetry-proto==1.40.0
      - name: Verify the rendered private boundary on Linux
        run: python tests/private_otlp_runtime.py
