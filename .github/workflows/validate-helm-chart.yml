name: Validate Helm chart

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: validate-helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render, unit, and guardrail tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out chart
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint chart
        run: |
          helm lint . \
            -f values.yaml.default \
            -f secrets.yaml.default \
            --set-string global.secrets.redisdefaultPass=test-redis-password \
            --set-string userService.smtpUser=smtp-validation-user \
            --set-string userService.smtpPassword=smtp-validation-password

      - name: Package chart
        run: helm package . --destination /tmp/oriso-chart-package

      # The root chart renders k8s-infra only through the render contracts, and
      # `helm lint .` runs with `k8s-infra.enabled: false`. Validate the
      # vendored subchart on its own defaults as well, so a bad re-vendor is
      # caught here instead of at deploy time.
      - name: Validate vendored k8s-infra subchart
        shell: bash
        run: |
          set -euo pipefail
          # The subchart is vendored on some branches and not on others: it is
          # on pre-dev, not on dev. Linting it unconditionally failed this gate
          # for the whole chart on every branch that does not carry it, which
          # is why the gate was removed from dev in the first place. Skip when
          # absent so it starts covering the subchart the moment it lands.
          if [ ! -f charts/k8s-infra/Chart.yaml ]; then
            echo "::notice::charts/k8s-infra is not vendored on this branch; skipping its validation."
            exit 0
          fi
          helm lint charts/k8s-infra
          helm template k8s-infra-validation charts/k8s-infra \
            --namespace validation >/tmp/k8s-infra-rendered.yaml
          helm package charts/k8s-infra --destination /tmp/k8s-infra-package

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run render contracts
        shell: bash
        # Every contract runs, then the step reports all of them. `set -e` with a
        # bare loop stops at the first failure, so a branch with several unrelated
        # render defects surfaces them one per push -- and these contracts had not
        # run since 09.09, because this workflow was keyed on pre-dev and master.
        # Reporting once beats N round trips. Nothing is tolerated: any failure
        # still fails the step.
        run: |
          set -uo pipefail
          failed=()
          for test_file in tests/render_*_test.py; do
            echo "::group::${test_file}"
            if python "$test_file"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${test_file}::render contract failed"
              failed+=("$test_file")
            fi
          done

          total=$(ls tests/render_*_test.py | wc -l)
          echo "### Render contracts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ ${#failed[@]} -eq 0 ]; then
            echo "All ${total} contracts passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "${#failed[@]} of ${total} failed:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for test_file in "${failed[@]}"; do
            echo "- \`${test_file}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 1

      - name: Run shell guardrails
        shell: bash
        run: |
          set -euo pipefail
          bash tests/check-no-bare-ip-servername.sh
          bash tests/guardrail_selftest.sh
