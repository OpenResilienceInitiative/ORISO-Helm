name: Validate Helm Chart

on:
  pull_request:
  push:
    branches:
      - pre-dev
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Lint and render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install render-test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint . -f values.yaml.default -f secrets.yaml.default
          python tests/render_livekit_rollout_test.py
