name: Validate Helm chart

on:
  pull_request:
  push:
    branches:
      - pre-dev
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: validate-helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render, unit, and guardrail tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out chart
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint chart
        run: |
          helm lint . \
            -f values.yaml.default \
            -f secrets.yaml.default \
            --set-string global.secrets.redisdefaultPass=test-redis-password \
            --set-string userService.smtpUser=smtp-validation-user \
            --set-string userService.smtpPassword=smtp-validation-password

      - name: Package chart
        run: helm package . --destination /tmp/oriso-chart-package

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run render contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/render_*_test.py; do
            python "$test_file"
          done

      - name: Run shell guardrails
        shell: bash
        run: |
          set -euo pipefail
          bash tests/check-no-bare-ip-servername.sh
          bash tests/guardrail_selftest.sh
