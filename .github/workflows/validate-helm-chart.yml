name: Validate Helm chart

# Ported from pre-dev, which has had this workflow since 2026-09-01 while dev
# had no chart validation at all. The vendored charts/k8s-infra step is omitted:
# that subchart is part of the SigNoz k8s-infra work and exists only on pre-dev.
on:
  pull_request:
  push:
    branches:
      - pre-dev
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: validate-helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render, unit, and guardrail tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out chart
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out the reviewed receiver contract for offline tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenResilienceInitiative/ORISO-Docs
          ref: 90dbec3293ef740657a90bf4f96b86d4210beb13
          path: _contract_docs
          persist-credentials: false

      - name: Keep the test fixture outside the packaged chart
        run: mv "$GITHUB_WORKSPACE/_contract_docs" "$RUNNER_TEMP/oriso-docs-contract"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Lint chart
        run: |
          helm lint . \
            -f values.yaml.default \
            -f tests/fixtures/values-render-domain.yaml \
            -f secrets.yaml.default \
            -f tests/fixtures/render-required-secrets.yaml \
            --set-string global.emailBrandingName='Render Test Platform' \
            --set-string global.emailLegalOrganisationName='Render Test Foundation' \
            --set-string global.secrets.redisdefaultPass=test-redis-password \
            --set-string userService.smtpUser=smtp-validation-user \
            --set-string userService.smtpPassword=smtp-validation-password

      - name: Package chart
        run: helm package . --destination /tmp/oriso-chart-package

      - name: Run unit tests
        env:
          ORISO_DOCS_SOURCE_ROOT: ${{ runner.temp }}/oriso-docs-contract
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run render contracts
        shell: bash
        # Every contract runs and the step reports all of them. With `set -e`
        # a bare loop stops at the first failure, so one red contract hides
        # every contract after it and a branch with several unrelated defects
        # surfaces them one push at a time. Nothing is tolerated: any failure
        # still fails the step.
        run: |
          set -uo pipefail
          failed=()
          for test_file in tests/render_*_test.py; do
            echo "::group::${test_file}"
            if python "$test_file"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=${test_file}::render contract failed"
              failed+=("$test_file")
            fi
          done

          total=$(find tests -maxdepth 1 -name 'render_*_test.py' -print | wc -l | tr -d '[:space:]')
          {
            echo "### Render contracts"
            echo ""
            if [ ${#failed[@]} -eq 0 ]; then
              echo "All ${total} contracts passed."
            else
              echo "${#failed[@]} of ${total} failed:"
              echo ""
              for test_file in "${failed[@]}"; do
                echo "- \`${test_file}\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ ${#failed[@]} -eq 0 ]

      - name: Verify native Keycloak task tokens and repeated realm migration
        run: python tests/keycloak_task_migration_test.py

      - name: Run shell guardrails
        shell: bash
        run: |
          set -euo pipefail
          bash tests/check-no-bare-ip-servername.sh
          bash tests/guardrail_selftest.sh

  task-permission-matrix:
    name: Native task receivers and durable creation restart
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out chart under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: chart
          persist-credentials: false
      # Immutable external sources stay outside the packaged chart.
      - name: Check out TenantService receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenResilienceInitiative/ORISO-TenantService
          ref: af9a5aa3adccfeab37404f5cb30895b34213ef3e
          path: receivers/ORISO-TenantService
          persist-credentials: false
      - name: Check out AgencyService receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenResilienceInitiative/ORISO-AgencyService
          ref: 7780942a8fbef19c11bd6aeacab94d677f3905da
          path: receivers/ORISO-AgencyService
          persist-credentials: false
      - name: Check out ConsultingTypeService receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenResilienceInitiative/ORISO-ConsultingTypeService
          ref: fc3404819574f2c38a2e559910a2c84206e9001b
          path: receivers/ORISO-ConsultingTypeService
          persist-credentials: false
      - name: Check out UserService receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenResilienceInitiative/ORISO-UserService
          ref: d88ffa42f10e36ff8c308754331877fc0fe1b35a
          path: receivers/ORISO-UserService
          persist-credentials: false
      - name: Check out custom Keycloak provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: OpenResilienceInitiative/ORISO-Keycloak
          ref: b5de1fa089b413f56f6d880e71798b6c2d7bbd6e
          path: provider/ORISO-Keycloak
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: receivers/**/pom.xml
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install fixture parser
        run: python -m pip install --disable-pip-version-check -r chart/requirements-ci.txt
      - name: Verify native tokens at all four receiving HTTP servers
        run: >-
          python chart/tests/task_receiver_permission_matrix.py
          --receiver receivers/ORISO-TenantService
          --receiver receivers/ORISO-AgencyService
          --receiver receivers/ORISO-ConsultingTypeService
          --receiver receivers/ORISO-UserService
          --java-home "$JAVA_HOME"
      - name: Build exact custom provider image
        run: docker build --tag oriso-keycloak:joined-permission-contract provider/ORISO-Keycloak/keycloak-image
      - name: Verify provider wire and durable UserService crash recovery
        run: |
          set -euo pipefail
          started=$(date +%s)
          python provider/ORISO-Keycloak/scripts/test-task-command-permissions.py \
            --image oriso-keycloak:joined-permission-contract \
            --userservice-receiver receivers/ORISO-UserService \
            --userservice-java-home "$JAVA_HOME"
          python chart/tests/task_receiver_permission_matrix.py \
            --verify-creation-report receivers/ORISO-UserService --started "$started"
