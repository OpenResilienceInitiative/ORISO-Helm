name: Validate Helm Chart

on:
  pull_request:
  push:
    branches:
      - pre-dev
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Lint and render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install render-test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint . -f values.yaml.default -f secrets.yaml.default
          python tests/render_livekit_rollout_test.py
