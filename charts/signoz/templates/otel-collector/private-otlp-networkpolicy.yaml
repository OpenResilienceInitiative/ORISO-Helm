{{- if .Values.otelCollector.privateOtlp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "otelCollector.fullname" . }}-private-otlp
  labels:
    {{- include "otelCollector.labels" . | nindent 4 }}
spec:
  # Select legacy and guarded Pods so the new rule also covers a rolling switch.
  podSelector:
    matchLabels:
      {{- include "otelCollector.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.otelCollector.privateOtlp.producerMatchLabels }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 4322
{{- end }}
