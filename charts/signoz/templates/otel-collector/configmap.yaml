{{- $private := .Values.otelCollector.privateOtlp.enabled -}}
{{- if not (kindIs "bool" $private) -}}
{{- fail "otelCollector.privateOtlp.enabled must be a boolean" -}}
{{- end -}}
{{- if $private -}}
{{- include "otelCollector.validatePrivateOtlp" . -}}
{{- end -}}
{{- $orisoPolicy := fromYaml (.Files.Get "files/oriso-otel-collector-policy.yaml") -}}
{{- $collectorConfig := mergeOverwrite (deepCopy .Values.otelCollector.config) $orisoPolicy -}}
{{- if .Values.otelCollector.ciLogIngest.enabled -}}
{{- $_ := mergeOverwrite $collectorConfig (fromYaml (.Files.Get "files/oriso-ci-log-policy.yaml")) -}}
{{- end -}}
{{- $receivers := get $collectorConfig "receivers" | default dict -}}
{{- $_ := unset $receivers "jaeger" -}}
{{- $_ := unset $receivers "httplogreceiver/heroku" -}}
{{- $_ := unset $receivers "httplogreceiver/json" -}}
{{- if not (dig "ports" "otlp-e2e" "enabled" false .Values.otelCollector) -}}
{{- $_ := unset $receivers "otlp/e2e" -}}
{{- $processors := get $collectorConfig "processors" | default dict -}}
{{- $_ := unset $processors "filter/e2e" -}}
{{- $_ := unset $processors "transform/e2e" -}}
{{- $pipelines := dig "service" "pipelines" (dict) $collectorConfig -}}
{{- $_ := unset $pipelines "traces/e2e" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otelCollector.fullname" . }}
  labels:
    {{- include "otelCollector.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |-
    {{- if $private }}
    {{- include "otelCollector.privateConfig" . | nindent 4 }}
    {{- else }}
    {{- toYaml $collectorConfig | nindent 4 }}
    {{- end }}
  {{- if $private }}
  private-otlp.conf: |-
    {{- include "otelCollector.privateProxyConfig" . | nindent 4 }}
binaryData:
  # google.rpc.Status with the fixed message "OTLP request failed".
  private-otlp-error.pb: EhNPVExQIHJlcXVlc3QgZmFpbGVk
  {{- else }}
  otel-collector-opamp-config.yaml: |-
    server_endpoint: "ws://{{ include "signoz.fullname" . }}:4320/v1/opamp"
  {{- end }}
