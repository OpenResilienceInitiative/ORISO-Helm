apiVersion: apps/v1
kind: StatefulSet
{{ $storageClass := .Values.global.storageClass }}
{{ $existingStatefulSet := lookup "apps/v1" "StatefulSet" .Release.Namespace "mongodb" }}
{{ if and $existingStatefulSet $existingStatefulSet.spec.volumeClaimTemplates }}
{{ $existingClaim := index $existingStatefulSet.spec.volumeClaimTemplates 0 }}
{{ if hasKey $existingClaim.spec "storageClassName" }}
{{ $storageClass = $existingClaim.spec.storageClassName | default "" }}
{{ else }}
{{ $storageClass = "" }}
{{ end }}
{{ end }}
metadata: 
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
     app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 999 "fsGroup" 999) | nindent 8 }}
      initContainers:
        - name: add-keyfile
          image: {{ .Values.imageName }}:{{ .Values.imageVersion }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command: ["bash", "-c"]
          # rm first: the old key is read-only for its owner, and fsGroup adds group bits.
          args:
            - >
              rm -f /data/key/replica.key &&
              cp /data/replica.key.tmp /data/key/replica.key &&
              chmod 400 /data/key/replica.key
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict) | nindent 12 }}
          volumeMounts:
            - mountPath: /data/replica.key.tmp
              subPath: replica.key.tmp
              name: replica-key
            - mountPath: /data/key
              name: mongodb-data
      containers:
        - name: mongodb
          image: {{ .Values.imageName }}:{{ .Values.imageVersion }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          args:
          - --bind_ip_all
          - --oplogSize
          - "128"
          - --replSet
          - rs0
          - --keyFile
          - /data/key/replica.key
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  mongosh --username "$MONGODB_USERNAME" --password "$MONGODB_PASSWORD" --authenticationDatabase admin --eval "try { rs.status().ok } catch(e) { rs.initiate({_id: 'rs0', members: [{ _id: 0, host: 'mongodb-0.mongodb.{{ .Release.Namespace }}.svc.cluster.local:27017' }]}) }"
            timeoutSeconds: 30
            initialDelaySeconds: 20
          env:
            # mongosh in the readiness probe writes its history under $HOME.
            - name: HOME
              value: /tmp
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: MONGO_INITDB_ROOT_USERNAME
                  name: mongodb-secret
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MONGO_INITDB_ROOT_PASSWORD
                  name: mongodb-secret
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: MONGO_INITDB_ROOT_USERNAME
                  name: mongodb-secret
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MONGO_INITDB_ROOT_PASSWORD
                  name: mongodb-secret
          ports:
            - containerPort: 27017
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict) | nindent 12 }}
          volumeMounts:
            - mountPath: /data/db
              name: mongodb-data
            - mountPath: /data/key
              name: mongodb-data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: replica-key
          secret:
            secretName: mongodb-secret-replica
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 8Gi
        {{- if $storageClass }}
        storageClassName: {{ $storageClass | quote }}
        {{- end }}
