apiVersion: apps/v1
kind: StatefulSet
{{ $storageClass := .Values.global.storageClass }}
{{ $existingStatefulSet := lookup "apps/v1" "StatefulSet" .Release.Namespace "mariadb" }}
{{ if and $existingStatefulSet $existingStatefulSet.spec.volumeClaimTemplates }}
{{ $existingClaim := index $existingStatefulSet.spec.volumeClaimTemplates 0 }}
{{ if hasKey $existingClaim.spec "storageClassName" }}
{{ $storageClass = $existingClaim.spec.storageClassName | default "" }}
{{ else }}
{{ $storageClass = "" }}
{{ end }}
{{ end }}
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 999 "fsGroup" 999) | nindent 8 }}
      containers:
        - name: mariadb
          image: {{ .Values.imageName }}:{{ .Values.imageVersion }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MYSQL_ROOT_PASSWORD         
          ports:
            - containerPort: 3306
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict) | nindent 12 }}
          volumeMounts:
            - mountPath: /run/mysqld
              name: run
            - mountPath: /tmp
              name: tmp
            - mountPath: /docker-entrypoint-initdb.d/
              name: init-sql
            - mountPath: /var/lib/mysql
              name: mariadb-data
            - name: config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf

      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init-sql
          secret:
            secretName: mariadb-initsql
        - name: config
          configMap:
            name: mariadb-configmap

  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
        {{- if $storageClass }}
        storageClassName: {{ $storageClass | quote }}
        {{- end }}
