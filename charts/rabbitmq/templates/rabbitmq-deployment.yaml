apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 999) | nindent 8 }}
      containers:
        - name: rabbitmq
          image: {{ .Values.imageName }}:{{ .Values.imageVersion }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          ports:
            - containerPort: 5672
              protocol: TCP
            - containerPort: 15672
              protocol: TCP
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict) | nindent 12 }}
          volumeMounts:
            - mountPath: /var/lib/rabbitmq
              name: data
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
