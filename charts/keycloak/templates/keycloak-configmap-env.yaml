apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-configmap-env
data:
    DB_VENDOR: {{ .Values.dbVendor | quote }}
    DB_ADDR: "{{ .Values.dbServer }}.{{ .Release.Namespace }}"
    DB_DATABASE: "{{ .Values.dbDatabase }}"
    PROXY_ADDRESS_FORWARDING: "true"
    KEYCLOAK_HOSTNAME: {{ printf "%s/auth" (include "oriso.publicOrigin" .) | quote }}
    # Public app origin for the links in Keycloak mails (OTP, password reset).
    # The email theme reads it as ORISO_APP_BASE_URL (ORISO-Helm#366).
    ORISO_APP_BASE_URL: {{ include "oriso.publicOrigin" . | quote }}
    # Logging
    # Supported log levels are ALL, DEBUG, ERROR, FATAL, INFO, OFF, TRACE and WARN.
    KEYCLOAK_LOGLEVEL: {{ .Values.keycloakLogLevel | quote }}
    ROOT_LOGLEVEL: {{ .Values.rootLogLevel | quote }}
    {{- if .Values.global.useKubernetesCache }}
    KC_CACHE_STACK: kubernetes
    {{- end }}
