{{- $probes := .Values.keycloakProbes | default dict -}}
{{- $configuredReplicas := dig "replicas" 1 .Values.AsMap -}}
{{- $replicas := int64 $configuredReplicas -}}
{{- if or (not (regexMatch "^[1-9][0-9]*$" (toString $configuredReplicas))) (lt $replicas 1) (gt $replicas 2147483647) -}}
{{- fail "online-counseling-keycloak.replicas must be a positive 32-bit integer" -}}
{{- end -}}
{{- $clustered := gt $replicas 1 -}}
{{- $managementProbes := or $clustered ($probes.useManagementPort | default false) -}}
{{- $scrapeMetrics := eq (include "oriso.appMetrics.enabled" .) "true" -}}
{{- $management := or $scrapeMetrics $managementProbes -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        checksum/email-identity: {{ printf "%s\x00%s" (include "oriso.emailBrandingName" .) (include "oriso.emailLegalOrganisationName" .) | sha256sum | quote }}
        {{- if $scrapeMetrics }}
        {{- include "oriso.appMetrics.podAnnotations" (dict "job" "keycloak" "port" 9000 "path" "/auth/metrics") | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      {{- if $clustered }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: keycloak
                topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 1000) | nindent 8 }}
      {{- if .Values.keycloakServiceAccount }}
      serviceAccountName: {{ .Values.keycloakServiceAccount | quote }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      initContainers:
        - name: wait-for-mariadb
          image: busybox:1.36
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command: ['sh', '-c', 'until nc -z {{ .Values.dbServer }}.{{ .Release.Namespace }} 3306; do echo waiting for mariadb; sleep 2; done']
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict) | nindent 12 }}
      containers:
        - name: keycloak
          image: "{{ .Values.imageName }}:{{ .Values.imageVersion }}"
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          ports:
            - containerPort: 8080
            {{- if $clustered }}
            - name: cache-transport
              containerPort: 7800
            - name: cache-failure
              containerPort: 57800
            {{- end }}
            {{- if $management }}
            # Management health checks and metrics are served only on the pod port.
            - name: management
              containerPort: 9000
            {{- end }}
          {{- if .Values.keycloakResources }}
          resources:
            {{- toYaml .Values.keycloakResources | nindent 12 }}
          {{- end }}
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start
            # Imports realm.json only when the realm is absent; existing realms are skipped.
            # Keep this out of lifecycle hooks so pod restarts never re-import over live data.
            - --import-realm
          env:
            # Keep this mitigation until all deployed Java builds fix CVE-2026-114938.
            - name: JAVA_OPTS_APPEND
              value: "-XX:-UseBASE64Intrinsics"
            - name: KC_DB
              valueFrom:
                configMapKeyRef:
                  key: DB_VENDOR
                  name: keycloak-configmap-env
            - name: KC_DB_URL_HOST
              valueFrom:
                configMapKeyRef:
                  key: DB_ADDR
                  name: keycloak-configmap-env
            - name: KC_DB_URL_DATABASE
              valueFrom:
                configMapKeyRef:
                  key: DB_DATABASE
                  name: keycloak-configmap-env
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: DB_USER
                  name: keycloak-secret-env
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DB_PASSWORD
                  name: keycloak-secret-env
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  key: KEYCLOAK_ADMIN
                  name: keycloak-secret-env
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: KEYCLOAK_ADMIN_PASSWORD
                  name: keycloak-secret-env
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            {{- if $clustered }}
            - name: KC_CACHE
              value: "ispn"
            - name: KC_CACHE_STACK
              value: "jdbc-ping"
            {{- end }}
            {{- if $managementProbes }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            {{- end }}
            {{- if $management }}
            # Readiness includes the DB connection pool check when metrics are enabled.
            - name: KC_METRICS_ENABLED
              value: "true"
            {{- end }}
            {{- if $scrapeMetrics }}
            # Login/2FA event counters tagged by realm, IdP and client only, never by user.
            - name: KC_EVENT_METRICS_USER_ENABLED
              value: "true"
            {{- end }}
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  key: KEYCLOAK_HOSTNAME
                  name: keycloak-configmap-env
            - name: ORISO_APP_BASE_URL
              valueFrom:
                configMapKeyRef:
                  key: ORISO_APP_BASE_URL
                  name: keycloak-configmap-env
            - name: EMAIL_BRANDING_NAME
              valueFrom:
                configMapKeyRef:
                  key: EMAIL_BRANDING_NAME
                  name: keycloak-configmap-env
            - name: EMAIL_LEGAL_ORGANISATION_NAME
              valueFrom:
                configMapKeyRef:
                  key: EMAIL_LEGAL_ORGANISATION_NAME
                  name: keycloak-configmap-env
            - name: ORISO_LOGO_URL
              valueFrom:
                configMapKeyRef:
                  key: ORISO_LOGO_URL
                  name: keycloak-configmap-env
            {{- if not .Values.global.enableTls }}
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            {{- end }}
            - name: KC_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  key: ROOT_LOGLEVEL
                  name: keycloak-configmap-env
            # Human OTP credentials keep Keycloak's concurrency guard. Service clients
            # use client_credentials and are not subject to per-user brute-force locks.
            - name: KC_SPI_BRUTE_FORCE_PROTECTOR__DEFAULT_BRUTE_FORCE_DETECTOR__ALLOW_CONCURRENT_REQUESTS
              value: {{ dig "bruteForce" "allowConcurrentRequests" false .Values.AsMap | toString | quote }}
          # kc.sh start re-augments into lib/ when build options change and keeps
          # transaction logs and temp files under data/.
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict "readOnly" false) | nindent 12 }}
          {{- if or $managementProbes (hasKey $probes "startup") (hasKey $probes "liveness") (hasKey $probes "readiness") }}
          {{- $healthPath := ternary "/auth/health" "/health" $managementProbes }}
          {{- $probePort := ternary "management" 8080 $managementProbes }}
          {{- $startup := $probes.startup | default dict }}
          {{- $liveness := $probes.liveness | default dict }}
          {{- $readiness := $probes.readiness | default dict }}
          startupProbe:
            httpGet:
              path: {{ $startup.path | default (printf "%s/started" $healthPath) | quote }}
              port: {{ $probePort }}
            initialDelaySeconds: {{ $startup.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $startup.periodSeconds | default 10 }}
            failureThreshold: {{ $startup.failureThreshold | default 60 }}
          livenessProbe:
            httpGet:
              path: {{ $liveness.path | default (printf "%s/live" $healthPath) | quote }}
              port: {{ $probePort }}
            initialDelaySeconds: {{ $liveness.initialDelaySeconds | default 60 }}
            periodSeconds: {{ $liveness.periodSeconds | default 30 }}
            failureThreshold: {{ $liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ $readiness.path | default (printf "%s/ready" $healthPath) | quote }}
              port: {{ $probePort }}
            initialDelaySeconds: {{ $readiness.initialDelaySeconds | default 30 }}
            periodSeconds: {{ $readiness.periodSeconds | default 10 }}
            failureThreshold: {{ $readiness.failureThreshold | default 3 }}
          {{- end }}
          volumeMounts:
            - mountPath: /opt/keycloak/themes/custom-theme/login
              name: keycloak-theme-templates
            - mountPath: /opt/keycloak/themes/custom-theme/login/messages
              name: keycloak-theme-templates-messages
            - mountPath: /opt/keycloak/themes/custom-theme/login/resources/css
              name: keycloak-theme-templates-styles
            - mountPath: /opt/keycloak/themes/custom-theme/login/resources/fonts/Nunito
              name: keycloak-theme-templates-fonts
            - mountPath: /opt/keycloak/data/import
              name: keycloak-full-dump
      volumes:
        - name: keycloak-theme-templates
          configMap:
            name: keycloak-configmap-theme-templates
        - name: keycloak-theme-templates-messages
          configMap:
            name: keycloak-configmap-theme-templates-messages
        - name: keycloak-theme-templates-styles
          configMap:
            name: keycloak-configmap-theme-templates-styles
        - name: keycloak-theme-templates-fonts
          configMap:
            name: keycloak-configmap-theme-templates-fonts
        - name: keycloak-full-dump
          configMap:
            name: keycloak-configmap-data
