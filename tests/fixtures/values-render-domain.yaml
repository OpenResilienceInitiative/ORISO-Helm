# Render-test base layer: a valid public host so render contracts that do not
# test the domain itself pass the global.domainName gate (ORISO-Helm#366).
# Layer it directly after values.yaml.default; later overlays and --set win.
# Reserved example domains (example.com/.org/.net/.test) and .invalid are
# rejected as placeholders, so render tests use the private .internal TLD.
global:
  domainName: "render.oriso.internal"
  matrix:
    matrixServerName: "matrix.render.oriso.internal"
# The Matrix identity is required too; values.yaml.default ships only the
# "your-server.local" placeholder, which fails the install.
matrix:
  matrixServerName: "matrix.render.oriso.internal"
  synapseServerName: "matrix.render.oriso.internal"
matrixrtcAuth:
  membershipReaderUserId: "@matrixrtc-auth:matrix.render.oriso.internal"
# Non-secret deployment SMTP values for unrelated chart render tests. Tests
# intentionally checking missing settings override these with empty values.
userService:
  smtpHost: "smtp.render.oriso.internal"
  smtpFrom: "ORISO Render <sender@render.oriso.internal>"
