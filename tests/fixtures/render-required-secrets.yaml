# Render-only values for tests and CI validation renders. secrets.yaml.default
# ships placeholders the chart deliberately rejects (ORISO-Helm#367), so every
# render of the example files has to supply these on top. Not real secrets.
global:
  keycloak:
    serviceTechUserId: "00000000-0000-4000-8000-000000000000"
  secrets:
    keycloakServiceAdminPassword: "render-only-not-a-real-secret"
