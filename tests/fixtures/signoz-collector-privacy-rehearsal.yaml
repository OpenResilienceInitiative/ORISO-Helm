# Synthetic rehearsal contract for the pinned collector, with no chart wiring.
filter/privacy:
  error_mode: propagate
  traces:
    span:
      - 'resource.attributes["service.name"] != "oriso-privacy-fixture"'
      - 'span.kind != SPAN_KIND_SERVER'
      - 'span.attributes["http.request.method"] != "GET"'
      - 'span.attributes["http.route"] != "/canary/health"'
      - 'not IsInt(span.attributes["http.response.status_code"])'
      - 'span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599'
      - 'Len(span.links) > 0'
    spanevent:
      - 'true'
  metrics:
    metric:
      - 'resource.attributes["service.name"] != "oriso-privacy-fixture"'
      - 'metric.name != "oriso.privacy.rehearsal.ms" or metric.type != METRIC_DATA_TYPE_GAUGE'
    datapoint:
      - 'Len(datapoint.exemplars) > 0'
transform/privacy:
  error_mode: propagate
  trace_statements:
    - context: resource
      statements:
        - 'keep_keys(attributes, ["service.name"])'
        - 'set(schema_url, "")'
    - context: scope
      statements:
        - 'keep_keys(attributes, [])'
        - 'set(schema_url, "")'
        - 'set(name, "oriso.privacy.rehearsal")'
        - 'set(version, "")'
    - context: span
      statements:
        - 'keep_keys(attributes, ["http.response.status_code"])'
        - 'set(name, "GET /canary/health")'
        - 'set(trace_state, "")'
        - 'set(status.message, "")'
  metric_statements:
    - context: resource
      statements:
        - 'keep_keys(attributes, ["service.name"])'
        - 'set(schema_url, "")'
    - context: scope
      statements:
        - 'keep_keys(attributes, [])'
        - 'set(schema_url, "")'
        - 'set(name, "oriso.privacy.rehearsal")'
        - 'set(version, "")'
    - context: metric
      statements:
        - 'set(description, "")'
        - 'set(unit, "ms")'
    - context: datapoint
      statements:
        - 'keep_keys(attributes, [])'
