worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events {
    worker_connections 256;
}
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";

    server {
        listen 8080;

        location = /healthz {
            return 204;
        }
        {{- if .uiEnabled }}

        location = /signoz {
            return 301 https://{{ .domain }}/signoz/$is_args$args;
        }
        {{- end }}
        {{- if .rum }}

        location = /signoz-rum/v1/metrics {
            if ($request_method != POST) { return 405; }
            if ($http_content_encoding != "") { return 415; }
            client_max_body_size 32k;
            proxy_pass http://{{ .rum }}/v1/metrics;
        }
        {{- end }}
        {{- if .e2e }}

        location = /signoz-e2e/v1/traces {
            if ($request_uri != "/signoz-e2e/v1/traces") { return 404; }
            if ($request_method != POST) { return 405; }
            if ($http_content_encoding != "") { return 415; }
            client_max_body_size 256k;
            proxy_pass http://{{ .e2e }}/v1/traces;
        }
        {{- end }}

        location / {
            return 404;
        }
    }
}
