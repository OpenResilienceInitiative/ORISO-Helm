
exporters:
  otlphttp:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      signoz-access-token: ${env:SIGNOZ_API_KEY}
    tls:
      insecure: true
      insecure_skip_verify: false
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: localhost:1777
  zpages:
    endpoint: localhost:55679
processors:
  batch:
    send_batch_size: 10000
    timeout: 1s
  k8sattributes:
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.cronjob.name
      - k8s.job.name
      - k8s.node.name
      - k8s.node.uid
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.pod.start_time
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: connection
  resource/deployenv:
    attributes:
    - action: insert
      key: deployment.environment
      value: ${env:DEPLOYMENT_ENVIRONMENT}
  resourcedetection:
    detectors:
    - env
    override: false
    timeout: 2s
receivers:
  k8s_cluster:
    allocatable_types_to_report:
    - cpu
    - memory
    collection_interval: 30s
    metrics:
      k8s.container.status.reason:
        enabled: true
      k8s.container.status.state:
        enabled: true
      k8s.node.condition:
        enabled: true
      k8s.pod.status_reason:
        enabled: true
    node_conditions_to_report:
    - Ready
    - MemoryPressure
    - DiskPressure
    - PIDPressure
    - NetworkUnavailable
    resource_attributes:
      container.runtime:
        enabled: true
      container.runtime.version:
        enabled: true
      k8s.container.status.last_terminated_reason:
        enabled: true
      k8s.kubelet.version:
        enabled: true
      k8s.pod.qos_class:
        enabled: true
  k8s_events:
    auth_type: serviceAccount
    namespaces:
    - ${env:K8S_NAMESPACE}
{{- if eq (include "oriso.podScrape.enabled" .) "true" }}
  # Pod metrics (global.observability.appMetrics or dbMetrics): scrapes only pods in
  # the release namespace that carry oriso.io/scrape="true", on the port and
  # path from their oriso.io/* annotations. `$$` escapes the collector's own
  # ${env:...} expansion inside the relabel replacement.
  prometheus/oriso-apps:
    config:
      scrape_configs:
      - job_name: oriso-apps
        scrape_interval: 30s
        scrape_timeout: 10s
        kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
            - {{ .Release.Namespace }}
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_oriso_io_scrape]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_pod_annotation_oriso_io_path]
          action: replace
          regex: (.+)
          target_label: __metrics_path__
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_oriso_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $$1:$$2
          target_label: __address__
        - source_labels: [__meta_kubernetes_pod_annotation_oriso_io_job]
          action: replace
          target_label: job
        - source_labels: [__meta_kubernetes_namespace]
          target_label: k8s_namespace_name
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: k8s_pod_name
{{- end }}
{{- if eq (include "oriso.dbMetrics.enabled" .) "true" }}
  # Data store metrics (global.observability.dbMetrics): status counters only,
  # read with the monitoring users db-monitoring-reconcile-job maintains.
  mysql:
    endpoint: mariadb.{{ .Release.Namespace }}:3306
    username: oriso_monitor
    password: ${env:DBMON_MARIADB_PASSWORD}
    collection_interval: 60s
  mongodb:
    hosts:
    - endpoint: mongodb.{{ .Release.Namespace }}:27017
    username: oriso_monitor
    password: ${env:DBMON_MONGODB_PASSWORD}
    direct_connection: true
    collection_interval: 60s
    tls:
      insecure: true
    metrics:
      # MongoDB 5 no longer reports the WiredTiger flush counter; without this the
      # receiver logs "could not find key" on every collection.
      mongodb.flushes.rate:
        enabled: false
  rabbitmq:
    endpoint: http://rabbitmq.{{ .Release.Namespace }}:15672
    username: oriso-monitor
    password: ${env:DBMON_RABBITMQ_PASSWORD}
    collection_interval: 60s
{{- end }}
service:
  extensions:
  - health_check
  - zpages
  - pprof
  pipelines:
    logs:
      exporters:
      - otlphttp
      processors:
      - resource/deployenv
      - k8sattributes
      - resourcedetection
      - batch
      receivers:
      - k8s_events
    metrics/internal:
      exporters:
      - otlphttp
      processors:
      - resource/deployenv
      - k8sattributes
      - resourcedetection
      - batch
      receivers:
      - k8s_cluster
{{- if eq (include "oriso.podScrape.enabled" .) "true" }}
    metrics/apps:
      exporters:
      - otlphttp
      processors:
      - resource/deployenv
      - resourcedetection
      - batch
      receivers:
      - prometheus/oriso-apps
{{- end }}
{{- if eq (include "oriso.dbMetrics.enabled" .) "true" }}
    metrics/dbs:
      exporters:
      - otlphttp
      processors:
      - resource/deployenv
      - resourcedetection
      - batch
      receivers:
      - mysql
      - mongodb
      - rabbitmq
{{- end }}
  telemetry:
    logs:
      encoding: json
    metrics:
      level: detailed
      readers:
      - periodic:
          exporter:
            otlp:
              compression: gzip
              endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
              headers:
                signoz-ingestion-key: ${env:SIGNOZ_SELF_TELEMETRY_API_KEY}
              insecure: true
              protocol: http/protobuf
    resource:
      deployment.environment: ${env:DEPLOYMENT_ENVIRONMENT}
      k8s.cluster.name: ${env:K8S_CLUSTER_NAME}
      k8s.container.name: ${env:K8S_CONTAINER_NAME}
      k8s.namespace.name: ${env:K8S_NAMESPACE}
      k8s.node.name: ${env:K8S_NODE_NAME}
      k8s.pod.name: ${env:K8S_POD_NAME}
      service.name: oriso-k8s-infra-cluster