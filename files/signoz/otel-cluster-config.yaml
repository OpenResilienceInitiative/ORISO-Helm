
exporters:
  otlphttp:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers:
      signoz-access-token: ${env:SIGNOZ_API_KEY}
    tls:
      insecure: true
      insecure_skip_verify: false
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: localhost:1777
  zpages:
    endpoint: localhost:55679
processors:
  batch:
    send_batch_size: 10000
    timeout: 1s
  k8sattributes:
    extract:
      metadata:
      - k8s.namespace.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.cronjob.name
      - k8s.job.name
      - k8s.node.name
      - k8s.node.uid
      - k8s.pod.name
      - k8s.pod.uid
      - k8s.pod.start_time
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.ip
    - sources:
      - from: resource_attribute
        name: k8s.pod.uid
    - sources:
      - from: connection
  resource/deployenv:
    attributes:
    - action: insert
      key: deployment.environment
      value: ${env:DEPLOYMENT_ENVIRONMENT}
  resourcedetection:
    detectors:
    - env
    override: false
    timeout: 2s
receivers:
  k8s_cluster:
    allocatable_types_to_report:
    - cpu
    - memory
    collection_interval: 30s
    metrics:
      k8s.container.status.reason:
        enabled: true
      k8s.container.status.state:
        enabled: true
      k8s.node.condition:
        enabled: true
      k8s.pod.status_reason:
        enabled: true
    node_conditions_to_report:
    - Ready
    - MemoryPressure
    - DiskPressure
    - PIDPressure
    - NetworkUnavailable
    resource_attributes:
      container.runtime:
        enabled: true
      container.runtime.version:
        enabled: true
      k8s.container.status.last_terminated_reason:
        enabled: true
      k8s.kubelet.version:
        enabled: true
      k8s.pod.qos_class:
        enabled: true
  k8s_events:
    auth_type: serviceAccount
    namespaces:
    - ${env:K8S_NAMESPACE}
service:
  extensions:
  - health_check
  - zpages
  - pprof
  pipelines:
    logs:
      exporters:
      - otlphttp
      processors:
      - resource/deployenv
      - k8sattributes
      - resourcedetection
      - batch
      receivers:
      - k8s_events
    metrics/internal:
      exporters:
      - otlphttp
      processors:
      - resource/deployenv
      - k8sattributes
      - resourcedetection
      - batch
      receivers:
      - k8s_cluster
  telemetry:
    logs:
      encoding: json
    metrics:
      level: detailed
      readers:
      - periodic:
          exporter:
            otlp:
              compression: gzip
              endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
              headers:
                signoz-ingestion-key: ${env:SIGNOZ_SELF_TELEMETRY_API_KEY}
              insecure: true
              protocol: http/protobuf
    resource:
      deployment.environment: ${env:DEPLOYMENT_ENVIRONMENT}
      k8s.cluster.name: ${env:K8S_CLUSTER_NAME}
      k8s.container.name: ${env:K8S_CONTAINER_NAME}
      k8s.namespace.name: ${env:K8S_NAMESPACE}
      k8s.node.name: ${env:K8S_NODE_NAME}
      k8s.pod.name: ${env:K8S_POD_NAME}
      service.name: oriso-k8s-infra-cluster