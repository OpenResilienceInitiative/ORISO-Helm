# Production overlay for the ORISO chart.
#
# Apply ON TOP of your base values, e.g.:
#   helm upgrade --install caritas ./ -n caritas --create-namespace \
#     -f values.yaml -f values-prod.yaml -f secrets.yaml \
#     --set global.domainName=<public host> \
#     --set matrix.matrixServerName=<matrix host> ...
#
# This overlay names no host on purpose (ORISO-Helm#366). The operator
# supplies the public host and the Matrix identity at install time, in the
# environment's own values file or with --set. Without them `helm install`
# stops and names the missing value; there is no default.
#
# The base values.yaml.default is already prod-safe (springProfilesActive:prod,
# initializeDummyData:false), so this overlay is mostly explicit re-assertion +
# the decisions a production operator must make. Tracking: #24.
#
# The production hoster runs this via ArgoCD on gridscale; align the values
# below (and ingress/cert-manager toggles) with them — see issue #25.

global:
  # Production public host: REQUIRED at install, no default. Every public URL,
  # mail link (Magic Link, password reset, invites, DPA signing, Keycloak mails)
  # and ingress host derives from it; App and Admin (/admin) share this host.
  # domainName: set by the operator
  initializeDummyData: false
  # matrix.matrixServerName: REQUIRED at install (same host as the Matrix identity below)
  observability:
    otlpEnabled: false
    deploymentEnvironment: "production"

agencyService:
  springProfilesActive: "prod"
  liquibaseContexts: "production"
tenantService:
  springProfilesActive: "prod"
  liquibaseContexts: "prod"
consultingTypeService:
  liquibaseContexts: "prod"
userService:
  springProfilesActive: "prod"

  # ADR-018 Global Support Access is off in production. Enabling it is a deliberate policy decision
  # that presupposes real Global Support Admin accounts with enrolled second factors and an agreed
  # operational alerting posture — it is not a rollout default.
  supportAccess:
    enabled: "false"
  # OTP is enabled by default in prod to match the platform security posture.
  # This is login posture only and is unrelated to message/data encryption
  # (always on).
  otpAllowedForUsers: "true"
  otpAllowedForConsultants: "true"
  otpAllowedForSingleTenantAdmins: "true"
  otpAllowedForTenantSuperAdmins: "true"
  otpAllowedForRestrictedAgencyAdmins: "true"

  # Mail-link base URLs (Magic Link, password reset, account invite) derive
  # from global.domainName above. Set them here only if App or Admin move to a
  # separate host.

# Matrix federation identity (ADR-005 canonical server_name): REQUIRED at
# install, no default. It is baked into every user and room ID, so choose it
# once per installation and never change it. Set matrix.synapseServerName,
# matrix.matrixServerName, global.matrix.matrixServerName and
# matrixrtcAuth.membershipReaderUserId (@matrixrtc-auth:<matrix host>).
