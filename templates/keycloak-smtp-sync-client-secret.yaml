apiVersion: v1
kind: Secret
metadata:
  name: keycloak-smtp-sync-client
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # Realm client for the SMTP sync Jobs only (manage-realm, ORISO realm). Kept
  # apart from keycloak-backend-client-secrets so backends never receive it.
  {{- $secret := .Values.global.secrets.keycloakSmtpSyncClientSecret | default "" | toString }}
  {{- if or (lt (len $secret) 32) (not (regexMatch "^[[:print:]]+$" $secret)) }}
  {{- fail "global.secrets.keycloakSmtpSyncClientSecret must be an independent persistent secret of at least 32 printable characters" }}
  {{- end }}
  {{- if has $secret (list (.Values.global.secrets.keycloakBackendTechnicalClientSecret | default "" | toString) (.Values.global.secrets.keycloakBackendAdminClientSecret | default "" | toString)) }}
  {{- fail "global.secrets.keycloakSmtpSyncClientSecret must differ from the backend client secrets" }}
  {{- end }}
  KEYCLOAK_SMTP_SYNC_CLIENT_SECRET: {{ $secret | b64enc | quote }}
