apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrixrtc-auth-policy-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: matrixrtc-auth-policy-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # A bare podSelector only ever matches pods in this namespace, but the
    # ingress controller may run in another one. If the controller is not
    # admitted, every /livekit/jwt request times out (502/504) and no call can
    # connect. The peer matches the controller pods only, never a whole namespace.
    - from:
        {{- include "oriso.matrixrtc.ingressControllerPeer" . | nindent 8 }}
        - podSelector:
            matchLabels:
              app: element-call
        {{- if (eq (include "oriso.matrixrtcLifecycle.enabled" .) "true") }}
        - podSelector:
            matchLabels:
              app: userservice
        - podSelector:
            matchLabels:
              app: livekit
        {{- end }}
      ports:
        - protocol: TCP
          port: 3010
  egress:
    {{- if (eq (include "oriso.matrixrtcLifecycle.enabled" .) "true") }}
    - to:
        - podSelector:
            matchLabels:
              app: livekit
      ports:
        - protocol: TCP
          port: 7880
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- end }}
    - to:
        - podSelector:
            matchLabels:
              app: matrixrtc-authorization-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: userservice
      ports:
        - protocol: TCP
          # NetworkPolicy is evaluated after Service DNAT on PreDev, so this
          # must be the UserService pod targetPort, not the Service port.
          port: 8082
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrixrtc-authorization-service
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: matrixrtc-authorization-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: matrixrtc-auth-policy-gateway
        - podSelector:
            matchLabels:
              app: livekit
        {{- /*
          LiveKit runs with hostNetwork, so CNIs that treat host-network traffic as
          node traffic do not match the podSelector above once LiveKit and this
          receiver run on different nodes; the signed /sfu_webhook callbacks are
          then dropped. Operators may admit the exact LiveKit node addresses here.
          Port 8080 also serves the token endpoints the policy gateway fronts, so
          every listed address bypasses that gateway: list only nodes eligible for
          LiveKit, never a cluster-wide or catch-all range. Empty keeps the
          pod-only boundary.
        */}}
        {{- range $cidr := (.Values.matrixrtcAuth.livekitNodeCidrs | default list) }}
        {{- $value := toString $cidr | trim }}
        {{- if not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}/(2[4-9]|3[0-2])$|^[0-9a-fA-F:]+/(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-8])$" $value) }}
        {{- fail (printf "matrixrtcAuth.livekitNodeCidrs entry %q must be an IPv4 CIDR of /24 or narrower, or an IPv6 CIDR of /64 or narrower, naming LiveKit nodes" $value) }}
        {{- end }}
        - ipBlock:
            cidr: {{ $value | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 6379
    # lk-jwt-service validates the OpenID token itself against the homeserver's
    # federation userinfo endpoint over HTTPS. Without this the validation
    # cannot run, every request ends as 401, and the policy gateway proxies
    # that 401 through without logging a denial of its own — the call dies with
    # "SFU Config fetch failed with status code 401" and nothing says why.
    # The gateway policy already carries the same rule.
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
