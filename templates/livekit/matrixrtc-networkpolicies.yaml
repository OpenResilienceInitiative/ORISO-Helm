apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrixrtc-auth-policy-gateway
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: matrixrtc-auth-policy-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
        - podSelector:
            matchLabels:
              app: element-call
      ports:
        - protocol: TCP
          port: 3010
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: matrixrtc-authorization-service
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrixrtc-authorization-service
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: matrixrtc-authorization-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: matrixrtc-auth-policy-gateway
        - podSelector:
            matchLabels:
              app: livekit
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
