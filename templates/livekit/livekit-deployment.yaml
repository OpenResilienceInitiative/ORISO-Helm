{{- $strategy := required "livekit.deploymentStrategy is required" .Values.livekit.deploymentStrategy -}}
{{- $replicasRaw := toString .Values.livekit.replicas -}}
{{- $terminationGraceRaw := toString .Values.livekit.terminationGracePeriodSeconds -}}
{{- if not (regexMatch "^[0-9]+$" $replicasRaw) -}}
{{- fail "livekit.replicas must be an integer" -}}
{{- end -}}
{{- if or (eq $terminationGraceRaw "") (eq $terminationGraceRaw "<nil>") -}}
{{- fail "livekit.terminationGracePeriodSeconds is required" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9]+$" $terminationGraceRaw) -}}
{{- fail "livekit.terminationGracePeriodSeconds must be an integer" -}}
{{- end -}}
{{- $replicas := int $replicasRaw -}}
{{- $terminationGrace := int $terminationGraceRaw -}}
{{- if not (has $strategy (list "Recreate" "RollingUpdate")) -}}
{{- fail "livekit.deploymentStrategy must be Recreate or RollingUpdate" -}}
{{- end -}}
{{- if and (eq $strategy "RollingUpdate") (lt $replicas 2) -}}
{{- fail "livekit.deploymentStrategy=RollingUpdate requires livekit.replicas >= 2 because hostNetwork ports cannot overlap on a single node" -}}
{{- end -}}
{{- if or (lt $terminationGrace 1) (gt $terminationGrace 300) -}}
{{- fail "livekit.terminationGracePeriodSeconds must be between 1 and 300 seconds" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: {{ .Release.Namespace }}
  labels:
    app: livekit
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: livekit
  strategy:
    type: {{ $strategy }}
    {{- if eq $strategy "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
    {{- end }}
  template:
    metadata:
      labels:
        app: livekit
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: livekit
              topologyKey: kubernetes.io/hostname
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ $terminationGrace }}
      containers:
        - name: livekit
          image: {{ include "oriso.immutableImage" (list "livekit.image" .Values.livekit.image) | quote }}
          imagePullPolicy: Always
          args:
            - --config
            - /etc/livekit/config.yaml
          ports:
            - containerPort: 7880
              name: http
              protocol: TCP
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
      volumes:
        - name: livekit-config
          secret:
            secretName: {{ .Values.livekit.existingConfigSecret.name | quote }}
            items:
              - key: {{ .Values.livekit.existingConfigSecret.key | quote }}
                path: config.yaml
