{{- include "oriso.matrixrtcLifecycle.validate" . -}}
{{- $lifecycle := .Values.matrixrtcLifecycle -}}
{{- $strategy := required "livekit.deploymentStrategy is required" .Values.livekit.deploymentStrategy -}}
{{- $replicasRaw := toString .Values.livekit.replicas -}}
{{- $terminationGraceRaw := toString .Values.livekit.terminationGracePeriodSeconds -}}
{{- if not (regexMatch "^[0-9]+$" $replicasRaw) -}}
{{- fail "livekit.replicas must be an integer" -}}
{{- end -}}
{{- if or (eq $terminationGraceRaw "") (eq $terminationGraceRaw "<nil>") -}}
{{- fail "livekit.terminationGracePeriodSeconds is required" -}}
{{- end -}}
{{- if not (regexMatch "^[0-9]+$" $terminationGraceRaw) -}}
{{- fail "livekit.terminationGracePeriodSeconds must be an integer" -}}
{{- end -}}
{{- $replicas := int $replicasRaw -}}
{{- $terminationGrace := int $terminationGraceRaw -}}
{{- if not (has $strategy (list "Recreate" "RollingUpdate")) -}}
{{- fail "livekit.deploymentStrategy must be Recreate or RollingUpdate" -}}
{{- end -}}
{{- if and (eq $strategy "RollingUpdate") (lt $replicas 2) -}}
{{- fail "livekit.deploymentStrategy=RollingUpdate requires livekit.replicas >= 2 because hostNetwork ports cannot overlap on a single node" -}}
{{- end -}}
{{- if or (lt $terminationGrace 1) (gt $terminationGrace 300) -}}
{{- fail "livekit.terminationGracePeriodSeconds must be between 1 and 300 seconds" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: {{ .Release.Namespace }}
  labels:
    app: livekit
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app: livekit
  strategy:
    type: {{ $strategy }}
    {{- if eq $strategy "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
    {{- end }}
  template:
    metadata:
      labels:
        app: livekit
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: livekit
              topologyKey: kubernetes.io/hostname
      hostNetwork: {{ not $lifecycle.enabled }}
      dnsPolicy: {{ ternary "ClusterFirst" "ClusterFirstWithHostNet" $lifecycle.enabled }}
      enableServiceLinks: false
      restartPolicy: Always
      terminationGracePeriodSeconds: {{ $terminationGrace }}
      containers:
        - name: livekit
          image: {{ include "oriso.immutableImage" (list "livekit.image" .Values.livekit.image) | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          args:
            - --config
            - /etc/livekit/config.yaml
            {{- if $lifecycle.enabled }}
            - --node-ip
            - {{ $lifecycle.livekit.nodeIp | quote }}
            - --bind
            - "0.0.0.0"
            - --port=7880
            - --rtc.use_external_ip=false
            - --rtc.tcp_port=7881
            - --udp-port=7882
            - --rtc.port_range_start=0
            - --rtc.port_range_end=0
            # Debug signaling responses can contain refreshed participant tokens.
            - --logging.level=info
            {{- end }}
          ports:
            - containerPort: 7880
              name: http
              protocol: TCP
            {{- if $lifecycle.enabled }}
            - containerPort: 7881
              hostPort: 7881
              name: rtc-tcp
              protocol: TCP
            - containerPort: 7882
              hostPort: 7882
              name: rtc-udp
              protocol: UDP
            {{- end }}
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
      volumes:
        - name: livekit-config
          secret:
            secretName: {{ (ternary $lifecycle.livekit.existingConfigSecret.name .Values.livekit.existingConfigSecret.name $lifecycle.enabled) | quote }}
            items:
              - key: {{ (ternary $lifecycle.livekit.existingConfigSecret.key .Values.livekit.existingConfigSecret.key $lifecycle.enabled) | quote }}
                path: config.yaml
