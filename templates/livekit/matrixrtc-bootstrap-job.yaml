{{- $bootstrap := default (dict) .Values.matrixrtcAuth.bootstrap -}}
{{- $bootstrapEnabled := true -}}
{{- if hasKey $bootstrap "enabled" -}}
{{- $bootstrapEnabled = $bootstrap.enabled -}}
{{- end -}}
{{- if $bootstrapEnabled }}
{{- $manualMembershipToken := default "" .Values.matrixrtcAuth.membershipToken -}}
{{- $usesManualToken := and $manualMembershipToken (ne $manualMembershipToken "changeme") (ne $manualMembershipToken "pending-bootstrap") -}}
{{- $readerPassword := default "" .Values.matrixrtcAuth.membershipReaderPassword -}}
{{- $registrationSecret := default "" .Values.global.secrets.matrixRegistrationSharedSecret -}}
{{- if not $usesManualToken -}}
{{- $readerPassword = required "matrixrtcAuth.membershipReaderPassword is required when matrixrtcAuth.bootstrap.enabled=true and matrixrtcAuth.membershipToken is blank/changeme; set it in secrets.yaml" .Values.matrixrtcAuth.membershipReaderPassword -}}
{{- $registrationSecret = required "global.secrets.matrixRegistrationSharedSecret is required for MatrixRTC Matrix user bootstrap" .Values.global.secrets.matrixRegistrationSharedSecret -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrixrtc-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrixrtc-bootstrap
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrixrtc-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrixrtc-bootstrap
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.matrixrtcAuth.existingSecret.name | quote }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrixrtc-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrixrtc-bootstrap
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
subjects:
  - kind: ServiceAccount
    name: matrixrtc-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: matrixrtc-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: matrixrtc-bootstrap-token
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: matrixrtc-bootstrap
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  backoffLimit: {{ default 6 $bootstrap.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrixrtc-bootstrap
    spec:
      serviceAccountName: matrixrtc-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ include "oriso.immutableImage" (list "matrix.image" .Values.matrix.image .Values.global.requireImmutableImages) | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          env:
            - name: MATRIX_BASE_URL
              value: {{ .Values.matrix.matrixApiUrl | quote }}
            - name: MATRIXRTC_USER_ID
              value: {{ .Values.matrixrtcAuth.membershipReaderUserId | quote }}
            - name: MATRIXRTC_PASSWORD
              value: {{ $readerPassword | quote }}
            - name: MATRIX_REGISTRATION_SHARED_SECRET
              value: {{ $registrationSecret | quote }}
            - name: TARGET_SECRET_NAME
              value: {{ .Values.matrixrtcAuth.existingSecret.name | quote }}
            - name: MEMBERSHIP_TOKEN_KEY
              value: {{ .Values.matrixrtcAuth.existingSecret.membershipTokenKey | quote }}
            - name: MANUAL_MEMBERSHIP_TOKEN
              value: {{ default "" .Values.matrixrtcAuth.membershipToken | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              python - <<'PY'
              import base64
              import json
              import os
              import ssl
              import subprocess
              import sys
              import time
              import urllib.error
              import urllib.request

              base_url = os.environ["MATRIX_BASE_URL"].rstrip("/")
              user_id = os.environ["MATRIXRTC_USER_ID"]
              password = os.environ["MATRIXRTC_PASSWORD"]
              shared_secret = os.environ["MATRIX_REGISTRATION_SHARED_SECRET"]
              target_secret = os.environ["TARGET_SECRET_NAME"]
              token_key = os.environ["MEMBERSHIP_TOKEN_KEY"]
              manual_token = os.environ.get("MANUAL_MEMBERSHIP_TOKEN", "")

              if manual_token and manual_token not in ("changeme", "pending-bootstrap"):
                  token = manual_token
              else:
                  if not user_id.startswith("@") or ":" not in user_id:
                      raise SystemExit(f"Invalid MATRIXRTC_USER_ID: {user_id}")
                  localpart = user_id[1:].split(":", 1)[0]

                  for attempt in range(180):
                      try:
                          urllib.request.urlopen(base_url + "/_matrix/client/versions", timeout=5).read()
                          break
                      except Exception:
                          time.sleep(2)
                  else:
                      raise SystemExit("Timed out waiting for Synapse readiness")

                  register_cmd = [
                      "register_new_matrix_user",
                      "-u", localpart,
                      "-p", password,
                      "-k", shared_secret,
                      "--no-admin",
                      base_url,
                  ]
                  result = subprocess.run(register_cmd, text=True, capture_output=True)
                  combined = (result.stdout or "") + (result.stderr or "")
                  duplicate_user = (
                      "User ID already taken" in combined
                      or "already exists" in combined
                      or "already taken" in combined
                  )
                  if result.returncode != 0 and not duplicate_user:
                      sys.stderr.write(combined)
                      raise SystemExit(result.returncode)

                  login_body = {
                      "type": "m.login.password",
                      "identifier": {"type": "m.id.user", "user": localpart},
                      "password": password,
                  }
                  request = urllib.request.Request(
                      base_url + "/_matrix/client/v3/login",
                      data=json.dumps(login_body).encode("utf-8"),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      token = json.load(response)["access_token"]

              namespace = open("/var/run/secrets/kubernetes.io/serviceaccount/namespace", encoding="utf-8").read().strip()
              api_token = open("/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8").read().strip()
              ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              patch_body = {
                  "data": {
                      token_key: base64.b64encode(token.encode("utf-8")).decode("ascii")
                  }
              }
              request = urllib.request.Request(
                  f"https://kubernetes.default.svc/api/v1/namespaces/{namespace}/secrets/{target_secret}",
                  data=json.dumps(patch_body).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_token}",
                      "Content-Type": "application/merge-patch+json",
                  },
                  method="PATCH",
              )
              context = ssl.create_default_context(cafile=ca_file)
              try:
                  urllib.request.urlopen(request, context=context, timeout=15).read()
              except urllib.error.HTTPError as exc:
                  sys.stderr.write(exc.read().decode("utf-8", errors="replace"))
                  raise
              print(f"Patched {target_secret}/{token_key} for {user_id}")
              PY
{{- end }}
