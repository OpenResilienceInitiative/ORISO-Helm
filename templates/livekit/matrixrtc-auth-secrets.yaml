apiVersion: v1
kind: Secret
metadata:
  name: matrixrtc-auth-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  livekit-api-key: {{ required "livekit.api.key must be supplied from the environment secrets overlay" .Values.livekit.api.key | quote }}
  livekit-api-secret: {{ required "livekit.api.secret must be supplied from the environment secrets overlay" .Values.livekit.api.secret | quote }}
  matrix-admin-token: {{ required "livekit.matrixAdminToken must be supplied from the environment secrets overlay" .Values.livekit.matrixAdminToken | quote }}
  redis-url: {{ printf "redis://:%s@redis:6379" (required "global.secrets.redisdefaultPass is required" .Values.global.secrets.redisdefaultPass) | quote }}
