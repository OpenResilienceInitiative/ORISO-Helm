apiVersion: v1
kind: Service
metadata:
  name: matrixrtc-auth-policy-gateway
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: matrixrtc-auth-policy-gateway
  ports:
    - name: http
      port: 3010
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: matrixrtc-authorization-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: matrixrtc-authorization-service
  ports:
    - name: http
      port: 8080
      targetPort: http
