{{- $livekitKey := required "livekit.api.key is required for LiveKit and MatrixRTC auth; set it in secrets.yaml" .Values.livekit.api.key -}}
{{- $livekitSecret := required "livekit.api.secret is required for LiveKit and MatrixRTC auth; set it in secrets.yaml" .Values.livekit.api.secret -}}
{{- $membershipTokenKey := .Values.matrixrtcAuth.existingSecret.membershipTokenKey -}}
{{- $callPolicyTokenKey := .Values.matrixrtcAuth.existingSecret.callPolicyTokenKey -}}
{{- $callPolicyToken := required "matrixrtcAuth.callPolicyToken is required for the MatrixRTC policy gateway; set a dedicated high-entropy value in secrets.yaml" .Values.matrixrtcAuth.callPolicyToken -}}
{{- $configuredMembershipToken := default "" .Values.matrixrtcAuth.membershipToken -}}
{{- $existingAuthSecret := lookup "v1" "Secret" .Release.Namespace .Values.matrixrtcAuth.existingSecret.name -}}
{{- $existingMembershipToken := "" -}}
{{- if and $existingAuthSecret (hasKey $existingAuthSecret "data") (hasKey $existingAuthSecret.data $membershipTokenKey) -}}
{{- $existingMembershipToken = (index $existingAuthSecret.data $membershipTokenKey) | b64dec -}}
{{- end -}}
{{- $membershipToken := "pending-bootstrap" -}}
{{- if and $configuredMembershipToken (ne $configuredMembershipToken "changeme") (ne $configuredMembershipToken "pending-bootstrap") -}}
{{- $membershipToken = $configuredMembershipToken -}}
{{- else if $existingMembershipToken -}}
{{- $membershipToken = $existingMembershipToken -}}
{{- end -}}
{{- $redisPassword := required "global.secrets.redisdefaultPass is required for MatrixRTC Redis URL and LiveKit Redis config" .Values.global.secrets.redisdefaultPass -}}
{{- $redisUrl := default (printf "redis://:%s@redis:6379" ($redisPassword | urlquery)) .Values.matrixrtcAuth.redisUrl -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.matrixrtcAuth.existingSecret.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: matrixrtc-auth
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
type: Opaque
stringData:
  {{ $membershipTokenKey }}: {{ $membershipToken | quote }}
  {{ $callPolicyTokenKey }}: {{ $callPolicyToken | quote }}
  {{ .Values.matrixrtcAuth.existingSecret.livekitApiKeyKey }}: {{ $livekitKey | quote }}
  {{ .Values.matrixrtcAuth.existingSecret.livekitApiSecretKey }}: {{ $livekitSecret | quote }}
  {{ .Values.matrixrtcAuth.existingSecret.redisUrlKey }}: {{ $redisUrl | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.livekit.existingConfigSecret.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
type: Opaque
stringData:
  {{ .Values.livekit.existingConfigSecret.key }}: |
    port: 7880
    bind_addresses:
      - "0.0.0.0"
    rtc:
      use_external_ip: true
    redis:
      address: "redis:6379"
      password: {{ $redisPassword | quote }}
    room:
      auto_create: false
    keys:
      {{ $livekitKey | quote }}: {{ $livekitSecret | quote }}
    webhook:
      api_key: {{ $livekitKey | quote }}
      urls:
        - {{ printf "https://%s/livekit/jwt/sfu_webhook" .Values.global.domainName | quote }}
