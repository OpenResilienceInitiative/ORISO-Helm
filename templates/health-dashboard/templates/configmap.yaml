apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "health-dashboard.fullname" . }}-config
  namespace: {{ default .Release.Namespace .Values.healthDashboard.namespace }}
  labels:
    {{- include "health-dashboard.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "TenantService": {
        "name": "TenantService",
        "url": "http://tenantservice.{{ .Release.Namespace }}.svc.cluster.local:8081/actuator/health"
      },
      "UserService": {
        "name": "UserService",
        "url": "http://userservice.{{ .Release.Namespace }}.svc.cluster.local:8080/actuator/health"
      },
      "ConsultingTypeService": {
        "name": "ConsultingTypeService",
        "url": "http://consultingtypeservice.{{ .Release.Namespace }}.svc.cluster.local:8080/actuator/health"
      },
      "AgencyService": {
        "name": "AgencyService",
        "url": "http://agencyservice.{{ .Release.Namespace }}.svc.cluster.local:8080/actuator/health"
      }
    }
