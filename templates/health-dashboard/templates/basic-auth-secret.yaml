{{- $ingress := .Values.healthDashboard.ingress | default dict }}
{{- if and $ingress.enabled $ingress.htpasswd }}
{{- /* Renders the Basic Auth Secret from secrets.yaml; without htpasswd the ingress expects a pre-provisioned Secret. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "healthDashboard.ingress.authSecret must name the Basic Auth Secret when healthDashboard.ingress.htpasswd is set" ($ingress.authSecret | default "" | trim) | quote }}
  namespace: {{ default .Release.Namespace .Values.healthDashboard.namespace }}
  labels:
    {{- include "health-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth: {{ $ingress.htpasswd | quote }}
{{- end }}
