{{- $ingress := .Values.healthDashboard.ingress | default dict }}
{{- if $ingress.enabled }}
{{- /* basicAuth defaults to true. hasKey, not `default`: `default true false` would turn an explicit false back into true. */}}
{{- $basicAuth := true }}
{{- if hasKey $ingress "basicAuth" }}
{{- $basicAuth = $ingress.basicAuth }}
{{- end }}
{{- if not (kindIs "bool" $basicAuth) }}
{{- fail "healthDashboard.ingress.basicAuth must be a boolean (true or false)" }}
{{- end }}
{{- if not $basicAuth }}
{{- /* Without Basic Auth the dashboard is public, so the app must withhold internal details (#57). */}}
{{- $publicMode := (index (.Values.healthDashboard.env | default dict) "ORISO_PUBLIC_MODE") | default "true" | toString | lower | trim }}
{{- if eq $publicMode "false" }}
{{- fail "healthDashboard.ingress.basicAuth=false makes /health public and requires public mode: remove healthDashboard.env.ORISO_PUBLIC_MODE=false" }}
{{- end }}
{{- end }}
{{- $authSecret := "" }}
{{- if $basicAuth }}
{{- $authSecret = required "healthDashboard.ingress.authSecret must name an existing basic-auth Secret when HealthDashboard ingress is enabled with basicAuth" ($ingress.authSecret | default "" | trim) }}
{{- if contains "/" $authSecret }}
{{- fail "healthDashboard.ingress.authSecret must be a local Secret name without '/' in the effective HealthDashboard namespace" }}
{{- end }}
{{- if or (gt (len $authSecret) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $authSecret)) }}
{{- fail "healthDashboard.ingress.authSecret must be a valid Kubernetes Secret name (DNS subdomain, at most 253 characters)" }}
{{- end }}
{{- $authNamespace := default .Release.Namespace .Values.healthDashboard.namespace }}
{{- /* Without htpasswd the Secret must be pre-provisioned. Only checked against a live
       cluster: lookup returns nothing under `helm template`, so CI renders stay unaffected. */}}
{{- if and (not ($ingress.htpasswd | default "" | trim)) (lookup "v1" "Namespace" "" $authNamespace) }}
{{- if not (lookup "v1" "Secret" $authNamespace $authSecret) }}
{{- fail (printf "healthDashboard.ingress is enabled but Secret %s/%s does not exist: set healthDashboard.ingress.htpasswd in secrets.yaml, or create the Secret with an htpasswd entry under the key `auth`" $authNamespace $authSecret) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "health-dashboard.fullname" . }}-ingress
  namespace: {{ default .Release.Namespace .Values.healthDashboard.namespace }}
  labels:
    {{- include "health-dashboard.labels" . | nindent 4 }}
  annotations:
    {{- if $basicAuth }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ $authSecret | quote }}
    nginx.ingress.kubernetes.io/auth-realm: "HealthDashboard Authentication"
    {{- end }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - '{{ .Values.global.domainName }}'
    secretName: {{ .Values.global.domainName | replace "." "-" }}-tls
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - path: /health(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "health-dashboard.fullname" . }}
            port:
              number: {{ .Values.healthDashboard.service.port }}
{{- end }}
