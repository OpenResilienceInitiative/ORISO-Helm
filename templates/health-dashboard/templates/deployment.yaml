{{- $environment := deepCopy (.Values.healthDashboard.env | default dict) -}}
{{- $operatorAccess := .Values.global.healthDashboardOperatorAccess -}}
{{- if and (hasKey .Values.global "healthDashboardOperatorAccess") (not (kindIs "bool" $operatorAccess)) -}}
{{- fail "global.healthDashboardOperatorAccess must be a boolean" -}}
{{- end -}}
{{- if $operatorAccess -}}
{{- $ingress := .Values.healthDashboard.ingress -}}
{{- if or (not $ingress.enabled) (not (kindIs "bool" $ingress.basicAuth)) $ingress.basicAuth -}}
{{- fail "HealthDashboard operator access requires a public ingress with basicAuth: false" -}}
{{- end -}}
{{- if not .Values.global.enableTls -}}
{{- fail "HealthDashboard operator access requires global.enableTls" -}}
{{- end -}}
{{- $realm := required "global.keycloak.realm is required for HealthDashboard operator access" .Values.global.keycloak.realm -}}
{{- $_ := set $environment "ORISO_DASHBOARD_OIDC_ISSUER" (printf "%s/auth/realms/%s" (include "oriso.publicOrigin" .) $realm) -}}
{{- $_ := set $environment "ORISO_DASHBOARD_OIDC_CLIENT_ID" "health-dashboard" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "health-dashboard.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.healthDashboard.namespace }}
  labels:
    {{- include "health-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.healthDashboard.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: health-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: health-dashboard
    spec:
      serviceAccountName: health-dashboard
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 1000) | nindent 8 }}
      containers:
      - name: health-dashboard
        image: "{{ .Values.healthDashboard.image.repository }}:{{ .Values.healthDashboard.image.tag }}"
        imagePullPolicy: {{ default (include "oriso.imagePullPolicy" .) .Values.healthDashboard.image.pullPolicy | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.healthDashboard.service.targetPort }}
          protocol: TCP
        env:
        {{- range $key, $value := $environment }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        - name: ORISO_HELM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.healthDashboard.resources }}
        resources:
          {{- toYaml .Values.healthDashboard.resources | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: health-dashboard-config
          mountPath: /app/config.json
          subPath: config.json
          readOnly: true
        securityContext:
          {{- include "oriso.containerSecurityContext" (dict) | nindent 10 }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      volumes:
      - name: health-dashboard-config
        configMap:
          name: {{ include "health-dashboard.fullname" . }}-config
      terminationGracePeriodSeconds: 30
