apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-configmap
data:
  REACT_APP_MATRIX_URL: "https://{{ .Values.global.domains.matrix }}"
  REACT_APP_KEYCLOAK_URL: "{{ .Values.global.external.keycloakURL }}"
  VITE_API_URL: "https://{{ .Values.global.domainName }}"
  REACT_APP_PLATFORM_VERSION: {{ printf "v%s" (trimPrefix "v" .Chart.AppVersion) | quote }}
  VITE_PLATFORM_VERSION: {{ printf "v%s" (trimPrefix "v" .Chart.AppVersion) | quote }}
  # Web Vitals to SigNoz (global.observability.webVitals); empty URL = off.
  VITE_OBSERVABILITY_ENABLED: {{ ne (include "oriso.webVitalsUrl" .) "" | toString | quote }}
  VITE_OTEL_METRICS_URL: {{ include "oriso.webVitalsUrl" . | quote }}
  VITE_OTEL_EXPORT_INTERVAL_MS: {{ include "oriso.webVitalsIntervalMillis" . | quote }}
