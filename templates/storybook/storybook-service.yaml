{{- if .Values.storybook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: storybook-frontend
spec:
  selector:
    app: storybook-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: storybook-admin
spec:
  selector:
    app: storybook-admin
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
