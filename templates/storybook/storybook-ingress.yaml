{{- if .Values.storybook.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storybook-dev-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-realm: {{ .Values.storybook.ingress.authRealm | quote }}
    nginx.ingress.kubernetes.io/auth-secret: {{ required "storybook.ingress.authSecret must name an existing basic-auth Secret when Storybook is enabled" .Values.storybook.ingress.authSecret | quote }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($uri = "/storybook-admin") {
        return 308 /storybook-admin/;
      }
      if ($uri = "/storybook-frontend") {
        return 308 /storybook-frontend/;
      }
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.global.domainName | quote }}
      http:
        paths:
          - path: /storybook-admin(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: storybook-admin
                port:
                  number: 80
          - path: /storybook-frontend(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: storybook-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - {{ .Values.global.domainName | quote }}
      secretName: {{ .Values.global.domainName | replace "." "-" }}-tls
{{- end }}
