{{- if .Values.storybook.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storybook-frontend
  labels:
    app: storybook-frontend
spec:
  replicas: {{ .Values.storybook.replicas }}
  selector:
    matchLabels:
      app: storybook-frontend
  template:
    metadata:
      labels:
        app: storybook-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 101 "lowPorts" true) | nindent 8 }}
      containers:
        - name: storybook-frontend
          image: {{ include "oriso.immutableImage" (list "storybook.image" .Values.storybook.image) | quote }}
          imagePullPolicy: {{ .Values.storybook.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources: {{- toYaml .Values.storybook.resources | nindent 12 }}
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict) | nindent 12 }}
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.storybook.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
