apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-reconcile-smtp
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "16"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: keycloak-reconcile-smtp
    spec:
      {{- include "oriso.keycloakSmtpReconcilePod" . | nindent 6 }}
