apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-reconcile-smtp
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # After keycloak-reconcile-service-identities (15) has ensured the smtp-sync client.
    "helm.sh/hook-weight": "16"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # Pod retries cover Admin Settings or Keycloak still starting after install.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: keycloak-reconcile-smtp-hook
    spec:
      {{- include "oriso.keycloakSmtpReconcilePod" . | nindent 6 }}
