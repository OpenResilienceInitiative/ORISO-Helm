apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-call
  namespace: {{ .Release.Namespace }}
  labels:
    app: element-call
spec:
  replicas: {{ .Values.elementCall.replicas }}
  selector:
    matchLabels:
      app: element-call
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: element-call
    spec:
      initContainers:
        - name: wait-for-matrixrtc-auth
          image: {{ include "oriso.immutableImage" (list "elementCall.healthcheckImage" .Values.elementCall.healthcheckImage .Values.global.requireImmutableImages) | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command:
            - sh
            - -ec
            - |
              until curl --fail --silent --show-error \
                http://matrixrtc-auth-policy-gateway:3010/health >/dev/null; do
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
      containers:
      - name: element-call
        image: {{ include "oriso.immutableImage" (list "elementCall.image" .Values.elementCall.image .Values.global.requireImmutableImages) | quote }}
        imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
        ports:
          - containerPort: 80
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          runAsNonRoot: true
          runAsUser: 101
        volumeMounts:
          - mountPath: /app/config.json
            name: element-call-config
            readOnly: true
            subPath: config.json
      volumes:
        - name: element-call-config
          configMap:
            name: element-call-config
