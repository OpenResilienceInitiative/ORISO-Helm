{{- $image := required "keycloakSmtpReconcile.image must use an immutable digest" .Values.keycloakSmtpReconcile.image -}}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "keycloakSmtpReconcile.image must use an immutable sha256 digest" -}}
{{- end -}}
{{- $migration := .Values.global.keycloak.backendServiceClients -}}
{{- if and $migration.prepareOnly .Release.IsUpgrade -}}
{{- fail "backendServiceClients.prepareOnly is for the isolated render/show-only preparation Job; never use it in a Helm upgrade" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-reconcile-service-clients-script
data:
  keycloak-reconcile-service-clients.py: |
{{ .Files.Get "files/keycloak-reconcile-service-clients.py" | indent 4 }}
  keycloak-reconcile-smtp.py: |
{{ .Files.Get "files/keycloak-reconcile-smtp.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ if $migration.prepareOnly }}keycloak-prepare-backend-clients{{ else }}keycloak-reconcile-service-identities{{ end }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: keycloak-reconcile-service-identities
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-service-identities
          image: {{ $image | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command: ["python3", "/scripts/keycloak-reconcile-service-clients.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          env:
            - name: KEYCLOAK_URL
              value: {{ include "oriso.keycloakAdminUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.global.keycloak.realm | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $pair := list (list "KEYCLOAK_ADMIN_USERNAME" "KEYCLOAK_ADMIN") (list "BOOTSTRAP_ADMIN_USERNAME" "KEYCLOAK_ADMIN") (list "KEYCLOAK_ADMIN_PASSWORD" "KEYCLOAK_ADMIN_PASSWORD") }}
            - name: {{ index $pair 0 }}
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: {{ index $pair 1 }}
            {{- end }}
            {{- range $pair := list (list "TECHNICAL_CLIENT_SECRET" "KEYCLOAK_BACKEND_TECHNICAL_CLIENT_SECRET") (list "ADMIN_CLIENT_SECRET" "KEYCLOAK_BACKEND_ADMIN_CLIENT_SECRET") }}
            - name: {{ index $pair 0 }}
              valueFrom:
                secretKeyRef:
                  name: keycloak-backend-client-secrets
                  key: {{ index $pair 1 }}
            {{- end }}
            - name: TECHNICAL_CLIENT_ID
              value: {{ .Values.global.keycloak.backendTechnicalClientId | quote }}
            - name: ADMIN_CLIENT_ID
              value: {{ .Values.global.keycloak.serviceAdminClientId | quote }}
            - name: HUMAN_CLIENT_ID
              value: {{ .Values.global.keycloak.serviceAppClientId | quote }}
            - name: TECHNICAL_SERVICE_SUBJECT
              value: {{ .Values.global.keycloak.serviceTechUserId | quote }}
            - name: ADMIN_SERVICE_SUBJECT
              value: {{ .Values.global.keycloak.serviceAdminSubject | quote }}
            - name: PREPARE_ONLY
              value: {{ $migration.prepareOnly | toString | quote }}
            - name: RETIRE_LEGACY_USERS
              value: {{ $migration.retireLegacyUsers | toString | quote }}
            - name: LEGACY_TECHNICAL_USERNAME
              value: {{ $migration.legacyTechnicalUsername | quote }}
            - name: LEGACY_ADMIN_USERNAME
              value: {{ $migration.legacyAdminUsername | quote }}
            {{- if not $migration.prepareOnly }}
            # Ensures the SMTP sync realm client on existing realms (Helm#420).
            - name: SMTP_SYNC_CLIENT_ID
              value: {{ include "oriso.smtpSyncClientId" . | quote }}
            - name: SMTP_SYNC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-smtp-sync-client
                  key: KEYCLOAK_SMTP_SYNC_CLIENT_SECRET
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: keycloak-reconcile-service-clients-script
