{{- $image := .Values.global.taskIdentities.image | default .Values.keycloakSmtpReconcile.image -}}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "task identity reconciliation requires an immutable Python image digest" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-reconcile-service-identities
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: keycloak-reconcile-service-identities
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-service-identities
          image: {{ $image | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KEYCLOAK_URL
              value: {{ include "oriso.keycloakAdminUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.global.keycloak.realm | quote }}
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: ORISO_TASK_IDENTITIES_JSON
              valueFrom:
                secretKeyRef:
                  name: oriso-task-identity-credentials
                  key: ORISO_TASK_IDENTITIES_JSON
            - name: ORISO_LEGACY_RETIREMENT_JSON
              value: {{ include "oriso.legacyRetirement" . | quote }}
          command: ["python3", "-B", "/scripts/keycloak-reconcile-task-identities.py"]
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: keycloak-reconcile-task-identities-script
            defaultMode: 0444
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-reconcile-task-identities-script
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  keycloak-reconcile-task-identities.py: |-
{{ .Files.Get "files/keycloak-reconcile-task-identities.py" | indent 4 }}
