{{- if and (.Values.ipAnonymizer).enabled (.Values.ipAnonymizer).sessionKey }}
{{- $key := toString .Values.ipAnonymizer.sessionKey }}
{{- /* Same rule as the binary's startup check: standard base64 of exactly 32 bytes. */}}
{{- if or (ne (b64enc (b64dec $key)) $key) (ne (len (b64dec $key)) 32) }}
{{- fail "ipAnonymizer.sessionKey must be a standard-base64 32-byte key. Generate one with: openssl rand -base64 32" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ip-anonymizer-session-key
  namespace: {{ .Release.Namespace }}
  labels:
    app: ip-anonymizer
type: Opaque
data:
  ANON_SESSION_KEY: {{ $key | b64enc | quote }}
{{- end }}
