{{- if (.Values.ipAnonymizer).enabled }}
{{- $sessionKey := .Values.ipAnonymizer.sessionKey | default "" }}
{{- if and $sessionKey .Values.ipAnonymizer.sessionKeySecretName }}
{{- fail "Set either ipAnonymizer.sessionKey (secrets.yaml) or ipAnonymizer.sessionKeySecretName, not both." }}
{{- end }}
{{- $sessionKeySecret := ternary "ip-anonymizer-session-key" (.Values.ipAnonymizer.sessionKeySecretName | default "") (ne $sessionKey "") }}
{{- if and (gt (int .Values.ipAnonymizer.replicas) 1) (not $sessionKeySecret) }}
{{- fail "ipAnonymizer.replicas above 1 needs ipAnonymizer.sessionKey or ipAnonymizer.sessionKeySecretName: replicas only agree on X-Anon-Id when they share ANON_SESSION_KEY (ORISO-IpAnonymizer#8, ORISO-Helm#544)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-anonymizer
  namespace: {{ .Release.Namespace }}
  labels:
    app: ip-anonymizer
spec:
  replicas: {{ .Values.ipAnonymizer.replicas }}
  selector:
    matchLabels:
      app: ip-anonymizer
  template:
    metadata:
      labels:
        app: ip-anonymizer
      {{- with $sessionKey }}
      annotations:
        # Env vars are read at start; restart the pods when the key changes.
        checksum/session-key: {{ sha256sum . | quote }}
      {{- end }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: ip-anonymizer
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict) | nindent 8 }}
      containers:
        - name: ip-anonymizer
          image: {{ .Values.ipAnonymizer.image | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          {{- with $sessionKeySecret }}
          env:
            - name: ANON_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: ANON_SESSION_KEY
          {{- end }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
{{- end }}
