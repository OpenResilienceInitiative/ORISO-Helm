{{- if (.Values.ipAnonymizer).enabled }}
{{- if gt (int .Values.ipAnonymizer.replicas) 1 }}
{{- fail "ipAnonymizer.replicas must be 1: each pod keeps its sessions in memory, so a second replica hands the same browser a different X-Anon-Id on many requests (ORISO-Helm#544)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ip-anonymizer
  namespace: {{ .Release.Namespace }}
  labels:
    app: ip-anonymizer
spec:
  replicas: {{ .Values.ipAnonymizer.replicas }}
  selector:
    matchLabels:
      app: ip-anonymizer
  template:
    metadata:
      labels:
        app: ip-anonymizer
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict) | nindent 8 }}
      containers:
        - name: ip-anonymizer
          image: {{ .Values.ipAnonymizer.image | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          {{- with .Values.ipAnonymizer.sessionKeySecretName }}
          env:
            - name: ANON_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: ANON_SESSION_KEY
          {{- end }}
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
{{- end }}
