{{- $verify := default (dict) .Values.global.keycloak.verifyTwoFactorContract -}}
{{- $verifyEnabled := true -}}
{{- if hasKey $verify "enabled" -}}
{{- $verifyEnabled = $verify.enabled -}}
{{- end -}}
{{- if $verifyEnabled }}
{{- $kc := index .Values "online-counseling-keycloak" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-verify-2fa-contract
  namespace: {{ .Release.Namespace }}
  annotations:
    # post-upgrade as well as post-install: an existing realm is exactly the case
    # `--import-realm` skips, so an upgrade is when drift goes unnoticed.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: keycloak-verify-2fa-contract
    spec:
      restartPolicy: Never
      containers:
        - name: verify-2fa-contract
          image: "{{ $kc.imageName }}:{{ $kc.imageVersion }}"
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          env:
            - name: KEYCLOAK_URL
              value: "http://keycloak.{{ .Release.Namespace }}:8080/auth"
            - name: REALM
              value: {{ .Values.global.keycloak.realm | quote }}
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: KEYCLOAK_ADMIN
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: KEYCLOAK_ADMIN_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              CHECK=/opt/keycloak/bin/oriso-verify-2fa-flow.sh

              # Older images predate the check. Skipping is the honest outcome:
              # failing the release over a missing file would say "your realm
              # drifted" when what is actually stale is the image.
              if [ ! -x "$CHECK" ]; then
                echo "SKIPPED: $CHECK is not in this image."
                echo "Upgrade the oriso-keycloak image to one built from"
                echo "ORISO-Keycloak keycloak-image/ including scripts/."
                exit 0
              fi

              KCADM=/opt/keycloak/bin/kcadm.sh
              until "$KCADM" config credentials \
                  --server "$KEYCLOAK_URL" \
                  --realm master \
                  --user "$KC_ADMIN_USER" \
                  --password "$KC_ADMIN_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for Keycloak admin API"
                sleep 5
              done

              # The check re-authenticates against localhost when KC_ADMIN_USER is
              # set; we already hold a session, so unset it and reuse that.
              unset KC_ADMIN_USER
              unset KC_ADMIN_PASSWORD
              exec "$CHECK"
{{- end }}
