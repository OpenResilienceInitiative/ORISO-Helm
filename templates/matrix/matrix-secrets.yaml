{{- /* An environment values.yaml copied before this key existed ran Synapse on SQLite; keep it there. */ -}}
{{- $engine := (.Values.matrix.database | default dict).engine | default "sqlite3" -}}
{{- if not (has $engine (list "sqlite3" "postgres")) -}}
{{- fail (printf "matrix.database.engine must be \"sqlite3\" or \"postgres\", got %q (see runbooks/matrix-sqlite-to-postgres.md)" $engine) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: matrix-postgres-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:

  POSTGRES_DB: {{ .Values.postgres.postgresDB | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.postgresPassword | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.postgresUser | b64enc | quote }}

# Synapse's database block (for postgres it carries the password), so it lives here and
# not in the matrix-homeserver-oidc ConfigMap. Mounted into the Synapse pod and passed as
# a second --config-path (see matrix-deployment.yaml). matrix.database.engine picks the
# block; changing it on an existing install needs runbooks/matrix-sqlite-to-postgres.md.
stringData:
  homeserver-database.yaml: |
    database:
{{- if eq $engine "postgres" }}
      name: psycopg2
      args:
        user: {{ .Values.postgres.postgresUser | quote }}
        password: {{ .Values.postgres.postgresPassword | quote }}
        database: {{ .Values.postgres.postgresDB | quote }}
        host: {{ .Values.matrix.postgresHost | default .Values.matrix.postgresServiceName | quote }}
        port: 5432
        cp_min: 5
        cp_max: 10
{{- else }}
      name: sqlite3
      args:
        database: /data/homeserver.db
{{- end }}
