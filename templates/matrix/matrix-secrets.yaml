apiVersion: v1
kind: Secret
metadata:
  name: matrix-postgres-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:

  POSTGRES_DB: {{ .Values.postgres.postgresDB | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.postgresPassword | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.postgresUser | b64enc | quote }}

# Synapse's database block carries the password, so it lives here and not in the
# matrix-homeserver-oidc ConfigMap. Mounted into the Synapse pod and passed as a
# second --config-path (see matrix-deployment.yaml).
stringData:
  homeserver-database.yaml: |
    database:
      name: psycopg2
      args:
        user: {{ .Values.postgres.postgresUser | quote }}
        password: {{ .Values.postgres.postgresPassword | quote }}
        database: {{ .Values.postgres.postgresDB | quote }}
        host: {{ .Values.matrix.postgresHost | default .Values.matrix.postgresServiceName | quote }}
        port: 5432
        cp_min: 5
        cp_max: 10
