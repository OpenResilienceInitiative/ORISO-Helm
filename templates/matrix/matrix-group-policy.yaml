{{- include "oriso.matrixGroupPolicy.validate" . -}}
{{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-group-policy-module
  namespace: {{ .Release.Namespace }}
data:
  oriso_group_policy.py: |
{{ .Files.Get "files/matrix/oriso_group_policy.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-group-history
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: matrix-synapse
  ports:
    - name: history
      port: 8801
      targetPort: 8801
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-group-policy-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: matrix-synapse
  policyTypes: [Ingress]
  ingress:
    # Preserve existing Matrix client, media and metrics reachability. This
    # intentionally says nothing about those ports' independent access policy.
    - ports:
        - {protocol: TCP, port: 8008}
        - {protocol: TCP, port: 8009}
        - {protocol: TCP, port: 9000}
    - from:
        - podSelector:
            matchLabels:
              app: userservice
      ports:
        - {protocol: TCP, port: 8801}
{{- end }}
