apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-synapse
  namespace: {{ .Release.Namespace }}
  labels:
    app: matrix-synapse
spec:
  replicas: {{ .Values.matrix.replicas }}
  selector:
    matchLabels:
      app: matrix-synapse
  # matrix-synapse-data is ReadWriteOnce: a rolling update deadlocks with a
  # Multi-Attach error when the new pod lands on another node, because the old
  # pod keeps the volume until the new one is ready. Stop first, then start.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matrix-synapse
      annotations:
        checksum/group-policy: {{ include "oriso.matrixGroupPolicy.synapseChecksum" . | quote }}
        # homeserver.yaml is mounted with subPath, so ConfigMap updates do not
        # reach an existing pod. Roll the Deployment when its source changes.
        checksum/homeserver-config: {{ include "oriso.matrix.homeserverConfigMap" . | sha256sum }}
        # Synapse reads the credentials at startup.
        checksum/synapse-credentials: {{ include (print $.Template.BasePath "/matrix/matrix-synapse-credentials.yaml") . | sha256sum }}
        # Synapse reads the database block only at start, so a switch of the engine
        # must replace the pod, in both directions (runbooks/matrix-sqlite-to-postgres.md).
        checksum/database-engine: {{ (.Values.matrix.database | default dict).engine | default "sqlite3" | sha256sum | quote }}
      {{- if eq (include "oriso.appMetrics.enabled" .) "true" }}
        {{- include "oriso.appMetrics.podAnnotations" (dict "job" "synapse" "port" 9000 "path" "/_synapse/metrics") | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 991) | nindent 8 }}
      initContainers:
        - name: fix-permissions
          image: {{ include "oriso.immutableImage" (list "matrix.initImage" .Values.matrix.initImage) | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command:
          - sh
          - -c
          - |
            chown -R 991:991 /data || true
            chmod -R u+w /data || true
          # Root exception: hands existing data on node-local volumes (no fsGroup support) to Synapse's UID.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            {{- include "oriso.containerSecurityContext" (dict "add" (list "CHOWN" "FOWNER" "DAC_OVERRIDE")) | nindent 12 }}
          volumeMounts:
          - name: synapse-data
            mountPath: /data
      containers:
      - name: synapse
        image: {{ include "oriso.immutableImage" (list "matrix.image" .Values.matrix.image) | quote }}
        imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
        # start.py adds the default /data/homeserver.yaml only when no --config-path is
        # given, so pass the base config and both Secret-backed config fragments explicitly.
        args:
          - run
          - --config-path
          - /data/homeserver.yaml
          - --config-path
          - /secrets/synapse/homeserver-database.yaml
          - --config-path
          - /secrets/synapse-credentials/homeserver-redis.yaml
          # Otherwise Synapse generates keys beside the last config, in the read-only Secret.
          - --keys-directory
          - /data
        env:
          - name: PYTHONPATH
            value: "/opt/oriso-server-discovery{{ if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}:/opt/oriso-modules{{ end }}"
          - name: SYNAPSE_SERVER_NAME
            valueFrom:
              configMapKeyRef:
                key: SYNAPSE_SERVER_NAME
                name: matrix-configmap-env             
          - name: SYNAPSE_REPORT_STATS
            valueFrom:
              configMapKeyRef:
                key: SYNAPSE_REPORT_STATS
                name: matrix-configmap-env             
          - name: SYNAPSE_ENABLE_AUTHENTICATED_MEDIA
            valueFrom:
              configMapKeyRef:
                key: SYNAPSE_ENABLE_AUTHENTICATED_MEDIA
                name: matrix-configmap-env       
        ports:
          {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
          - name: group-history
            containerPort: 8801
            protocol: TCP
          {{- end }}
          - containerPort: 8008
            protocol: TCP
          - name: discovery
            containerPort: 8802
            protocol: TCP
          - containerPort: 8009
            protocol: TCP
          {{- if eq (include "oriso.appMetrics.enabled" .) "true" }}
          - name: metrics
            containerPort: 9000
            protocol: TCP
          {{- end }}
        livenessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
        # Host values.yaml copies written before matrix.resources existed keep
        # the previous fixed values through this fallback.
        {{- $synapseResources := .Values.matrix.resources | default (dict "requests" (dict "cpu" "250m" "memory" "512Mi") "limits" (dict "cpu" "500m" "memory" "1Gi")) }}
        resources:
          {{- toYaml $synapseResources | nindent 10 }}
        securityContext:
          {{- include "oriso.containerSecurityContext" (dict) | nindent 10 }}
        volumeMounts:
          - mountPath: /tmp
            name: tmp
          - mountPath: /opt/oriso-server-discovery
            name: server-discovery-module
            readOnly: true
          {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
          - name: group-policy-module
            mountPath: /opt/oriso-modules
            readOnly: true
          - name: group-policy-token
            mountPath: /run/oriso-group-policy
            readOnly: true
          {{- end }}
          - mountPath: /data
            name: synapse-data
          - mountPath: /data/homeserver.yaml
            name: homeserver-config
            subPath: homeserver.yaml
          - mountPath: /secrets/synapse
            name: homeserver-database-secret
            readOnly: true
          - mountPath: /secrets/synapse-credentials
            name: synapse-credentials
            readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
        - name: group-policy-module
          configMap:
            name: matrix-group-policy-module
        - name: group-policy-token
          secret:
            secretName: {{ .Values.matrix.groupPolicy.existingSecret.name | quote }}
            items:
              - key: {{ .Values.matrix.groupPolicy.existingSecret.tokenKey | quote }}
                path: token
        {{- end }}
        - name: synapse-data
          persistentVolumeClaim:
            claimName: matrix-synapse-data
        - name: homeserver-config
          configMap:
            name: matrix-homeserver-oidc
        - name: server-discovery-module
          configMap:
            name: matrix-homeserver-oidc
            items:
              - key: oriso_server_discovery.py
                path: oriso_server_discovery.py
        - name: homeserver-database-secret
          secret:
            secretName: matrix-postgres-secret
            items:
              - key: homeserver-database.yaml
                path: homeserver-database.yaml
        - name: synapse-credentials
          secret:
            secretName: matrix-synapse-credentials
            defaultMode: 0444
            items:
              - key: registration-shared-secret
                path: registration-shared-secret
              - key: homeserver-redis.yaml
                path: homeserver-redis.yaml
