apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-synapse
  namespace: {{ .Release.Namespace }}
  labels:
    app: matrix-synapse
spec:
  replicas: {{ .Values.matrix.replicas }}
  selector:
    matchLabels:
      app: matrix-synapse
  # matrix-synapse-data is ReadWriteOnce: a rolling update deadlocks with a
  # Multi-Attach error when the new pod lands on another node, because the old
  # pod keeps the volume until the new one is ready. Stop first, then start.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matrix-synapse
      annotations:
        checksum/group-policy: {{ include "oriso.matrixGroupPolicy.synapseChecksum" . | quote }}
      {{- if eq (include "oriso.appMetrics.enabled" .) "true" }}
        {{- include "oriso.appMetrics.podAnnotations" (dict "job" "synapse" "port" 9000 "path" "/_synapse/metrics") | nindent 8 }}
      {{- end }}
    spec:
      initContainers:
        - name: fix-permissions
          image: {{ include "oriso.immutableImage" (list "matrix.initImage" .Values.matrix.initImage) | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command:
          - sh
          - -c
          - |
            chown -R 991:991 /data || true
            chmod -R u+w /data || true
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: synapse-data
            mountPath: /data
      containers:
      - name: synapse
        image: {{ include "oriso.immutableImage" (list "matrix.image" .Values.matrix.image) | quote }}
        imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
        env:
          {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
          - name: PYTHONPATH
            value: /opt/oriso-modules
          {{- end }}
          - name: SYNAPSE_SERVER_NAME
            valueFrom:
              configMapKeyRef:
                key: SYNAPSE_SERVER_NAME
                name: matrix-configmap-env             
          - name: SYNAPSE_REPORT_STATS
            valueFrom:
              configMapKeyRef:
                key: SYNAPSE_REPORT_STATS
                name: matrix-configmap-env             
          - name: SYNAPSE_ENABLE_AUTHENTICATED_MEDIA
            valueFrom:
              configMapKeyRef:
                key: SYNAPSE_ENABLE_AUTHENTICATED_MEDIA
                name: matrix-configmap-env       
        ports:
          {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
          - name: group-history
            containerPort: 8801
            protocol: TCP
          {{- end }}
          - containerPort: 8008
            protocol: TCP
          - containerPort: 8009
            protocol: TCP
          {{- if eq (include "oriso.appMetrics.enabled" .) "true" }}
          - name: metrics
            containerPort: 9000
            protocol: TCP
          {{- end }}
        livenessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /_matrix/client/versions
            port: 8008
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
          {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
          - name: group-policy-module
            mountPath: /opt/oriso-modules
            readOnly: true
          - name: group-policy-token
            mountPath: /run/oriso-group-policy
            readOnly: true
          {{- end }}
          - mountPath: /data
            name: synapse-data
          - mountPath: /data/homeserver.yaml
            name: homeserver-config
            subPath: homeserver.yaml
      volumes:
        {{- if eq (include "oriso.matrixGroupPolicy.enabled" .) "true" }}
        - name: group-policy-module
          configMap:
            name: matrix-group-policy-module
        - name: group-policy-token
          secret:
            secretName: {{ .Values.matrix.groupPolicy.existingSecret.name | quote }}
            items:
              - key: {{ .Values.matrix.groupPolicy.existingSecret.tokenKey | quote }}
                path: token
        {{- end }}
        - name: synapse-data
          persistentVolumeClaim:
            claimName: matrix-synapse-data
        - name: homeserver-config
          configMap:
            name: matrix-homeserver-oidc 
