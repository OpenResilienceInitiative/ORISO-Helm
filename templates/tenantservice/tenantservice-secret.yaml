apiVersion: v1
kind: Secret
metadata:
  name: tenantservice-secret
type: Opaque
data: 
  SPRING_DATASOURCE_USERNAME: {{ .Values.global.secrets.tenantServiceDbUsername | b64enc | quote }} 
  SPRING_DATASOURCE_PASSWORD: {{ .Values.global.secrets.tenantServiceDbPassword | b64enc | quote }}
  SPRING_LIQUIBASE_USER: {{ .Values.global.secrets.liquibaseUser | b64enc | quote }}
  SPRING_LIQUIBASE_PASSWORD: {{ .Values.global.secrets.liquibasePassword | b64enc | quote }}
  SPRING_RABBITMQ_USERNAME: {{ .Values.tenantService.springRabbitmqUsername | b64enc | quote }}  
  SPRING_RABBITMQ_PASSWORD: {{ .Values.tenantService.springRabbitmqPassword | b64enc | quote }}   
  MATRIX_ADMIN_USERNAME: {{ .Values.global.matrix.matrixAdminUsername | b64enc | quote }}
  MATRIX_ADMIN_PASSWORD: {{ .Values.global.matrix.matrixAdminPassword | b64enc | quote }}
  MATRIX_REGISTRATION_SHARED_SECRET: {{.Values.global.secrets.matrixRegistrationSharedSecret | b64enc | quote }}   
  # Required (fails deploy if blank, mirroring the agencyservice appkey rule from ORISO-Helm#49);
  # AES key for tenant SMTP passwords at rest (ORISO-TenantService#183). Generate with
  # `openssl rand -base64 32`; rotation makes stored ENC: values undecryptable.
  SETTINGS_SMTP_PASSWORD_ENCRYPTION_SECRET: {{ required "tenantService.smtpPasswordEncryptionSecret is required (tenant SMTP password encryption at rest, ORISO-TenantService#183); set it in your environment secrets.yaml" .Values.tenantService.smtpPasswordEncryptionSecret | b64enc | quote }}
