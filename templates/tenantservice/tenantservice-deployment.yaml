# TenantService Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenantservice
spec:
  replicas: {{ .Values.tenantService.replicas }}
  selector:
    matchLabels:
      app: tenantservice
  template:
    metadata:
      labels:
        app: tenantservice
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tenantservice
              topologyKey: kubernetes.io/hostname
      containers:
      - name: tenantservice
        image:  {{ .Values.tenantService.imageName }}:{{ .Values.tenantService.imageVersion }}
        imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
        ports:
        - containerPort: 8081
        env:
          - name: SPRING_PROFILES_ACTIVE
            valueFrom:
              configMapKeyRef:
                key: SPRING_PROFILES_ACTIVE
                name: tenantservice-configmap-env          
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              configMapKeyRef:
                key: SPRING_DATASOURCE_URL
                name: tenantservice-configmap-env          
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                key: SPRING_DATASOURCE_USERNAME
                name: tenantservice-secret      
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                key: SPRING_DATASOURCE_PASSWORD
                name: tenantservice-secret  
          - name: SETTINGS_SMTP_PASSWORD_ENCRYPTION_SECRET
            valueFrom:
              secretKeyRef:
                key: SETTINGS_SMTP_PASSWORD_ENCRYPTION_SECRET
                name: tenantservice-secret
          - name: KEYCLOAK_AUTH_SERVER_URL
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_AUTH_SERVER_URL
                name: tenantservice-configmap-env          
          - name: KEYCLOAK_REALM
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_REALM
                name: tenantservice-configmap-env          
          - name: SPRING_RABBITMQ_HOST
            valueFrom:
              configMapKeyRef:
                key: SPRING_RABBITMQ_HOST
                name: tenantservice-configmap-env          
          - name: SPRING_RABBITMQ_PORT
            valueFrom:
              configMapKeyRef:
                key: SPRING_RABBITMQ_PORT
                name: tenantservice-configmap-env          
          - name: SPRING_RABBITMQ_USERNAME
            valueFrom:
              secretKeyRef:
                key: SPRING_RABBITMQ_USERNAME
                name: tenantservice-secret 
          - name: SPRING_RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                key: SPRING_RABBITMQ_PASSWORD
                name: tenantservice-secret                       
          - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
            valueFrom:
              configMapKeyRef:
                key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
                name: tenantservice-configmap-env
          - name: SPRING_LIQUIBASE_ENABLED
            valueFrom:
              configMapKeyRef:
                key: SPRING_LIQUIBASE_ENABLED
                name: tenantservice-configmap-env
          - name: SPRING_LIQUIBASE_CHANGE_LOG
            valueFrom:
              configMapKeyRef:
                key: SPRING_LIQUIBASE_CHANGE_LOG
                name: tenantservice-configmap-env
          - name: SPRING_LIQUIBASE_CHANGELOG
            valueFrom:
              configMapKeyRef:
                key: SPRING_LIQUIBASE_CHANGELOG
                name: tenantservice-configmap-env
          - name: SPRING_LIQUIBASE_CONTEXTS
            valueFrom:
              configMapKeyRef:
                key: SPRING_LIQUIBASE_CONTEXTS
                name: tenantservice-configmap-env
          - name: SPRING_LIQUIBASE_USER
            valueFrom:
              secretKeyRef:
                key: SPRING_LIQUIBASE_USER
                name: tenantservice-secret
          - name: SPRING_LIQUIBASE_PASSWORD
            valueFrom:
              secretKeyRef:
                key: SPRING_LIQUIBASE_PASSWORD
                name: tenantservice-secret
          - name: CONSULTING_TYPE_SERVICE_API_URL
            valueFrom:
              configMapKeyRef:
                key: CONSULTING_TYPE_SERVICE_API_URL
                name: tenantservice-configmap-env
          - name: USER_SERVICE_API_URL
            valueFrom:
              configMapKeyRef:
                key: USER_SERVICE_API_URL
                name: tenantservice-configmap-env
          # This deployment has no envFrom - every variable is declared here
          # individually. A key added to the ConfigMap alone never reaches the
          # pod, which is exactly how the live patch of 2026-08-19 appeared to
          # do nothing at first.
          - name: APP_BASE_URL
            valueFrom:
              configMapKeyRef:
                key: APP_BASE_URL
                name: tenantservice-configmap-env
          - name: FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED
            valueFrom:
              configMapKeyRef:
                key: FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED
                name: tenantservice-configmap-env
          - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
            valueFrom:
              configMapKeyRef:
                key: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
                name: tenantservice-configmap-env
          - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
            valueFrom:
              configMapKeyRef:
                key: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
                name: tenantservice-configmap-env
          - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
            valueFrom:
              configMapKeyRef:
                key: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
                name: tenantservice-configmap-env
          - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
            valueFrom:
              configMapKeyRef:
                key: MANAGEMENT_OTLP_METRICS_EXPORT_URL
                name: tenantservice-configmap-env
          - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
            valueFrom:
              configMapKeyRef:
                key: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
                name: tenantservice-configmap-env
          - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
            valueFrom:
              configMapKeyRef:
                key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
                name: tenantservice-configmap-env
          - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS
            valueFrom:
              configMapKeyRef:
                key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS
                name: tenantservice-configmap-env
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
