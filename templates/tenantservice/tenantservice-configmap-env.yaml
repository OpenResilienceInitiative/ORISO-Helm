apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: tenantservice-configmap-env
  name: tenantservice-configmap-env
data:
  # General 
  
  SPRING_LIQUIBASE_ENABLED: {{ .Values.global.enableLiquibase | quote }}
  SPRING_LIQUIBASE_CHANGE_LOG: {{ default "classpath:db/changelog/tenantservice-master.xml" .Values.tenantService.liquibaseChangeLog | replace "classpath:/db/changelog" "classpath:db/changelog" | quote }}
  SPRING_LIQUIBASE_CHANGELOG: {{ default "classpath:db/changelog/tenantservice-master.xml" .Values.tenantService.liquibaseChangeLog | replace "classpath:/db/changelog" "classpath:db/changelog" | quote }}
  SPRING_LIQUIBASE_CONTEXTS: {{ default "seed" .Values.tenantService.liquibaseContexts | quote }}
  SPRING_PROFILES_ACTIVE: {{ .Values.tenantService.springProfilesActive }}  
  SPRING_DATASOURCE_URL: {{ .Values.tenantService.springDatasourceURL }}  
  KEYCLOAK_AUTH_SERVER_URL: {{ .Values.global.keycloakAuthServerUrl  }}  
  KEYCLOAK_REALM: {{ .Values.global.keycloak.realm }}  
  SYSTEM_EMAIL_DELIVERY_SERVICE_SUBJECT: {{ .Values.tenantService.systemEmailDeliveryServiceSubject | default "" | quote }}
  SYSTEM_EMAIL_DELIVERY_SERVICE_CLIENT: {{ .Values.tenantService.systemEmailDeliveryServiceClient | default "" | quote }}
  SPRING_RABBITMQ_HOST: {{ .Values.tenantService.springRabbitmqHost }}  
  SPRING_RABBITMQ_PORT: "{{ .Values.tenantService.springRabbitmqPort }}"  
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: {{ .Values.global.springSecurityOAuth2ResourceserverJWTIssuerURI }}   
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: {{ .Values.global.springSecurityOAuth2ResourceserverJWTJWKSETURI }}   
  USER_SERVICE_API_URL: {{ .Values.userService.serviceURL }}  
  CONSULTING_TYPE_SERVICE_API_URL: {{ .Values.consultingTypeService.serviceURL }}  
  # APP_BASE_URL is the app frontend origin TenantDpaFacade prefixes onto the
  # DPA sign link (`buildSignLink` = APP_BASE_URL + "/dpa-sign/" + token).
  # application.properties leaves `app.base.url` EMPTY, so without this key the
  # link ships path-only, UserService rejects it as "signLink is invalid" (400),
  # and the Admin panel translates that into "please enter a valid e-mail
  # address" — blaming the address for a missing config two services away.
  # Observed on pre-dev 2026-08-19; every failed attempt still minted a sign
  # link, so five failures throttled the onboarding for 14 days.
  # Same FQDN and same derivation as consultingtypeservice, deliberately, so
  # the two cannot drift apart.
  APP_BASE_URL: {{ include "oriso.publicOrigin" . | quote }}
  # Keycloak `sub` of the UserService's technical service identity; TenantService
  # recognises that caller by this claim plus the realm role `technical`
  # (ORISO-TenantService#272, ORISO-Helm#367). realm.json seeds `technical` with a
  # fixed id; an existing realm keeps its own id, so look it up once. The
  # keycloak-reconcile-service-identities hook fails the release on a mismatch.
  {{- $technicalSubject := required "global.keycloak.serviceTechUserId must be the Keycloak user id (sub) of the technical user" .Values.global.keycloak.serviceTechUserId }}
  {{- if not (regexMatch "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" $technicalSubject) }}
  {{- fail (printf "global.keycloak.serviceTechUserId must be the Keycloak user id (a UUID) of the technical user, got %q" $technicalSubject) }}
  {{- end }}
  TECHNICAL_SERVICE_SUBJECT: {{ $technicalSubject | quote }}
  MATRIX_API_URL: {{ .Values.matrix.matrixApiUrl }}
  MATRIX_SERVER_NAME: {{ .Values.matrix.matrixServerName }}
  FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED: {{ .Values.global.multitenancyWithSingleDomainEnabled | quote }}
  # OBS-P2: OTLP traces/metrics to the SigNoz gateway collector. Property
  # names + full /v1/{traces,metrics} paths verified against Spring Boot
  # 4.0.1 source directly (management.otlp.tracing.endpoint does NOT exist
  # in this version).
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://{{ include "oriso.otlpCollectorHost" . }}/v1/traces"
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: {{ include "oriso.observabilityEnabled" . | quote }}
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://{{ include "oriso.otlpCollectorHost" . }}/v1/metrics"
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: {{ include "oriso.observabilityEnabled" . | quote }}
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: "always"
