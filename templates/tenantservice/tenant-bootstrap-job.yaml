{{- $bootstrapTenants := default (dict) .Values.tenantService.bootstrapTenants -}}
{{- $bootstrapEnabled := true -}}
{{- if hasKey $bootstrapTenants "enabled" -}}
{{- $bootstrapEnabled = $bootstrapTenants.enabled -}}
{{- end -}}
{{- if $bootstrapEnabled }}
{{- $mariadb := index .Values "online-counseling-mariadb" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: tenant-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: tenant-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: tenant-bootstrap
          image: "{{ $mariadb.imageName }}:{{ $mariadb.imageVersion }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: "mariadb.{{ .Release.Namespace }}"
            - name: MYSQL_DATABASE
              value: "tenantservice"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: tenantservice-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenantservice-secret
                  key: SPRING_DATASOURCE_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              mysql() {
                mariadb -h "$MYSQL_HOST" -P 3306 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" "$@"
              }

              until mysql -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '${MYSQL_DATABASE}' AND table_name = 'DATABASECHANGELOGLOCK';" | grep -qx 1; do
                echo "waiting for TenantService Liquibase lock table"
                sleep 5
              done

              until mysql -N -e "SELECT COUNT(*) FROM DATABASECHANGELOGLOCK WHERE ID = 1 AND LOCKED = 0;" | grep -qx 1; do
                echo "waiting for TenantService Liquibase to release lock"
                sleep 5
              done

              until mysql -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '${MYSQL_DATABASE}' AND table_name = 'tenant';" | grep -qx 1; do
                echo "waiting for TenantService tenant table"
                sleep 5
              done

              mysql < /bootstrap/tenant-bootstrap.sql
              echo "tenant bootstrap completed"
          volumeMounts:
            - name: tenant-bootstrap-sql
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: tenant-bootstrap-sql
          configMap:
            name: tenant-bootstrap-sql
{{- end }}
