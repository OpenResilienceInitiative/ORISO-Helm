{{- $scenario := .Values.global.keycloak.taskIdentities | default dict -}}
{{- $enabled := dig "enabled" false $scenario -}}
{{- $provisionOnly := dig "provisionOnly" false $scenario -}}
{{- if or $enabled $provisionOnly }}
{{- $image := required "keycloakSmtpReconcile.image must use an immutable digest" .Values.keycloakSmtpReconcile.image -}}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "keycloakSmtpReconcile.image must use an immutable sha256 digest" -}}
{{- end -}}
{{- $scenarioSecrets := list
  (list "TASK_IDENTITY_SETUP_CLIENT_SECRET" (.Values.global.secrets.keycloakTaskIdentitySetupClientSecret | default ""))
  (list "TASK_IDENTITY_ACCOUNT_CREATE_CLIENT_SECRET" (.Values.global.secrets.keycloakTaskIdentityAccountCreateClientSecret | default ""))
  (list "TASK_IDENTITY_ACCOUNT_ADMIN_CLIENT_SECRET" (.Values.global.secrets.keycloakTaskIdentityAccountAdminClientSecret | default ""))
  (list "TASK_IDENTITY_MAIL_CLIENT_SECRET" (.Values.global.secrets.keycloakTaskIdentityMailClientSecret | default ""))
  (list "TASK_IDENTITY_RUNTIME_CLIENT_SECRET" (.Values.global.secrets.keycloakTaskIdentityRuntimeClientSecret | default "")) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-reconcile-task-identities-clients
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-7"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
data:
  {{- range $pair := $scenarioSecrets }}
  {{ index $pair 0 }}: {{ index $pair 1 | toString | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-reconcile-task-identities-clients-script
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  keycloak-reconcile-task-identities-clients.py: |
{{ .Files.Get "files/keycloak-reconcile-task-identities-clients.py" | indent 4 }}
  keycloak-reconcile-service-clients.py: |
{{ .Files.Get "files/keycloak-reconcile-service-clients.py" | indent 4 }}
  keycloak-reconcile-smtp.py: |
{{ .Files.Get "files/keycloak-reconcile-smtp.py" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-reconcile-task-identities-clients
  namespace: {{ .Release.Namespace }}
  annotations:
    # Existing Dev realms already have Keycloak running. This must prepare or
    # verify the clients before the UserService workload can use FIVE_ACTORS.
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Keep the completed Job so the operator can read the generated subjects
    # after the provision pass. The next Helm upgrade removes it first.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: keycloak-reconcile-task-identities-clients
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reconcile-task-identities-clients
          image: {{ $image | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          command: ["python3", "/scripts/keycloak-reconcile-task-identities-clients.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          env:
            - name: KEYCLOAK_URL
              value: {{ include "oriso.keycloakAdminUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.global.keycloak.realm | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret-env
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: TASK_IDENTITY_MODE
              value: {{ if $provisionOnly }}"provision"{{ else }}"enable"{{ end }}
            {{- range $pair := $scenarioSecrets }}
            - name: {{ index $pair 0 }}
              valueFrom:
                secretKeyRef:
                  name: keycloak-reconcile-task-identities-clients
                  key: {{ index $pair 0 }}
            {{- end }}
            {{- if $enabled }}
            {{- range $pair := list (list "TASK_IDENTITY_SETUP_SERVICE_SUBJECT" "setup" "serviceSubject") (list "TASK_IDENTITY_ACCOUNT_CREATE_SERVICE_SUBJECT" "accountCreate" "serviceSubject") (list "TASK_IDENTITY_ACCOUNT_ADMIN_SERVICE_SUBJECT" "accountAdmin" "serviceSubject") (list "TASK_IDENTITY_MAIL_SERVICE_SUBJECT" "mail" "serviceSubject") (list "TASK_IDENTITY_RUNTIME_SERVICE_SUBJECT" "runtime" "serviceSubject") }}
            - name: {{ index $pair 0 }}
              value: {{ dig (index $pair 1) (index $pair 2) "" $scenario | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: keycloak-reconcile-task-identities-clients-script
{{- end }}
