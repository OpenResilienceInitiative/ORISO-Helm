{{- if (.Values.addonService).enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: addonservice-secret
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: {{ include "oriso.addonService.dbUsername" . | b64enc | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ include "oriso.addonService.dbPassword" . | b64enc | quote }}
  ADDONS_TOKEN_PRIVATEKEYPEM: {{ include "oriso.addonService.tokenPrivateKeyPem" . | b64enc | quote }}
  SPRING_RABBITMQ_USERNAME: {{ .Values.global.secrets.rabbitmqUsername | default "" | toString | b64enc | quote }}
  SPRING_RABBITMQ_PASSWORD: {{ .Values.global.secrets.rabbitmqPassword | default "" | toString | b64enc | quote }}
{{- end }}
