{{- $signoz := get .Values "signoz" | default dict -}}
{{- $managed := get $signoz "orisoObservability" | default dict -}}
{{- $deploymentIdentity := get $managed "deploymentIdentity" | default dict -}}
{{- $collector := get .Values "signozCollector" | default dict -}}
{{- $platform := get $managed "platformAlerts" | default dict -}}
{{- $heartbeat := get $managed "heartbeat" | default dict -}}
{{- $heartbeatEnabled := false -}}
{{- $heartbeatChannel := get $heartbeat "channelName" | default "oriso-dev-heartbeat" -}}
{{- if hasKey $heartbeat "enabled" -}}
  {{- $heartbeatEnabled = get $heartbeat "enabled" -}}
  {{- if not (kindIs "bool" $heartbeatEnabled) -}}
    {{- fail "signoz.orisoObservability.heartbeat.enabled must be a boolean" -}}
  {{- end -}}
{{- end -}}
{{- if $heartbeatEnabled -}}
  {{- if not (and (eq .Values.global.observability.deploymentEnvironment "dev") (get $signoz "enabled") (get $managed "enabled") (get $collector "enabled") (get $collector "clusterName")) -}}
    {{- fail "heartbeat requires Dev, SigNoz, managed observability and a named Kubernetes collector" -}}
  {{- end -}}
  {{- if eq $heartbeatChannel (get $managed "channelName" | default "oriso-alerts-slack") -}}
    {{- fail "heartbeat requires a separate notification channel" -}}
  {{- end -}}
{{- end -}}
{{- $platformEnabled := false -}}
{{- if hasKey $platform "enabled" -}}
  {{- $platformEnabled = get $platform "enabled" -}}
  {{- if not (kindIs "bool" $platformEnabled) -}}
    {{- fail "signoz.orisoObservability.platformAlerts.enabled must be a boolean" -}}
  {{- end -}}
{{- end -}}
{{- if $platformEnabled -}}
  {{- if not (eq .Values.global.observability.deploymentEnvironment "dev") -}}
    {{- fail "platform alerts require Dev" -}}
  {{- end -}}
  {{- if not (and (get $signoz "enabled") (get $managed "enabled") (get $collector "enabled") (get $collector "clusterName")) -}}
    {{- fail "platform alerts require SigNoz, managed observability and a named Kubernetes collector" -}}
  {{- end -}}
  {{- if not (and (eq (include "oriso.appMetrics.enabled" .) "true") (eq (include "oriso.dbMetrics.enabled" .) "true")) -}}
    {{- fail "platform alerts require appMetrics and dbMetrics" -}}
  {{- end -}}
  {{- if not .Values.global.observability.externalCertManagerNamespace -}}
    {{- fail "platform alerts require externalCertManagerNamespace for certificate metrics" -}}
  {{- end -}}
{{- end -}}
{{- if and (get $signoz "enabled" | default false) (get $managed "enabled" | default false) }}
{{- $name := printf "%s-signoz-observability" .Release.Name -}}
{{- $apiKeySecret := get $managed "apiKeySecret" | default dict -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz-observability
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signoz-observability
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision-and-prove
          image: {{ required "signoz.orisoObservability.image must be set" (get $managed "image") | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - python3
          args:
            - /opt/oriso/signoz/signoz_observability.py
            - --mode
            - provision
          env:
            - name: SIGNOZ_API_URL
              value: {{ include "oriso.signozInternalApiUrl" . | quote }}
            - name: SIGNOZ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "signoz.orisoObservability.apiKeySecret.name must name an existing Secret" (get $apiKeySecret "name") | quote }}
                  key: {{ get $apiKeySecret "key" | default "apiKey" | quote }}
            - name: SIGNOZ_CHANNEL_NAME
              value: {{ get $managed "channelName" | default "oriso-alerts-slack" | quote }}
            - name: ORISO_ASSETS_DIR
              value: /opt/oriso/signoz
            - name: ORISO_ENVIRONMENT
              value: {{ .Values.global.observability.deploymentEnvironment | quote }}
            - name: ORISO_CLUSTER_NAME
              value: {{ get $collector "clusterName" | quote }}
            - name: ORISO_PLATFORM_ALERTS_ENABLED
              value: {{ $platformEnabled | quote }}
            - name: ORISO_HEARTBEAT_ENABLED
              value: {{ $heartbeatEnabled | quote }}
            - name: ORISO_HEARTBEAT_CHANNEL_NAME
              value: {{ $heartbeatChannel | quote }}
            - name: ORISO_E2E_DASHBOARDS
              value: {{ get $managed "e2eDashboards" | default false | quote }}
            - name: ORISO_AGENT_FORWARDING
              value: {{ get $managed "agentForwarding" | default false | quote }}
            - name: ORISO_CONFORMANCE_CHECK
              value: {{ get $managed "conformanceCheck" | default false | quote }}
            - name: ORISO_DEPLOYMENT_IDENTITY_ENABLED
              value: {{ get $deploymentIdentity "enabled" | default false | quote }}
          resources:
{{ get $managed "resources" | default dict | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: assets
              mountPath: /opt/oriso/signoz
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: assets
          configMap:
            name: {{ $name }}
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
{{- end }}
