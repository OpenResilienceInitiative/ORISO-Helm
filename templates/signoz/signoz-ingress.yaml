{{- $signoz := get .Values "signoz" | default dict -}}
{{- $orisoIngress := get $signoz "orisoIngress" | default dict -}}
{{- $signozApp := get $signoz "signoz" | default dict -}}
{{- $signozService := get $signozApp "service" | default dict -}}
{{- if and (get $signoz "enabled" | default false) (get $orisoIngress "enabled" | default true) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oriso.signozServiceName" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The app only serves the UI under /signoz/ and does not redirect the
    # bare path itself.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/signoz$ /signoz/ permanent;
spec:
  ingressClassName: {{ get $orisoIngress "ingressClassName" | default "nginx" | quote }}
  # Served on the main domain under /signoz — reuses the main-ingress
  # certificate, so no extra DNS record or cert-manager Certificate is needed.
  tls:
    - hosts:
        - {{ .Values.global.domainName | quote }}
      secretName: {{ printf "%s-tls" (.Values.global.domainName | replace "." "-") }}
  rules:
    - host: {{ .Values.global.domainName | quote }}
      http:
        paths:
          # SigNoz resolves assets/APIs against SIGNOZ_GLOBAL_EXTERNAL__URL
          # (signoz.signoz.env), which requires the full /signoz path to be
          # forwarded unmodified — do not add a rewrite annotation here.
          - path: /signoz
            pathType: Prefix
            backend:
              service:
                name: {{ include "oriso.signozServiceName" . }}
                port:
                  number: {{ get $signozService "port" | default 8080 }}
{{- end -}}

{{- $o := get .Values.global "observability" | default dict }}
{{- if and (get $signoz "enabled" | default false) (get (get $o "webVitals" | default dict) "enabled" | default false) }}
---
{{- /*
Browser Web Vitals ingest (global.observability.webVitals). Same origin as
Frontend and Admin, so no CORS. Unauthenticated, so the location only accepts
small uncompressed OTLP metric POSTs at a bounded rate, and is its own Ingress
so these limits do not touch the SigNoz UI. It reaches only the collector's
otlp/rum receiver, whose pipeline drops anything that is not a known browser
metric and overwrites the resource attributes (values.yaml.default).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oriso.signozServiceName" . }}-rum-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "32k"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    # Compressed bodies would slip past the size limit; the browser exporter
    # does not compress. The rewrite stays in this location: the
    # rewrite-target annotation would switch every path of the host to
    # case-insensitive regex matching.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_method != POST) { return 405; }
      if ($http_content_encoding != "") { return 415; }
      rewrite ^/signoz-rum/v1/metrics$ /v1/metrics break;
spec:
  ingressClassName: {{ get $orisoIngress "ingressClassName" | default "nginx" | quote }}
  tls:
    - hosts:
        - {{ .Values.global.domainName | quote }}
      secretName: {{ printf "%s-tls" (.Values.global.domainName | replace "." "-") }}
  rules:
    - host: {{ .Values.global.domainName | quote }}
      http:
        paths:
          - path: /signoz-rum/v1/metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "oriso.signozOtelCollectorServiceName" . }}
                port:
                  number: {{ dig "otelCollector" "ports" "otlp-rum" "servicePort" 4319 (get .Values "signoz" | default dict) }}
{{- end }}

{{- $e2e := get $o "e2eTraceIngest" | default dict }}
{{- if and (get $signoz "enabled" | default false) (get $e2e "enabled" | default false) }}
---
{{- /*
E2E trace ingest (global.observability.e2eTraceIngest), for the scheduled Dev
E2E run on a GitHub runner that cannot reach the cluster. Off by default.
ingress-nginx itself checks HTTP Basic credentials against an existing Secret
(auth-type/auth-secret, the same mechanism as Storybook and the health
dashboard), so no snippet reads a token and none is rendered into this chart.
Only POST of a small uncompressed OTLP/HTTP trace body at a bounded rate is
forwarded, and only to the dedicated otlp/e2e collector receiver (own port,
own pipeline: only service.name=oriso-e2e is kept, environment is overwritten,
oriso.signal.source=e2e is set), never to the main OTLP receiver.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "oriso.signozServiceName" . }}-e2e-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: signoz
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: {{ required "global.observability.e2eTraceIngest.authSecret must name an existing basic-auth Secret when e2eTraceIngest is enabled" (get $e2e "authSecret") | quote }}
    nginx.ingress.kubernetes.io/auth-secret-type: auth-file
    nginx.ingress.kubernetes.io/auth-realm: "ORISO E2E trace ingest"
    nginx.ingress.kubernetes.io/proxy-body-size: "256k"
    nginx.ingress.kubernetes.io/limit-rps: "5"
    # Other ingresses on the shared host can turn Exact into a regex location.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri != "/signoz-e2e/v1/traces") { return 404; }
      if ($request_method != POST) { return 405; }
      if ($http_content_encoding != "") { return 415; }
      rewrite ^/signoz-e2e/v1/traces$ /v1/traces break;
spec:
  ingressClassName: {{ get $orisoIngress "ingressClassName" | default "nginx" | quote }}
  tls:
    - hosts:
        - {{ .Values.global.domainName | quote }}
      secretName: {{ printf "%s-tls" (.Values.global.domainName | replace "." "-") }}
  rules:
    - host: {{ .Values.global.domainName | quote }}
      http:
        paths:
          - path: /signoz-e2e/v1/traces
            pathType: Exact
            backend:
              service:
                name: {{ include "oriso.signozOtelCollectorServiceName" . }}
                port:
                  number: {{ dig "otelCollector" "ports" "otlp-e2e" "servicePort" 4321 (get .Values "signoz" | default dict) }}
{{- end }}
