{{- /*
Least-privilege RBAC for the SigNoz collection agents (ORISO-Helm#392).
The agent reads node/kubelet stats; the cluster collector watches workload
objects and events. Neither is granted write on anything.
*/ -}}
{{- if eq (include "oriso.signozCollector.enabled" .) "true" -}}
{{- $agent := include "oriso.signozCollector.agentFullname" . -}}
{{- $cluster := include "oriso.signozCollector.clusterFullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $agent }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oriso.signozCollector.labels" (dict "root" $ "component" "otel-agent") | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cluster }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oriso.signozCollector.labels" (dict "root" $ "component" "otel-deployment") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" $agent .Release.Namespace }}
  labels:
    {{- include "oriso.signozCollector.labels" (dict "root" $ "component" "otel-agent") | nindent 4 }}
rules:
  - apiGroups: [""]
    # kubeletstats resolves a PVC to its PersistentVolume for volume metadata;
    # without persistentvolumes it drops every PVC-backed volume metric.
    resources: ["pods", "namespaces", "nodes", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "extensions"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $agent .Release.Namespace }}
  labels:
    {{- include "oriso.signozCollector.labels" (dict "root" $ "component" "otel-agent") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" $agent .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $agent }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" $cluster .Release.Namespace }}
  labels:
    {{- include "oriso.signozCollector.labels" (dict "root" $ "component" "otel-deployment") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - events
      - namespaces
      - namespaces/status
      - nodes
      - nodes/spec
      - pods
      - pods/status
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $cluster .Release.Namespace }}
  labels:
    {{- include "oriso.signozCollector.labels" (dict "root" $ "component" "otel-deployment") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" $cluster .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $cluster }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
