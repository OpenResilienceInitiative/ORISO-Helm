{{- /*
Creates or corrects the read-only monitoring users the SigNoz cluster collector
uses (global.observability.dbMetrics), on every install and upgrade. Idempotent:
the password always follows the oriso-db-monitoring Secret, the rights are set
exactly. Each step runs as the store's own administrator in the store's own image.

  MariaDB   oriso_monitor  PROCESS, REPLICATION CLIENT, SELECT on performance_schema
  MongoDB   oriso_monitor  clusterMonitor (server and database statistics, no data)
  RabbitMQ  oriso-monitor  tag "monitoring" (read-only management API, no AMQP rights)

Redis needs no user: its existing redis-exporter sidecar is scraped instead.
*/ -}}
{{- if eq (include "oriso.dbMetrics.enabled" .) "true" -}}
{{- $mariadb := index .Values "online-counseling-mariadb" | default dict -}}
{{- $mongodb := index .Values "online-counseling-mongodb" | default dict -}}
{{- $dbMonitoring := .Values.dbMonitoring | default dict -}}
{{- $curlImage := required "dbMonitoring.curlImage is required when global.observability.dbMetrics is enabled" (get $dbMonitoring "curlImage") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: db-monitoring-reconcile
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: db-monitoring-reconcile
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: mariadb
          image: "{{ required "online-counseling-mariadb.imageName is required for dbMetrics" (get $mariadb "imageName") }}:{{ required "online-counseling-mariadb.imageVersion is required for dbMetrics" (get $mariadb "imageVersion") }}"
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oriso-db-monitoring
                  key: mariadb-password
          command:
            - /bin/sh
            - -ec
            - |
              ready=""
              for i in $(seq 1 60); do
                mariadb-admin -h mariadb -uroot --password="$MARIADB_ROOT_PASSWORD" ping >/dev/null 2>&1 && { ready=1; break; }
                echo "waiting for MariaDB ($i/60)"; sleep 5
              done
              [ -n "$ready" ] || { echo "MariaDB not ready after 5 minutes" >&2; exit 1; }
              # The password is alphanumeric (generated by the chart), so it is safe inside the quotes.
              mariadb -h mariadb -uroot --password="$MARIADB_ROOT_PASSWORD" <<SQL
              CREATE USER IF NOT EXISTS 'oriso_monitor'@'%' IDENTIFIED BY '${MONITOR_PASSWORD}';
              ALTER USER 'oriso_monitor'@'%' IDENTIFIED BY '${MONITOR_PASSWORD}' WITH MAX_USER_CONNECTIONS 3;
              REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'oriso_monitor'@'%';
              GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'oriso_monitor'@'%';
              GRANT SELECT ON performance_schema.* TO 'oriso_monitor'@'%';
              SQL
              echo "MARIADB_MONITOR_RECONCILED"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: mongodb
          image: "{{ required "online-counseling-mongodb.imageName is required for dbMetrics" (get $mongodb "imageName") }}:{{ required "online-counseling-mongodb.imageVersion is required for dbMetrics" (get $mongodb "imageVersion") }}"
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oriso-db-monitoring
                  key: mongodb-password
          command:
            - /bin/sh
            - -ec
            - |
              URI="mongodb://mongodb:27017/admin?directConnection=true"
              ready=""
              for i in $(seq 1 60); do
                mongosh "$URI" --quiet -u "$MONGO_ROOT_USERNAME" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin \
                  --eval 'db.runCommand({ping: 1}).ok' >/dev/null 2>&1 && { ready=1; break; }
                echo "waiting for MongoDB ($i/60)"; sleep 5
              done
              [ -n "$ready" ] || { echo "MongoDB not ready after 5 minutes" >&2; exit 1; }
              mongosh "$URI" --quiet -u "$MONGO_ROOT_USERNAME" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval '
                const admin = db.getSiblingDB("admin");
                const spec = { pwd: process.env.MONITOR_PASSWORD, roles: [{ role: "clusterMonitor", db: "admin" }] };
                if (admin.getUser("oriso_monitor")) { admin.updateUser("oriso_monitor", spec); }
                else { admin.createUser(Object.assign({ user: "oriso_monitor" }, spec)); }
                print("MONGODB_MONITOR_RECONCILED");'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: rabbitmq
          image: {{ $curlImage | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RABBITMQ_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
            - name: MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oriso-db-monitoring
                  key: rabbitmq-password
          command:
            - /bin/sh
            - -ec
            - |
              API=http://rabbitmq:15672/api
              ready=""
              for i in $(seq 1 60); do
                curl -fsS -o /dev/null -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" "$API/overview" && { ready=1; break; }
                echo "waiting for RabbitMQ management API ($i/60)"; sleep 5
              done
              [ -n "$ready" ] || { echo "RabbitMQ not ready after 5 minutes" >&2; exit 1; }
              # Vhost permissions are separate records a PUT keeps. Deleting the
              # user drops them all; PUT then recreates it with the monitoring
              # tag only and no vhost permission.
              code=$(curl -sS -o /dev/null -w '%{http_code}' -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" \
                -X DELETE "$API/users/oriso-monitor")
              case "$code" in
                204|404) ;;
                *) echo "RabbitMQ: deleting oriso-monitor failed with HTTP $code" >&2; exit 1 ;;
              esac
              curl -fsS -o /dev/null -u "$RABBITMQ_ADMIN_USER:$RABBITMQ_ADMIN_PASS" -X PUT \
                -H "content-type: application/json" \
                -d "{\"password\":\"${MONITOR_PASSWORD}\",\"tags\":\"monitoring\"}" \
                "$API/users/oriso-monitor"
              echo "RABBITMQ_MONITOR_RECONCILED"
      containers:
        - name: done
          image: {{ $curlImage | quote }}
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c", "echo DB_MONITORING_RECONCILED"]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end -}}
