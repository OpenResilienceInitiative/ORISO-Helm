{{- /*
Keeps SigNoz data across chart mistakes (ORISO SigNoz plan, slice 1.1).

On 2026-10-14 a Dev upgrade recreated the SigNoz volumes; the storage class
reclaims with Delete, so users, API keys and dashboards were lost.

- retain hook: switches the persistent volumes behind the SigNoz, ClickHouse
  and ZooKeeper claims to reclaim policy Retain, so a deleted claim leaves its
  volume (and the data) behind. Helm looks the volumes up at upgrade time and
  grants the hook get/patch on exactly those volumes, only while the hook
  runs; with nothing left to switch it renders nothing. A fresh install has
  no bound volumes yet, so the first upgrade after it does the switch.
- backup CronJob: copies signoz.db (users, API keys, dashboards, alerts) with
  SQLite's online backup API into its own claim, which Helm never deletes.
  It runs on the SigNoz pod's node because the volume is ReadWriteOnce.
*/ -}}
{{- $signoz := get .Values "signoz" | default dict -}}
{{- $dp := get $signoz "orisoDataProtection" | default dict -}}
{{- if and (get $signoz "enabled" | default false) (get $dp "enabled" | default false) -}}
{{- $name := printf "%s-signoz-data-protection" .Release.Name -}}
{{- /* CronJob names may have 52 characters: the controller appends 11 for each Job. */ -}}
{{- $cronName := printf "%s-backup" ($name | trunc 45 | trimSuffix "-") -}}
{{- /* Job names and label values may have 63 characters; the suffix stays readable. */ -}}
{{- $retainName := printf "%s-retain" ($name | trunc 56 | trimSuffix "-") -}}
{{- /* The StatefulSet names, with the override rules of the vendored charts (signoz.fullname, common.names.fullname). */ -}}
{{- $signozSts := include "oriso.signozFullname" . -}}
{{- $chName := include "oriso.signozClickhouseFullname" . -}}
{{- /* The claims holding signoz.db, derived like the SigNoz chart's StatefulSet: one per replica, or the
shared existingClaim; none with PostgreSQL or without persistence. The backup copies ordinal 0's. */ -}}
{{- $signozValues := get $signoz "signoz" | default dict -}}
{{- $persistence := get $signozValues "persistence" | default dict -}}
{{- $sqliteClaim := "" -}}
{{- $sqliteClaims := list -}}
{{- if not (dig "postgresql" "enabled" false $signoz) -}}
{{- if get $persistence "existingClaim" -}}
{{- $sqliteClaim = get $persistence "existingClaim" -}}
{{- $sqliteClaims = list $sqliteClaim -}}
{{- else if (hasKey $persistence "enabled" | ternary (get $persistence "enabled") true) -}}
{{- $sqliteClaim = printf "signoz-db-%s-0" $signozSts -}}
{{- range $member := until (int (get $signozValues "replicaCount" | default 1)) -}}
{{- $sqliteClaims = append $sqliteClaims (printf "signoz-db-%s-%d" $signozSts $member) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* All claims as <namespace>/<claim>, derived like the vendored charts: every
ClickHouse shard and replica and every ZooKeeper member, in the namespace
each chart uses; existingClaim wins, none without persistence. */ -}}
{{- $clickhouse := get $signoz "clickhouse" | default dict -}}
{{- $zookeeper := get $clickhouse "zookeeper" | default dict -}}
{{- $chPersistence := get $clickhouse "persistence" | default dict -}}
{{- $zkPersistence := get $zookeeper "persistence" | default dict -}}
{{- $chNamespace := get $clickhouse "namespace" | default .Release.Namespace -}}
{{- $zkNamespace := get $zookeeper "namespaceOverride" | default .Release.Namespace -}}
{{- $zkName := get $zookeeper "nameOverride" | default "zookeeper" -}}
{{- $zkFullname := get $zookeeper "fullnameOverride" | default (contains $zkName .Release.Name | ternary .Release.Name (printf "%s-%s" .Release.Name $zkName)) | trunc 63 | trimSuffix "-" -}}
{{- /* PostgreSQL and ZooKeeper render existingClaim with tpl in their own chart context; do the same. */ -}}
{{- $zkRoot := dict "Values" $zookeeper "Release" .Release "Chart" (dict "Name" "zookeeper") "Capabilities" .Capabilities "Template" .Template -}}
{{- $layout := get $clickhouse "layout" | default dict -}}
{{- $defaultClaims := list -}}
{{- range $claim := $sqliteClaims -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/%s" $.Release.Namespace $claim) -}}
{{- end -}}
{{- /* SigNoz on PostgreSQL keeps users, dashboards and alerts there instead of signoz.db. */ -}}
{{- $postgres := get $signoz "postgresql" | default dict -}}
{{- $pgPersistence := get $postgres "persistence" | default dict -}}
{{- if and (get $postgres "enabled") (hasKey $pgPersistence "enabled" | ternary (get $pgPersistence "enabled") true) -}}
{{- if get $pgPersistence "existingClaim" -}}
{{- $pgRoot := dict "Values" $postgres "Release" .Release "Chart" (dict "Name" "postgresql") "Capabilities" .Capabilities "Template" .Template -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/%s" .Release.Namespace (tpl (get $pgPersistence "existingClaim") $pgRoot)) -}}
{{- else -}}
{{- $pgName := get $postgres "nameOverride" | default "postgresql" -}}
{{- $pgFullname := get $postgres "fullnameOverride" | default (contains $pgName .Release.Name | ternary .Release.Name (printf "%s-%s" .Release.Name $pgName)) | trunc 63 | trimSuffix "-" -}}
{{- range $member := until (int (get $postgres "replicaCount" | default 1)) -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/pgdata-%s-%d" $.Release.Namespace $pgFullname $member) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if get $chPersistence "existingClaim" -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/%s" $chNamespace (get $chPersistence "existingClaim")) -}}
{{- else if (hasKey $chPersistence "enabled" | ternary (get $chPersistence "enabled") true) -}}
{{- range $shard := until (int (get $layout "shardsCount" | default 1)) -}}
{{- range $replica := until (int (get $layout "replicasCount" | default 1)) -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/data-volumeclaim-template-chi-%s-%s-%d-%d-0" $chNamespace $chName (get $clickhouse "cluster" | default "cluster") $shard $replica) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if (hasKey $zkPersistence "enabled" | ternary (get $zkPersistence "enabled") true) -}}
{{- if get $zkPersistence "existingClaim" -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/%s" $zkNamespace (tpl (get $zkPersistence "existingClaim") $zkRoot)) -}}
{{- else -}}
{{- range $member := until (int (get $zookeeper "replicaCount" | default 1)) -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/data-%s-%d" $zkNamespace $zkFullname $member) -}}
{{- end -}}
{{- end -}}
{{- /* The dedicated transaction log, when ZooKeeper has one. */ -}}
{{- $zkLog := get $zkPersistence "dataLogDir" | default dict -}}
{{- if get $zkLog "existingClaim" -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/%s" $zkNamespace (tpl (get $zkLog "existingClaim") $zkRoot)) -}}
{{- else if get $zookeeper "dataLogDir" -}}
{{- range $member := until (int (get $zookeeper "replicaCount" | default 1)) -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/data-log-%s-%d" $zkNamespace $zkFullname $member) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- /* The native ClickHouse signal archive claim (#499), mounted by ClickHouse as disk oriso_signal_backup. */ -}}
{{- $signal := get $dp "signalBackup" | default dict -}}
{{- $signalClaim := get $signal "claim" | default "signoz-clickhouse-signal-backup" -}}
{{- /* Like the claims above: an external ClickHouse has nothing here to back up. Everything else
lives in ClickHouse's namespace, beside the claim ClickHouse mounts. */ -}}
{{- $signalOn := and (get $signal "enabled") (hasKey $clickhouse "enabled" | ternary (get $clickhouse "enabled") true) -}}
{{- if $signalOn -}}
{{- /* One BACKUP statement on one pod covers only that pod's shard and replica. */ -}}
{{- if or (gt (int (get $layout "shardsCount" | default 1)) 1) (gt (int (get $layout "replicasCount" | default 1)) 1) -}}
{{- fail "signoz.orisoDataProtection.signalBackup supports one ClickHouse shard and replica; a larger layout needs BACKUP ON CLUSTER" -}}
{{- end -}}
{{- /* ClickHouse must mount the claim and register the disk, or BACKUP fails at night instead of now. */ -}}
{{- $signalVolume := "" -}}
{{- range (get $clickhouse "additionalVolumes" | default list) -}}
{{- if eq (dig "persistentVolumeClaim" "claimName" "" .) $signalClaim -}}{{- $signalVolume = .name -}}{{- end -}}
{{- end -}}
{{- $signalMounted := false -}}
{{- range (get $clickhouse "additionalVolumeMounts" | default list) -}}
{{- if and $signalVolume (eq .name $signalVolume) (eq (trimSuffix "/" .mountPath) "/var/lib/clickhouse-signal-backup") (not .readOnly) -}}{{- $signalMounted = true -}}{{- end -}}
{{- end -}}
{{- $signalDisk := false -}}
{{- range $file := (get $clickhouse "files" | default dict) -}}
{{- if contains "<oriso_signal_backup>" (toString $file) -}}{{- $signalDisk = true -}}{{- end -}}
{{- end -}}
{{- if not (and $signalMounted $signalDisk) -}}
{{- fail (printf "signoz.orisoDataProtection.signalBackup needs signoz.clickhouse to mount claim %s writable at /var/lib/clickhouse-signal-backup/ and a files entry defining disk <oriso_signal_backup>" $signalClaim) -}}
{{- end -}}
{{- $defaultClaims = append $defaultClaims (printf "%s/%s" $chNamespace $signalClaim) -}}
{{- end -}}
{{- /* An explicit claims list names claims in the release namespace unless given as <namespace>/<claim>. */ -}}
{{- $claims := list -}}
{{- range $claim := get $dp "claims" | default $defaultClaims -}}
{{- $claims = append $claims (contains "/" $claim | ternary $claim (printf "%s/%s" $.Release.Namespace $claim)) -}}
{{- end -}}
{{- $image := required "signoz.orisoDataProtection.image is required" (get $dp "image") -}}
{{- $backup := get $dp "backup" | default dict -}}
{{- $pending := list -}}
{{- range $entry := $claims -}}
{{- $pvc := lookup "v1" "PersistentVolumeClaim" (index (splitList "/" $entry) 0) (index (splitList "/" $entry) 1) -}}
{{- $pvName := dig "spec" "volumeName" "" $pvc -}}
{{- if $pvName -}}
{{- $pv := lookup "v1" "PersistentVolume" "" $pvName -}}
{{- if ne (dig "spec" "persistentVolumeReclaimPolicy" "" $pv) "Retain" -}}
{{- $pending = append $pending $pvName -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # The claims whose volumes the retain hook keeps.
    oriso.org/retain-claims: {{ join "," $claims | quote }}
data:
  backup.py: |
    {{- .Files.Get "files/signoz/metadata_backup.py" | nindent 4 }}
  restore.py: |
    {{- .Files.Get "files/signoz/metadata_restore.py" | nindent 4 }}
{{- if $pending }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $retainName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-retain-%s" $name .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    resourceNames:
      {{- toYaml $pending | nindent 6 }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-retain-%s" $name .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-retain-%s" $name .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $retainName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $retainName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: {{ $retainName }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $retainName }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: retain
          image: {{ $image | quote }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, ssl, urllib.request
              sa = "/var/run/secrets/kubernetes.io/serviceaccount"
              ctx = ssl.create_default_context(cafile=f"{sa}/ca.crt")
              headers = {"Authorization": "Bearer " + open(f"{sa}/token").read(),
                         "Content-Type": "application/merge-patch+json"}
              for pv in os.environ["VOLUMES"].split():
                  url = f"https://kubernetes.default.svc/api/v1/persistentvolumes/{pv}"
                  body = json.dumps({"spec": {"persistentVolumeReclaimPolicy": "Retain"}}).encode()
                  req = urllib.request.Request(url, data=body, method="PATCH", headers=headers)
                  spec = json.load(urllib.request.urlopen(req, context=ctx, timeout=20))["spec"]
                  print(pv, spec["claimRef"]["name"], spec["persistentVolumeReclaimPolicy"])
          env:
            - name: VOLUMES
              value: {{ join " " $pending | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
{{- end }}
{{- if and (get $backup "enabled" | default false) $sqliteClaim }}
{{- /* A second pod can never mount a ReadWriteOncePod claim beside SigNoz, so the backup would stay Pending. */ -}}
{{- $sqliteModes := get $persistence "accessModes" | default list -}}
{{- if get $persistence "existingClaim" -}}
{{- $sqliteModes = dig "spec" "accessModes" $sqliteModes (lookup "v1" "PersistentVolumeClaim" .Release.Namespace $sqliteClaim) -}}
{{- end -}}
{{- if has "ReadWriteOncePod" $sqliteModes -}}
{{- fail "signoz.orisoDataProtection.backup needs the SQLite claim to allow a second pod: ReadWriteOncePod blocks it. Use ReadWriteOnce or set backup.enabled=false" -}}
{{- end -}}
{{- /* The backup claim uses the class of the SigNoz claim (global first, "-" = none, as in the
SigNoz chart), else the class the SQLite claim really has (an existingClaim may carry one without
any configured); a bound backup claim keeps its class, which Kubernetes does not allow to change. */ -}}
{{- $backupClass := get (get .Values "global" | default dict) "storageClass" | default (get $persistence "storageClass") | default "" -}}
{{- if not $backupClass -}}
{{- $sourceClaim := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $sqliteClaim -}}
{{- $backupClass = dig "spec" "storageClassName" "" $sourceClaim -}}
{{- end -}}
{{- $backupPVC := printf "%s-backup" $name -}}
{{- $existingBackup := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $backupPVC -}}
{{- if $existingBackup -}}
{{- /* Keep the field exactly: an explicit "" must stay "", an absent field stays absent. */ -}}
{{- $backupSpec := get $existingBackup "spec" | default dict -}}
{{- $backupClass = hasKey $backupSpec "storageClassName" | ternary (get $backupSpec "storageClassName" | default "-") "" -}}
{{- end -}}
{{- $destination := $backupPVC -}}
{{- $replacement := get $backup "replacementClaim" -}}
{{- if not (kindIs "string" $replacement) -}}
{{- fail "signoz.orisoDataProtection.backup.replacementClaim must be a string" -}}
{{- end -}}
{{- if $replacement -}}
{{- if not .Release.IsUpgrade -}}
{{- fail "signoz.orisoDataProtection.backup.replacementClaim requires an existing Helm release upgrade" -}}
{{- end -}}
{{- if or (gt (len $replacement) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $replacement)) -}}
{{- fail "signoz.orisoDataProtection.backup.replacementClaim must be a valid PVC name in the same namespace" -}}
{{- end -}}
{{- if or (eq $replacement $backupPVC) (has (printf "%s/%s" .Release.Namespace $replacement) $defaultClaims) -}}
{{- fail "signoz.orisoDataProtection.backup.replacementClaim must differ from the original backup and SigNoz data claims" -}}
{{- end -}}
{{- /* Keep the original claim under Helm ownership for recovery and rollback. A client-only render cannot verify it. */ -}}
{{- $annotations := dig "metadata" "annotations" dict $existingBackup -}}
{{- if or (dig "metadata" "deletionTimestamp" "" $existingBackup)
          (ne (get $annotations "helm.sh/resource-policy") "keep")
          (ne (get $annotations "meta.helm.sh/release-name") .Release.Name)
          (ne (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) -}}
{{- fail (printf "signoz.orisoDataProtection.backup.replacementClaim requires a cluster-connected Helm render and the existing Helm-owned backup PVC %s/%s with the keep policy" .Release.Namespace $backupPVC) -}}
{{- end -}}
{{- $target := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $replacement -}}
{{- $uid := dig "metadata" "uid" "" $target -}}
{{- $volumeName := dig "spec" "volumeName" "" $target -}}
{{- $modes := dig "spec" "accessModes" list $target -}}
{{- $writable := or (has "ReadWriteOnce" $modes) (has "ReadWriteOncePod" $modes) (has "ReadWriteMany" $modes) -}}
{{- if or (not $uid) (not $volumeName) (not $writable)
          (dig "metadata" "deletionTimestamp" "" $target)
          (ne (dig "status" "phase" "" $target) "Bound")
          (ne (dig "spec" "volumeMode" "Filesystem" $target) "Filesystem") -}}
{{- fail (printf "signoz.orisoDataProtection.backup.replacementClaim requires a Bound, writable Filesystem PVC at %s/%s" .Release.Namespace $replacement) -}}
{{- end -}}
{{- $volume := lookup "v1" "PersistentVolume" "" $volumeName -}}
{{- $ref := dig "spec" "claimRef" dict $volume -}}
{{- if or (dig "metadata" "deletionTimestamp" "" $volume)
          (ne (dig "status" "phase" "" $volume) "Bound")
          (ne (dig "spec" "persistentVolumeReclaimPolicy" "" $volume) "Retain")
          (ne (get $ref "namespace") .Release.Namespace)
          (ne (get $ref "name") $replacement)
          (ne (get $ref "uid") $uid) -}}
{{- fail (printf "signoz.orisoDataProtection.backup.replacementClaim requires a Bound Retain PV matching the replacement PVC %s/%s, including its UID" .Release.Namespace $replacement) -}}
{{- end -}}
{{- $destination = $replacement -}}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $backupPVC }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Uninstalling the release must not take the backups with it.
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ get $backup "size" | default "1Gi" }}
  {{- if eq $backupClass "-" }}
  storageClassName: ""
  {{- else if $backupClass }}
  storageClassName: {{ $backupClass | quote }}
  {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $cronName }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ get $backup "schedule" | default "30 2 * * *" | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: {{ $cronName }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: {{ get $signozValues "name" | default "signoz" }}
                      app.kubernetes.io/instance: {{ .Release.Name }}
                      # The pod that has ordinal 0's ReadWriteOnce claim attached.
                      statefulset.kubernetes.io/pod-name: {{ printf "%s-0" $signozSts }}
          {{- /* The affinity puts the pod on the SigNoz node, so it needs the taints SigNoz tolerates there. */}}
          {{- with get $signozValues "tolerations" }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Keep access to the backup destination. Share the source group
          # without applying fsGroup ownership changes to either claim.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            {{- with include "signoz.podSecurityContext" (dict "settings" $signozValues "global" .Values.global "externalDatabase" (dig "postgresql" "enabled" false $signoz)) | fromYaml }}
            {{- if hasKey . "fsGroup" }}
            supplementalGroups:
              - {{ get . "fsGroup" }}
            {{- end }}
            {{- end }}
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ $image | quote }}
              command: ["python3", "/scripts/backup.py"]
              terminationMessagePolicy: File
              env:
                - name: KEEP
                  value: {{ get $backup "keep" | default 14 | toString | quote }}
                - name: JOB_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: signoz-db
                  mountPath: /signoz
                - name: backup
                  mountPath: /backup
          volumes:
            - name: scripts
              configMap:
                name: {{ $name }}
            - name: signoz-db
              persistentVolumeClaim:
                claimName: {{ $sqliteClaim }}
            - name: backup
              persistentVolumeClaim:
                claimName: {{ $destination | quote }}
{{- end }}
{{- if $signalOn }}
{{- $signalName := printf "%s-signal-backup" ($name | trunc 38 | trimSuffix "-") -}}
{{- /* Same class rule as the ClickHouse data claim; a bound claim keeps the class it has. */ -}}
{{- $signalClass := get (get .Values "global" | default dict) "storageClass" | default (get $chPersistence "storageClass") | default "" -}}
{{- with lookup "v1" "PersistentVolumeClaim" $chNamespace $signalClaim }}
{{- $signalClass = hasKey .spec "storageClassName" | ternary (.spec.storageClassName | default "-") "" -}}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $signalClaim }}
  namespace: {{ $chNamespace }}
  annotations:
    # Uninstalling the release must not take the signal archives with it;
    # the retain hook also switches the bound volume to reclaim Retain.
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ get $signal "size" | default "10Gi" }}
  {{- if eq $signalClass "-" }}
  storageClassName: ""
  {{- else if $signalClass }}
  storageClassName: {{ $signalClass | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $signalName }}
  namespace: {{ $chNamespace }}
data:
  signal_backup.py: |
    {{- .Files.Get "files/signoz/signal_backup.py" | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $signalName }}
  namespace: {{ $chNamespace }}
type: Opaque
stringData:
  {{- /* Helm merges the ClickHouse chart's defaults into these values. */}}
  user: {{ get $clickhouse "user" | default "admin" | quote }}
  password: {{ get $clickhouse "password" | default "" | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $signalName }}
  namespace: {{ $chNamespace }}
spec:
  schedule: {{ get $signal "schedule" | default "15 3 * * *" | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A retry would write a second archive; the next night is the retry.
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: signoz-signal-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              # The claim is ReadWriteOnce and ClickHouse has it attached.
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    # clickhouse.selectorLabels of the vendored chart.
                    matchLabels:
                      app.kubernetes.io/name: {{ get $clickhouse "nameOverride" | default "clickhouse" | trunc 63 | trimSuffix "-" }}
                      app.kubernetes.io/instance: {{ .Release.Name }}
                      app.kubernetes.io/component: {{ get $clickhouse "name" | default "clickhouse" }}
          {{- with get $clickhouse "tolerations" }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # ClickHouse's UID/GID, which owns the archives this job verifies and prunes.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ $image | quote }}
              command: ["python3", "/scripts/signal_backup.py"]
              terminationMessagePolicy: File
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: KEEP
                  value: {{ get $signal "keep" | default 7 | toString | quote }}
                - name: CLICKHOUSE_URL
                  value: {{ printf "http://%s.%s.svc:8123/" $chName $chNamespace | quote }}
                - name: CLICKHOUSE_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ $signalName }}
                      key: user
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $signalName }}
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: backup
                  mountPath: /backup
          volumes:
            - name: scripts
              configMap:
                name: {{ $signalName }}
            - name: backup
              persistentVolumeClaim:
                claimName: {{ $signalClaim }}
{{- end }}
{{- end }}
