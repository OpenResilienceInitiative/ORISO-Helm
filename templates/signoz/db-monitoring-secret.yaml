{{- /*
Passwords of the read-only monitoring users the SigNoz cluster collector uses
for MariaDB, MongoDB and RabbitMQ (global.observability.dbMetrics). Generated
once and kept: an existing Secret's values are reused on every upgrade, and the
Secret survives an uninstall so a reinstall does not orphan the database users.
The users themselves are created and corrected by db-monitoring-reconcile-job.
*/ -}}
{{- if eq (include "oriso.dbMetrics.enabled" .) "true" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "oriso-db-monitoring" -}}
{{- $existingData := dict -}}
{{- if and $existing (hasKey $existing "data") -}}
{{- $existingData = $existing.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: oriso-db-monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: oriso-db-monitoring
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "mariadb-password" "mongodb-password" "rabbitmq-password" }}
  {{ $key }}: {{ index $existingData $key | default (randAlphaNum 40 | b64enc) | quote }}
  {{- end }}
{{- end -}}
