{{- $signoz := get .Values "signoz" | default dict -}}
{{- $clickhouse := get $signoz "clickhouse" | default dict -}}
{{- $clickhouseEnabled := true -}}
{{- if hasKey $clickhouse "enabled" -}}
{{- $clickhouseEnabled = get $clickhouse "enabled" -}}
{{- end -}}
{{- if and (get $signoz "enabled" | default false) $clickhouseEnabled -}}
{{- $operatorName := include "oriso.signozClickhouseOperatorFullname" . -}}
{{- $clusterRoleName := printf "%s-cluster-discovery" $operatorName | trunc 63 | trimSuffix "-" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    app.kubernetes.io/name: clickhouse-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  # The Altinity operator checks the CRD during reconciliation. A namespace
  # Role can never grant this cluster-scoped discovery permission.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # Informers discover CHI, template, and operator-configuration resources at
  # cluster scope. Mutation remains governed by the namespace Role rendered by
  # the dependency chart.
  - apiGroups: ["clickhouse.altinity.com"]
    resources:
      - clickhouseinstallations
      - clickhouseinstallationtemplates
      - clickhouseoperatorconfigurations
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    app.kubernetes.io/name: clickhouse-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oriso.signozClickhouseOperatorServiceAccountName" . }}
    namespace: {{ include "oriso.signozClickhouseNamespace" . }}
{{- end -}}
