{{- if .Values.signoz.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "signoz.clickhouse.fullname" . }}-retention
  namespace: {{ default .Release.Namespace .Values.signoz.namespace }}
  labels:
    {{- include "signoz.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-retention
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: clickhouse-retention
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: "{{ .Values.signoz.clickhouse.image.repository }}:{{ .Values.signoz.clickhouse.image.tag }}"
          imagePullPolicy: {{ .Values.signoz.clickhouse.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.signoz.clickhouse.secret.name }}
                  key: {{ .Values.signoz.clickhouse.secret.key }}
          command:
            - /bin/sh
            - -ec
            - |
              for table in \
                system.query_log \
                system.text_log \
                system.trace_log \
                system.metric_log \
                system.asynchronous_metric_log
              do
                clickhouse-client \
                  --host {{ include "signoz.clickhouse.host" . | quote }} \
                  --port {{ .Values.signoz.clickhouse.port }} \
                  --user {{ .Values.signoz.clickhouse.user | quote }} \
                  --password "$CLICKHOUSE_PASSWORD" \
                  --query "ALTER TABLE ${table} MODIFY TTL event_date + INTERVAL {{ .Values.signoz.clickhouse.internalLogs.retentionDays }} DAY DELETE"
              done
              # Existing parts age out through normal merges; the deployment
              # never forces a rewrite of tens of GiB.
{{- end }}
