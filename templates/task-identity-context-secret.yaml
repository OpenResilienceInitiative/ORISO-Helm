{{- $scenarioEnabled := dig "taskIdentities" "enabled" false .Values.global.keycloak -}}
{{- if $scenarioEnabled -}}
{{- $tenantCreationKey := .Values.global.secrets.taskIdentityTenantCreationContextKey | default "" | toString -}}
{{- $wizardPolicyKey := .Values.global.secrets.taskIdentityWizardPolicyContextKey | default "" | toString -}}
{{- range $pair := list (list "taskIdentityTenantCreationContextKey" $tenantCreationKey) (list "taskIdentityWizardPolicyContextKey" $wizardPolicyKey) -}}
{{- if not (regexMatch "^[A-Za-z0-9+/]{43}=$" (index $pair 1)) -}}
{{- fail (printf "global.secrets.%s must be a base64-encoded 32-byte key; generate it with openssl rand -base64 32" (index $pair 0)) -}}
{{- end -}}
{{- end -}}
{{- if eq $tenantCreationKey $wizardPolicyKey -}}
{{- fail "Task-identity tenant-creation and wizard-policy context keys must differ" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: task-identity-context-secrets
type: Opaque
data:
  ORISO_TENANT_CREATION_CONTEXT_KEY: {{ $tenantCreationKey | b64enc | quote }}
  ORISO_WIZARD_POLICY_CONTEXT_KEY: {{ $wizardPolicyKey | b64enc | quote }}
{{- end -}}
