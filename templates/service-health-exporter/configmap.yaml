{{- if and .Values.serviceHealthExporter.enabled (not .Values.signoz.enabled) }}
{{- fail "serviceHealthExporter.enabled requires signoz.enabled=true because its OTLP destination is the in-chart SigNoz collector" }}
{{- end }}
{{- if .Values.serviceHealthExporter.enabled }}
{{- $environment := default "pre-dev" (default .Values.serviceHealthExporter.environment (.Values.global.observability | default dict).environment) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-service-health-exporter
  namespace: {{ default .Release.Namespace .Values.serviceHealthExporter.namespace }}
  labels:
    app.kubernetes.io/name: service-health-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # SigNoz query/recording-rule contract. A 2xx response alone is not UP:
  # the actuator body must validate, while connection/timeout and validation
  # failures are DOWN. Query at twice the collection interval and group by
  # endpoint plus environment. Missing/stale required samples are DOWN.
  service-health-contract.yaml: |
    version: 1
    queryWindow: "2x collection_interval"
    groupBy:
      - http.url
      - deployment.environment
    up:
      requiresFresh:
        - "httpcheck.status == 1"
        - "httpcheck.validation.passed >= 1"
      requiresAbsent:
        - "httpcheck.error > 0"
        - "httpcheck.validation.failed > 0"
    down:
      anyFresh:
        - "httpcheck.status != 1"
        - "httpcheck.error > 0"
        - "httpcheck.validation.failed > 0"
      missingOrStale:
        - httpcheck.status
        - httpcheck.validation.passed
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      # Collector Contrib's HTTP Check receiver emits current non-monotonic
      # status and duration metrics. Response validation prevents a generic
      # HTTP 200 error page from being classified as a healthy actuator.
      http_check:
        collection_interval: {{ .Values.serviceHealthExporter.collectionInterval | quote }}
        initial_delay: {{ .Values.serviceHealthExporter.initialDelay | quote }}
        metrics:
          httpcheck.status:
            enabled: true
          httpcheck.error:
            enabled: true
          httpcheck.validation.passed:
            enabled: true
          httpcheck.validation.failed:
            enabled: true
          httpcheck.response.size:
            enabled: true
        targets:
          {{- range $name, $service := .Values.serviceHealthExporter.services }}
          - endpoint: "http://{{ $.Release.Name }}-{{ $name }}:{{ $service.port }}{{ $service.path }}"
            method: GET
            timeout: {{ $.Values.serviceHealthExporter.timeout | quote }}
            validations:
              - json_path: "$.status"
                equals: "UP"
          {{- end }}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 32
      resource/identity:
        attributes:
          - key: service.name
            value: service-health-exporter
            action: upsert
          - key: deployment.environment
            value: {{ $environment | quote }}
            action: upsert
      batch:
        timeout: 5s

    exporters:
      otlp:
        endpoint: "{{ .Release.Name }}-otel-collector:4317"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [http_check]
          processors: [memory_limiter, resource/identity, batch]
          exporters: [otlp]
{{- end }}
