{{- /*
Renders nothing (ORISO-Helm#540). Fails the install or upgrade while a
credential from secrets.yaml.default is still empty, a "changeme" placeholder
or too short, or while any other value still contains "changeme". Optional
secrets with their own checks (task identities, backend and SMTP sync clients)
are validated where they are used.
*/ -}}
{{- $secrets := .Values.global.secrets -}}
{{- range $key := list "liquibaseUser" "rabbitmqUsername" "caritasDbUsername" "keycloakDbUsername" "agencyServiceDbUsername" "consultingTypeServiceDbUsername" "consultingTypeMongoUser" "userServiceDbUsername" "uploadServiceDbUsername" "tenantServiceDbUsername" -}}
{{- include "oriso.requireCredential" (list (printf "global.secrets.%s" $key) (index $secrets $key) 0) -}}
{{- end -}}
{{- range $key := list "liquibasePassword" "rabbitmqPassword" "caritasDbPassword" "keycloakDbPassword" "agencyServiceDbPassword" "consultingTypeServiceDbPassword" "consultingTypeMongoPass" "userServiceDbPassword" "uploadServiceDbPassword" "tenantServiceDbPassword" "redisdefaultPass" "matrixRegistrationSharedSecret" "keycloakAdminPassword" -}}
{{- include "oriso.requireCredential" (list (printf "global.secrets.%s" $key) (index $secrets $key) 12) -}}
{{- end -}}
{{- include "oriso.requireCredential" (list "global.matrix.matrixAdminPassword" .Values.global.matrix.matrixAdminPassword 12) -}}
{{- include "oriso.requireCredential" (list "online-counseling-mariadb.dbRootPassword" (index .Values "online-counseling-mariadb" "dbRootPassword") 12) -}}
{{- include "oriso.requireCredential" (list "online-counseling-mongodb.mongoInitDbRootPassword" (index .Values "online-counseling-mongodb" "mongoInitDbRootPassword") 12) -}}
{{- /* No value anywhere, used or not, may keep the placeholder. */ -}}
{{- include "oriso.rejectPlaceholderValues" (list "" .Values) -}}
