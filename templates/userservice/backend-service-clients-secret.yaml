apiVersion: v1
kind: Secret
metadata:
  name: keycloak-backend-client-secrets
type: Opaque
data:
  # Independent confidential service clients; human password/OTP stays on app.
  {{- $technicalSecret := .Values.global.secrets.keycloakBackendTechnicalClientSecret | default "" | toString }}
  {{- $adminSecret := .Values.global.secrets.keycloakBackendAdminClientSecret | default "" | toString }}
  {{- $scenario := .Values.global.keycloak.taskIdentities | default dict }}
  {{- $scenarioEnabled := dig "enabled" false $scenario }}
  {{- $scenarioProvisionOnly := dig "provisionOnly" false $scenario }}
  {{- range $pair := list (list "keycloakBackendTechnicalClientSecret" $technicalSecret) (list "keycloakBackendAdminClientSecret" $adminSecret) }}
  {{- if or (lt (len (index $pair 1)) 32) (not (regexMatch "^[[:print:]]+$" (index $pair 1))) }}
  {{- fail (printf "global.secrets.%s must be an independent persistent secret of at least 32 printable characters" (index $pair 0)) }}
  {{- end }}
  {{- end }}
  {{- if eq $technicalSecret $adminSecret }}
  {{- fail "Backend technical and admin client secrets must differ" }}
  {{- end }}
  KEYCLOAK_BACKEND_TECHNICAL_CLIENT_SECRET: {{ $technicalSecret | b64enc | quote }}
  KEYCLOAK_BACKEND_ADMIN_CLIENT_SECRET: {{ $adminSecret | b64enc | quote }}
  {{- if or $scenarioEnabled $scenarioProvisionOnly }}
  {{- $setupSecret := .Values.global.secrets.keycloakTaskIdentitySetupClientSecret | default "" | toString }}
  {{- $accountCreateSecret := .Values.global.secrets.keycloakTaskIdentityAccountCreateClientSecret | default "" | toString }}
  {{- $accountAdminSecret := .Values.global.secrets.keycloakTaskIdentityAccountAdminClientSecret | default "" | toString }}
  {{- $mailSecret := .Values.global.secrets.keycloakTaskIdentityMailClientSecret | default "" | toString }}
  {{- $runtimeSecret := .Values.global.secrets.keycloakTaskIdentityRuntimeClientSecret | default "" | toString }}
  {{- $scenarioSecrets := list $setupSecret $accountCreateSecret $accountAdminSecret $mailSecret $runtimeSecret }}
  {{- if ne (len (uniq $scenarioSecrets)) 5 }}
  {{- fail "Task identities require five distinct client secrets" }}
  {{- end }}
  {{- range $secret := $scenarioSecrets }}
  {{- if or (lt (len $secret) 32) (not (regexMatch "^[[:print:]]+$" $secret)) }}
  {{- fail "Task-identity client secrets must be independent persistent secrets of at least 32 printable characters" }}
  {{- end }}
  {{- end }}
  IDENTITY_SETUP_CLIENT_SECRET: {{ $setupSecret | b64enc | quote }}
  IDENTITY_ACCOUNT_CREATE_CLIENT_SECRET: {{ $accountCreateSecret | b64enc | quote }}
  IDENTITY_ACCOUNT_ADMIN_CLIENT_SECRET: {{ $accountAdminSecret | b64enc | quote }}
  IDENTITY_MAIL_CLIENT_SECRET: {{ $mailSecret | b64enc | quote }}
  IDENTITY_RUNTIME_CLIENT_SECRET: {{ $runtimeSecret | b64enc | quote }}
  {{- end }}
