apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: userservice-configmap-env
  name: userservice-configmap-env
data:
  # General
  # Public origins embedded in outgoing mails (DPA signing, system/supervisor
  # notifications, inactivity notices) and the app base URL. All derive from the
  # validated global.domainName so the service never needs a URL fallback of its
  # own (ORISO-Helm#366).
  {{- $origin := include "oriso.publicOrigin" . }}
  APP_BASE_URL: {{ $origin | quote }}
  DPA_SIGN_FRONTEND_BASE_URL: {{ $origin | quote }}
  SYSTEM_NOTIFICATION_FRONTEND_BASE_URL: {{ $origin | quote }}
  INACTIVE_ACCOUNT_NOTIFICATION_APP_BASE_URL: {{ $origin | quote }}
  # Platform-level email branding (used when a mail has no tenant context).
  EMAIL_BRANDING_NAME: {{ .Values.userService.emailBrandingName | quote }}
  {{- if .Values.userService.emailBrandingLogoUrl }}
  EMAIL_BRANDING_LOGO_URL: {{ .Values.userService.emailBrandingLogoUrl | quote }}
  {{- end }}
  STATISTICS_ENABLED: {{ .Values.global.statisticsEnabled | quote }}
  SPRING_LIQUIBASE_ENABLED: {{ .Values.global.enableLiquibase | quote }}
  CONSULTANT_IMPORT_FILENAME: {{ .Values.userService.consultantImportFilename }}
  CONSULTANT_IMPORT_PROTOCOL_FILENAME: {{ .Values.userService.consultantImportProtocolFilename }}
  ASKER_IMPORT_FILENAME: {{ .Values.userService.askerImportFilename }}
  ASKER_IMPORT_WITHOUTSESSION_FILENAME: {{ .Values.userService.askerImportWithoutSessionFilename }}
  ASKER_IMPORT_PROTOCOL_FILENAME: {{ .Values.userService.askerImportProtocolFilename }}
  ASKER_IMPORT_WELCOME_MESSAGE_FILENAME: {{ .Values.userService.askerImportWelcomeMessageFilename }}
  ASKER_IMPORT_WELCOME_MESSAGE_FILENAME_REPLACE_VALUE: "[ConsultingType]"
  # Spring/Database
  SPRING_PROFILES_ACTIVE: {{ .Values.userService.springProfilesActive }}
  SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb.{{ .Release.Namespace }}:3306/userservice"
  # Keycloak
  IDENTITY_OPENID_CONNECT_URL: {{ .Values.global.keycloak.authServerUrl }}{{ .Values.global.keycloak.openidConnectUrl }}
  KEYCLOAKAPI_LOGIN: {{ .Values.global.keycloak.authServerUrl }}{{ .Values.global.keycloak.openidConnectUrl }}{{ .Values.global.keycloak.loginSuffix }}
  KEYCLOAKAPI_LOGOUT: {{ .Values.global.keycloak.authServerUrl }}{{ .Values.global.keycloak.openidConnectUrl }}{{ .Values.global.keycloak.logoutSuffix }}
  IDENTITY_OTP_URL: {{ .Values.global.keycloak.authServerUrl }}{{ .Values.global.keycloak.otpUrl }}
  KEYCLOAK_AUTH_SERVER_URL: {{ .Values.global.keycloak.authServerUrl }}
  KEYCLOAK_REALM: {{ .Values.global.keycloak.realm }}
  KEYCLOAK_PRINCIPAL_ATTRIBUTE: {{ .Values.global.keycloak.principalAttribute }}
  KEYCLOAK_RESOURCE: {{ .Values.userService.keycloakResource }}
  KEYCLOAK_CORS: "false"
  KEYCLOAK_CONFIG_ADMIN_CLIENTID: {{ .Values.global.keycloak.serviceAdminClientId }}
  KEYCLOAK_CONFIG_APP_CLIENTID: {{ .Values.global.keycloak.serviceAppClientId }}
  KEYCLOAKSERVICE_TECHUSER_ID: {{ .Values.global.keycloak.serviceTechUserId }}
  SESSION_INACTIVE_DELETEWORKFLOW_ENABLED: "false"

  # Services
  AGENCY_SERVICE_API_URL: "https://{{ .Values.global.domainName }}/service"
  AGENCY_ADMIN_SERVICE_API_URL: "http://agencyservice.{{ .Release.Namespace }}:8080"
  MESSAGE_SERVICE_API_URL: "http://messageservice.{{ .Release.Namespace }}:8080"
  MAIL_SERVICE_API_URL: "http://mailservice.{{ .Release.Namespace }}:8080"
  CONSULTING_TYPE_SERVICE_API_URL: "http://consultingtypeservice.{{ .Release.Namespace }}:8080"
  APPOINTMENT_SERVICE_API_URL: "http://appointmentservice.{{ .Release.Namespace }}:8080"
  # Mail-link base URLs (Magic Link, password reset, account invite). Always
  # rendered: an explicit userService.* value wins and is validated, an empty
  # one derives from global.domainName. UserService appends the route itself
  # ("/password-reset/confirm?token=…", "/admin/tenant-onboarding/{token}",
  # "/account-invite/{token}"), so the admin reset base carries the /admin
  # prefix while the admin invite base is a bare origin.
  MAGIC_LINK_FRONTEND_BASE_URL: {{ include "oriso.publicUrl" (list "userService.magicLinkFrontendBaseUrl" .Values.userService.magicLinkFrontendBaseUrl $origin) | quote }}
  PASSWORD_RESET_FRONTEND_BASE_URL: {{ include "oriso.publicUrl" (list "userService.passwordResetFrontendBaseUrl" .Values.userService.passwordResetFrontendBaseUrl $origin) | quote }}
  PASSWORD_RESET_ADMIN_FRONTEND_BASE_URL: {{ include "oriso.publicUrl" (list "userService.passwordResetAdminFrontendBaseUrl" .Values.userService.passwordResetAdminFrontendBaseUrl (printf "%s/admin" $origin)) | quote }}
  ACCOUNT_INVITE_APP_FRONTEND_BASE_URL: {{ include "oriso.publicUrl" (list "userService.accountInviteAppFrontendBaseUrl" .Values.userService.accountInviteAppFrontendBaseUrl $origin) | quote }}
  ACCOUNT_INVITE_ADMIN_FRONTEND_BASE_URL: {{ include "oriso.publicUrl" (list "userService.accountInviteAdminFrontendBaseUrl" .Values.userService.accountInviteAdminFrontendBaseUrl $origin) | quote }}
  # SMTP transport for the Magic Link and password-reset mails. UserService
  # sends these itself over SMTP; the credentials live in userservice-secret
  # because the platform-settings copy is only readable with a super-admin
  # token, which the unauthenticated reset flow never has.
  SMTP_HOST: {{ .Values.userService.smtpHost | default "" | quote }}
  SMTP_PORT: {{ .Values.userService.smtpPort | default 587 | quote }}
  SMTP_SECURE: {{ .Values.userService.smtpSecure | default false | quote }}
  SMTP_FROM: {{ .Values.userService.smtpFrom | default "" | quote }}
  # CSRF
  CSRF_HEADER_PROPERTY: {{ .Values.global.csrfHeaderProperty}}
  CSRF_WHITELIST_HEADER_PROPERTY: {{ .Values.global.csrfWhitelistHeaderProperty}}
  CSRF_COOKIE_PROPERTY: {{ .Values.global.csrfCookieProperty}}
  # Logging
  #LOGGING_LEVEL_ROOT: "DEBUG"
  # Firebase credential configuration file path
  FIREBASE_CONFIGURATION_PUSH_NOTIFICATIONS_ENABLED: "false"
  FIREBASE_CONFIGURATION_CREDENTIALS_FILE_PATH: {{ .Values.userService.firebaseConfigurationCredentialsFilePath }}
  FIREBASE_CONFIGURATION_NOTIFICATION_MESSAGE: {{ .Values.userService.firebaseConfigurationNotificationMessage }}
  REGISTRATION_CORS_ALLOWED_ORIGINS: ""
  USER_ANONYMOUS_DELETEWORKFLOW_CRON: "0 0 * * * ?"
  ## Period of time before anonymous data will be deleted in minutes
  ## 2820 minutes = 47 hours
  USER_ANONYMOUS_DELETEWORKFLOW_PERIODMINUTES: "2820"
  USER_ANONYMOUS_DEACTIVATEWORKFLOW_CRON: "0 0 * * * ?"
  SESSION_INACTIVE_DELETEWORKFLOW_ENABLED: {{ .Values.userService.sessionInactiveDeleteWorkflowEnabled | quote }}
  SESSION_INACTIVE_DELETEWORKFLOW_CRON: {{ .Values.userService.sessionInactiveDeleteWorkflowCron }}
  SESSION_INACTIVE_DELETEWORKFLOW_CHECK_DAYS: {{ .Values.userService.sessionInactiveDeleteWorkflowCheckDays | quote }}
  ## Period of time before anonymous data will be deleted in minutes
  ## 360 minutes = 6 hours
  USER_ANONYMOUS_DEACTIVATEWORKFLOW_PERIODMINUTES: "360"
  MAIL_SERVICE_API_MAILS_SEND: "http://mailservice.{{ .Release.Namespace }}:8080/mails/send"
  MULTITENANCY_ENABLED: {{ .Values.global.multitenancyEnabled | quote }}
  FEATURE_TOPICS_ENABLED: {{ .Values.global.topicsEnabled | quote }}
  FEATURE_DEMOGRAPHICS_ENABLED: {{ .Values.global.demographicsEnabled | quote }}
  TENANT_SERVICE_API_URL: "http://tenantservice.{{ .Release.Namespace }}:8081"
  # 2fa — value-driven so the OTP posture can differ per environment (dev vs
  # prod overlay). Defaults preserve the previous hardcoded "false" behaviour.
  # NOTE: this is 2FA/OTP login posture only; it is NOT encryption. Encryption
  # is never toggled here — see docs/infrastructure-report-2026-07.md §7.
  TWOFACTORAUTH_USER_ENABLED: {{ .Values.userService.otpAllowedForUsers | default "false" | quote }}
  TWOFACTORAUTH_CONSULTANT_ENABLED: {{ .Values.userService.otpAllowedForConsultants | default "false" | quote }}
  IDENTITY_OTP_ALLOWED_FOR_USERS: {{ .Values.userService.otpAllowedForUsers | default "false" | quote }}
  IDENTITY_OTP_ALLOWED_FOR_CONSULTANTS: {{ .Values.userService.otpAllowedForConsultants | default "false" | quote }}
  IDENTITY_OTP_ALLOWED_FOR_SINGLE_TENANT_ADMINS: {{ .Values.userService.otpAllowedForSingleTenantAdmins | default "false" | quote }}
  IDENTITY_OTP_ALLOWED_FOR_TENANT_SUPER_ADMINS: {{ .Values.userService.otpAllowedForTenantSuperAdmins | default "false" | quote }}
  IDENTITY_OTP_ALLOWED_FOR_RESTRICTED_AGENCY_ADMINS: {{ .Values.userService.otpAllowedForRestrictedAgencyAdmins | default "false" | quote }}
  # logstash
  LOGSTASH_HOST: {{ .Values.global.logstashHost }}
  FEATURE_APPOINTMENT_ENABLED: "false"
  FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED: {{ .Values.global.multitenancyWithSingleDomainEnabled | quote }}
  SPRING_RABBITMQ_HOST: {{ .Values.userService.springRabbitmqHost | required "userService.springRabbitmqHost is required" | quote }}
  SPRING_RABBITMQ_PORT: {{ .Values.userService.springRabbitmqPort | required "userService.springRabbitmqPort is required" | quote }}
  # Shared consultant availability lease store. The password remains in the
  # existing redis-secret and is referenced directly by the Deployment.
  SPRING_REDIS_HOST: {{ .Values.userService.redisHost | default "redis" | quote }}
  SPRING_REDIS_PORT: {{ .Values.userService.redisPort | default 6379 | quote }}
  SPRING_DATA_REDIS_HOST: {{ .Values.userService.redisHost | default "redis" | quote }}
  SPRING_DATA_REDIS_PORT: {{ .Values.userService.redisPort | default 6379 | quote }}
  CONSULTANT_AVAILABILITY_REDIS_TTL_SECONDS: {{ .Values.userService.consultantAvailabilityRedisTtlSeconds | default 120 | quote }}
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: "always"
  MATRIX_API_URL: {{ .Values.matrix.matrixApiUrl }}
  MATRIX_SERVER_NAME: {{ .Values.matrix.matrixServerName }}
  MATRIX_ENCRYPTION_ENABLED: {{ .Values.userService.matrixEncryptionEnabled | default "true" | quote }}
  MATRIX_MIGRATION_ENABLED: "true"
  # ADR-018 Global Support Access. The flag gates only NEW handshakes: the revocation worker, the
  # four-hour expiry sweep and the audit retention job keep running when it is off, so switching the
  # feature off can never strand a session that is still granting access.
  SUPPORT_ACCESS_ENABLED: {{ .Values.userService.supportAccess.enabled | default "false" | quote }}
  SUPPORT_ACCESS_HANDSHAKE_TTL_SECONDS: {{ .Values.userService.supportAccess.handshakeTtlSeconds | default 300 | quote }}
  SUPPORT_ACCESS_SESSION_TTL_HOURS: {{ .Values.userService.supportAccess.sessionTtlHours | default 4 | quote }}
  SUPPORT_ACCESS_AUDIT_RETENTION_MONTHS: {{ .Values.userService.supportAccess.auditRetentionMonths | default 12 | quote }}
  # ADR-016 addendum (2026-09-05) / KDG #1116. Days after archiving until an ARCHIVED team
  # discussion's room, row and participants are purged (OPEN discussions are never purged).
  # 0 or less switches the job off. Off unless a value is set explicitly: the 90-day DPIA figure
  # is pending data protection officer sign-off, so the chart never enables deletion on its own.
  # hasKey instead of `default`: Helm treats 0 as empty, which would drop an explicit "off".
  TEAM_DISCUSSION_ARCHIVE_RETENTION_DAYS: {{ if hasKey (.Values.userService.teamDiscussion | default dict) "archiveRetentionDays" }}{{ .Values.userService.teamDiscussion.archiveRetentionDays | quote }}{{ else }}"0"{{ end }}
  # #874 self-help appointment sender stays off until its dependent services are deployed.
  GROUP_APPOINTMENT_MAIL_ENABLED: {{ .Values.userService.groupAppointmentMail.enabled | quote }}
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "{{ .Values.global.keycloak.authServerUrl }}/realms/{{ .Values.global.keycloak.realm }}"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "{{ .Values.global.keycloak.authServerUrl }}{{ .Values.global.keycloak.openidConnectUrl }}/certs"
  # OBS-P2: OTLP traces/metrics to the SigNoz gateway collector. Property
  # names + full /v1/{traces,metrics} paths verified against Spring Boot
  # 4.0.1 source directly (management.otlp.tracing.endpoint does NOT exist
  # in this version).
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://{{ include "oriso.otlpCollectorHost" . }}/v1/traces"
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: {{ include "oriso.observabilityEnabled" . | quote }}
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://{{ include "oriso.otlpCollectorHost" . }}/v1/metrics"
  MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: {{ include "oriso.observabilityEnabled" . | quote }}
