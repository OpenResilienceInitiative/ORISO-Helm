apiVersion: v1
kind: Secret
metadata:
  name: userservice-secret
type: Opaque
data:
  SERVICE_ENCRYPTION_APPKEY: {{ required "userService.serviceEncryptionAppkey must be supplied from persistent secret values" .Values.userService.serviceEncryptionAppkey | b64enc | quote }}
  STATISTICS_MESSAGE_COUNT_HMAC_SECRET: {{ required "userService.statisticsMessageCountHmacSecret must be supplied from persistent secret values" .Values.userService.statisticsMessageCountHmacSecret | b64enc | quote }}
  MATRIXRTC_CALL_POLICY_HMAC_SECRET: {{ required "userService.matrixRtcCallPolicyHmacSecret must be supplied from persistent secret values" .Values.userService.matrixRtcCallPolicyHmacSecret | b64enc | quote }}
  SPRING_LIQUIBASE_USER: {{ .Values.global.secrets.liquibaseUser | b64enc | quote }}
  SPRING_LIQUIBASE_USERNAME: {{ .Values.global.secrets.liquibaseUser | b64enc | quote }}
  SPRING_LIQUIBASE_PASSWORD: {{ .Values.global.secrets.liquibasePassword | b64enc | quote }}
  SPRING_RABBITMQ_USERNAME: {{ .Values.global.secrets.rabbitmqUsername | b64enc | quote }}
  SPRING_RABBITMQ_PASSWORD: {{ .Values.global.secrets.rabbitmqPassword | b64enc | quote }}
  USERSERVICE_SPRING_DATASOURCE_USERNAME: {{ .Values.global.secrets.userServiceDbUsername | b64enc | quote }}
  USERSERVICE_SPRING_DATASOURCE_PASSWORD: {{ .Values.global.secrets.userServiceDbPassword | b64enc | quote }}
  KEYCLOAK_CONFIG_ADMIN_USERNAME: {{ .Values.global.secrets.keycloakAdminUsername | b64enc | quote }} 
  KEYCLOAK_CONFIG_ADMIN_PASSWORD: {{ .Values.global.secrets.keycloakAdminPassword | b64enc | quote }} 
  KEYCLOAKSERVICE_TECHNICAL_USERNAME: {{ .Values.userService.keycloakTechnicalUsername | b64enc | quote }}
  KEYCLOAKSERVICE_TECHNICAL_PASSWORD: {{ .Values.userService.keycloakTechnicalPassword | b64enc | quote }}
  IDENTITY_TECHNICAL_USER_USERNAME: {{ .Values.userService.identityTechnicalUserUsername | b64enc | quote }}
  IDENTITY_TECHNICAL_USER_PASSWORD: {{ .Values.userService.identityTechnicalUserPassword | b64enc | quote }}
  {{- $serviceAdminUsername := .Values.global.secrets.keycloakServiceAdminUsername | default "" }}
  {{- $serviceAdminPassword := .Values.global.secrets.keycloakServiceAdminPassword | default "" }}
  {{- if or $serviceAdminUsername $serviceAdminPassword }}
  # Backend Keycloak admin identity (ORISO-Helm#367). Read only by the
  # keycloak-reconcile-service-identities hook for now; not mounted into the pod.
  KEYCLOAK_SERVICE_ADMIN_USERNAME: {{ required "global.secrets.keycloakServiceAdminUsername must be set together with keycloakServiceAdminPassword" $serviceAdminUsername | b64enc | quote }}
  KEYCLOAK_SERVICE_ADMIN_PASSWORD: {{ required "global.secrets.keycloakServiceAdminPassword must be set together with keycloakServiceAdminUsername" $serviceAdminPassword | b64enc | quote }}
  {{- end }}
  # Password reset and sign-in links require platform SMTP in every installation.
  {{- if or (empty .Values.userService.smtpUser) (empty .Values.userService.smtpPassword) }}
  {{- fail "userService.smtpUser/smtpPassword are required for platform mail; supply both from persistent secret values (runbooks/password-reset-runtime-config.md)" }}
  {{- end }}
  SMTP_USER: {{ .Values.userService.smtpUser | b64enc | quote }}
  SMTP_PASSWORD: {{ .Values.userService.smtpPassword | b64enc | quote }}
  MATRIX_REGISTRATION_SHARED_SECRET: {{.Values.global.secrets.matrixRegistrationSharedSecret | b64enc | quote }}
  MATRIX_ADMIN_USERNAME: {{ .Values.global.matrix.matrixAdminUsername | b64enc | quote }}
  MATRIX_ADMIN_PASSWORD: {{ .Values.global.matrix.matrixAdminPassword | b64enc | quote }}
