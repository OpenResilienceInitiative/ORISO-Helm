apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-reconcile-smtp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  # Drain the bounded old process completely before starting a replacement.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-reconcile-smtp
  template:
    metadata:
      labels:
        app: keycloak-reconcile-smtp
      annotations:
        checksum/script: {{ .Files.Get "files/keycloak-reconcile-smtp.py" | sha256sum | quote }}
    spec:
      {{- include "oriso.keycloakSmtpReconcilePod" (dict "root" . "mode" "serve") | nindent 6 }}
