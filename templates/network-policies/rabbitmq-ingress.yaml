{{- $policies := get .Values "networkPolicies" | default dict -}}
{{- $config := get $policies "rabbitmqIngress" | default dict -}}
{{- $enabled := dig "enabled" false $config -}}
{{- if not (kindIs "bool" $enabled) -}}
{{- fail "networkPolicies.rabbitmqIngress.enabled must be a boolean" -}}
{{- end -}}
{{- if $enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "userservice" "tenantservice" }}
        - podSelector:
            matchLabels:
              app: {{ . }}
        {{- end }}
        {{- if (.Values.addonService).enabled }}
        - podSelector:
            matchLabels:
              app: addonservice
        {{- end }}
      ports:
        - protocol: TCP
          port: 5672
    {{- if eq (include "oriso.dbMetrics.enabled" .) "true" }}
    - from:
        - podSelector:
            matchLabels:
              app: db-monitoring-reconcile
        - podSelector:
            matchLabels:
              {{- include "oriso.signozCollector.selectorLabels" (dict "root" . "component" "otel-deployment") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 15672
    {{- end }}
{{- end }}
