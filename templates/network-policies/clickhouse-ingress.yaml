{{- $policies := get .Values "networkPolicies" | default dict -}}
{{- $config := get $policies "clickhouseIngress" | default dict -}}
{{- $enabled := dig "enabled" false $config -}}
{{- if not (kindIs "bool" $enabled) -}}
{{- fail "networkPolicies.clickhouseIngress.enabled must be a boolean" -}}
{{- end -}}
{{- if and $enabled .Values.signoz.enabled .Values.signoz.clickhouse.enabled }}
{{- $signoz := .Subcharts.signoz }}
{{- $clickhouse := $signoz.Subcharts.clickhouse }}
{{- if ne (include "clickhouse.namespace" $clickhouse) .Release.Namespace }}
{{- fail "networkPolicies.clickhouseIngress requires ClickHouse and SigNoz in the release namespace" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "clickhouse.fullname" $clickhouse }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "clickhouse.selectorLabels" $clickhouse | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "signoz.selectorLabels" "otelCollector.selectorLabels" "telemetryStoreMigrator.selectorLabels" }}
        - podSelector:
            matchLabels:
              {{- include . $signoz | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: client
    - from:
        - podSelector:
            matchLabels:
              {{- include "clickhouseOperator.selectorLabels" $clickhouse | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
    - from:
        - podSelector:
            matchLabels:
              {{- include "clickhouse.selectorLabels" $clickhouse | nindent 14 }}
      ports:
        - protocol: TCP
          port: client
        - protocol: TCP
          port: interserver
        {{- if and $clickhouse.Values.initContainers.enabled $clickhouse.Values.initContainers.init.enabled }}
        - protocol: TCP
          port: http
        {{- end }}
    {{- if and (dig "orisoDataProtection" "enabled" false .Values.signoz) (dig "orisoDataProtection" "signalBackup" "enabled" false .Values.signoz) }}
    # The native signal backup CronJob (templates/signoz/signoz-data-protection.yaml).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: signoz-signal-backup
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: http
    {{- end }}
{{- end }}
