{{- $policies := get .Values "networkPolicies" | default dict -}}
{{- $config := get $policies "mongodbIngress" | default dict -}}
{{- $enabled := dig "enabled" false $config -}}
{{- if not (kindIs "bool" $enabled) -}}
{{- fail "networkPolicies.mongodbIngress.enabled must be a boolean" -}}
{{- end -}}
{{- if $enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agencyservice
        - podSelector:
            matchLabels:
              app: consultingtypeservice
        - podSelector:
            matchLabels:
              app: create-mongo-users
        {{- if eq (include "oriso.dbMetrics.enabled" .) "true" }}
        - podSelector:
            matchLabels:
              app: db-monitoring-reconcile
        - podSelector:
            matchLabels:
              {{- include "oriso.signozCollector.selectorLabels" (dict "root" . "component" "otel-deployment") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 27017
{{- end }}
