{{- if .Values.nginxController.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
data:
  # Helm#536: snippets let anyone who can write an Ingress run nginx config in
  # the controller (its TLS keys, its Secret access, every host's traffic).
  # Every chart route uses annotations instead; all of them are rated High or lower.
  allow-snippet-annotations: "false"
  annotations-risk-level: "High"
  # Rate-limited routes answer 429 instead of nginx's default 503.
  limit-req-status-code: "429"
  # custom-headers ConfigMaps (permissions-policy-headers.yaml) may only set these.
  global-allowed-response-headers: "Permissions-Policy"
  hsts: "true"
  hsts-max-age: "31536000"
  hsts-include-subdomains: "true"
  hsts-preload: "false"
  # KDG epic #282 task 7: the ingress-nginx default upstream log format logs
  # $remote_addr (client IP) and $request, which embeds the full request URI
  # including the query string — magic-link / password-reset tokens travel as
  # GET parameters and would otherwise land in this log unmasked. This format
  # drops the client IP entirely and logs $uri instead of $request so no query
  # string (and therefore no token) is ever written. How long the resulting
  # log lines are retained (D7) is a separate operator decision, still open.
  log-format-upstream: '[$time_local] "$request_method $uri $server_protocol"
    $status $body_bytes_sent $request_time [$proxy_upstream_name] $upstream_status
    $req_id'
{{- if (.Values.ipAnonymizer).enabled }}
  # IP anonymization: every request is checked by ip-anonymizer, which returns
  # X-Anon-Id (a session-scoped UUID). The proxy-headers ConfigMap then replaces
  # X-Real-IP and X-Forwarded-For with that UUID before the request reaches any
  # backend service, so no ORISO component ever sees a real client IP.
  global-auth-url: "http://ip-anonymizer.{{ .Release.Namespace }}.svc.cluster.local:8080/auth"
  global-auth-response-headers: "X-Anon-Id"
  proxy-set-headers: "{{ .Release.Namespace }}/nginx-ip-anonymizer-headers"
{{- end }}
{{- end }}
