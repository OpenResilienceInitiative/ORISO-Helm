{{- if .Values.nginxController.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      appProtocol: http
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
      appProtocol: https
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/name: ingress-nginx
  type: LoadBalancer
  sessionAffinity: None
  # Preserve source addresses for per-client limits. The load balancer must use
  # the Service healthCheckNodePort so only nodes with controller endpoints receive traffic.
  externalTrafficPolicy: Local
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  allocateLoadBalancerNodePorts: true
  internalTrafficPolicy: Cluster
{{- end }}
