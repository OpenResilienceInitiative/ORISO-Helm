{{- /*
Per-client-IP limit on the public Matrix login path.

rc_login is raised in Synapse because UserService logs all browsers in from one
internal address. That traffic does not pass this ingress, so public clients
stay limited here. Its own Ingress, so the rest of /_matrix keeps its behaviour.
See matrix.loginRateLimit in values.yaml.default.
*/ -}}
{{- $limit := .Values.matrix.loginRateLimit | default dict }}
{{- if dig "enabled" true $limit }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/limit-rpm: {{ dig "requestsPerMinute" 6 $limit | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ dig "burstMultiplier" 2 $limit | quote }}
    # Keep 429 local to this ingress; the controller already permits snippets.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req_status 429;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
  name: matrix-login-rate-limit-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - backend:
          service:
            name: matrix-synapse
            port:
              number: 8008
        # Every client API version, including the legacy api/v1, also with a
        # trailing slash or ;parameter.
        path: /_matrix/client/(api/v1|[^/]+)/login/?(;.*)?$
        pathType: ImplementationSpecific
{{- end }}
