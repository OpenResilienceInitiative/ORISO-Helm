apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/limit-rps: {{ dig "publicEntryRateLimit" "requestsPerSecond" 5 .Values.userService | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ dig "publicEntryRateLimit" "burstMultiplier" 2 .Values.userService | quote }}
    # Keep 429 local to this ingress; the controller already permits snippets.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      limit_req_status 429;
    nginx.ingress.kubernetes.io/cors-allow-headers: Authorization, Content-Type, Cache-Control, Pragma, Expires, X-CSRF-Token, x-csrf-token, X-Requested-With, X-WHITELIST-HEADER, acceptlanguage, accept-language, x-tenant-id, X-Tenant-Id, agencyId
    nginx.ingress.kubernetes.io/cors-allow-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
  name: userservice-public-entry-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - backend:
          service:
            name: userservice
            port:
              number: 8080
        # ingress-nginx orders regex locations by descending path-string length.
        # Keep this combined anchored expression longer than the legacy rewrite route.
        path: /service/(users/identity-suggestions|users/invitelinks/[^/]+/context)$
        pathType: ImplementationSpecific
