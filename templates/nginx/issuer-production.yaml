{{- if index .Values "cert-manager" "enabled" }}
{{- $email := index .Values "cert-manager" "acmeEmail" | default "" | toString | trim }}
{{- if not (regexMatch `^[^@\s]+@[^@\s]+\.[^@\s]+$` $email) }}
{{- fail "cert-manager.acmeEmail must be the Let's Encrypt contact address (a role mailbox) when cert-manager.enabled is true" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ $email | quote }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
{{- end }}
