apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    {{- include "oriso.accountInactivity.authAnnotations" . | nindent 4 }}
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /tenantadmin/$1
    nginx.ingress.kubernetes.io/use-regex: 'true'
  name: tenantservice-tenantadmin-subpath-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - backend:
          service:
            name: tenantservice
            port:
              number: 8081
        path: /service/tenantadmin/(.+)
        pathType: ImplementationSpecific
