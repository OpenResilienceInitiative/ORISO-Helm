apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    {{- include "oriso.accountInactivity.authAnnotations" . | nindent 4 }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1$2$3
    nginx.ingress.kubernetes.io/cors-allow-headers: Authorization, Content-Type, Cache-Control, Pragma, Expires, X-CSRF-Token, x-csrf-token, X-Requested-With, X-WHITELIST-HEADER, acceptlanguage, accept-language, x-tenant-id, X-Tenant-Id, agencyId
    nginx.ingress.kubernetes.io/cors-allow-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
  name: userservice-rewrite-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - backend:
          service:
            name: userservice
            port:
              number: 8080
        # Do NOT extend this alternation: ingress-nginx orders regex locations by
        # descending path-string length, and userservice-public-entry-ingress must stay
        # longer than this route or its rate limit is bypassed. Adding "error-reports"
        # here took this pattern to 83 characters against the public entry's 70 and did
        # exactly that. A new prefix gets its own ingress instead.
        path: /service/(users|conversations|useradmin|appointments|matrix)(/|$)(.*)
        pathType: ImplementationSpecific
