apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # Match the 10 MB limit promised by the chat attachment composer.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ (.Values.matrix).maxUploadSize | default "10m" | quote }}
    # Matrix server delegation. Without it, anything doing federation
    # discovery for this server name falls back to the default port 8448,
    # which nothing listens on. lk-jwt-service validates the OpenID token
    # over `matrix://`, so it dialled :8448, got "connection refused", and
    # every /sfu/get answered 401 — the call died with "SFU Config fetch
    # failed with status code 401" and no component logged a denial, because
    # none of them had denied anything.
    # Synapse answers it itself (serve_server_wellknown in homeserver.yaml) with
    # {"m.server": "<server_name>:443"}, routed by the Exact path below (Helm#536).
  name: matrix-client-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - backend:
          service:
            name: matrix-synapse
            port:
              number: 8008
        path: /_matrix
        pathType: Prefix
      - backend:
          service:
            name: matrix-synapse
            port:
              number: 8008
        path: /_synapse
        pathType: Prefix
      - backend:
          service:
            name: matrix-synapse
            port:
              number: 8008
        path: /.well-known/matrix/server
        pathType: Exact
