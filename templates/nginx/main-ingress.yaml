apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/configuration-snippet: add_header Permissions-Policy
      'camera=(self "https://acme{{ .Values.global.domainName }}"), microphone=(self
      "https://acme{{ .Values.global.domainName }}"), display-capture=(self "https://acme{{
      .Values.global.domainName }}")' always;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  name: main-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
{{- if not (eq (include "oriso.accountInactivity.accessGateEnabled" .) "true") }}
{{ include "oriso.mainApiPaths" . | indent 6 }}
{{- end }}
      - backend:
          service:
            name: keycloak
            port:
              number: 8080
        path: /auth
        pathType: Prefix
      - backend:
          service:
            name: admin
            port:
              number: 8080
        path: /admin
        pathType: Prefix
      - backend:
          service:
            name: frontend
            port:
              number: 8080
        path: /error.400.html
        pathType: Prefix
      - backend:
          service:
            name: frontend
            port:
              number: 8080
        path: /static
        pathType: Prefix
      - backend:
          service:
            name: frontend
            port:
              number: 8080
        path: /public
        pathType: Prefix
      - backend:
          service:
            name: frontend
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - '{{ .Values.global.domainName }}'
    - acme{{ .Values.global.domainName }}
    secretName: {{ .Values.global.domainName | replace "." "-" }}-tls
