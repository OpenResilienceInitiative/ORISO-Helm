apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/custom-headers: {{ .Release.Namespace }}/permissions-policy-main-host
    nginx.ingress.kubernetes.io/permanent-redirect: https://{{ .Values.global.domainName
      }}/room/
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
  name: element-call-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: acme{{ .Values.global.domainName }}
    http:
      paths:
      - backend:
          service:
            name: element-call
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - acme{{ .Values.global.domainName }}
    secretName: {{ .Values.global.domainName | replace "." "-" }}-tls
