apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    {{- if .Values.matrixrtcLifecycle.enabled }}
    nginx.ingress.kubernetes.io/auth-url: {{ printf "http://matrixrtc-auth-policy-gateway.%s.svc.cluster.local:3010/internal/lifecycle/admit" .Release.Namespace | quote }}
    nginx.ingress.kubernetes.io/auth-method: "GET"
    # Signaling URLs may carry participant access_token credentials.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/auth-proxy-set-headers: {{ printf "%s/matrixrtc-lifecycle-auth-headers" .Release.Namespace | quote }}
    {{- end }}
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/use-regex: 'true'
  name: livekit-sfu-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: '{{ .Values.global.domainName }}'
    http:
      paths:
      - backend:
          service:
            name: livekit
            port:
              number: 7880
        path: /livekit/sfu/?(.*)
        pathType: ImplementationSpecific
