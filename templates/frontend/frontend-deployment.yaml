apiVersion: apps/v1
kind: Deployment
metadata: 
  labels:
    app: frontend
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # Runtime config is read at container start; roll pods when it changes.
        checksum/config: {{ include (print $.Template.BasePath "/frontend/frontend-configmap.yaml") . | sha256sum }}
      labels:
        app: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        {{- include "oriso.podSecurityContext" (dict "user" 1000) | nindent 8 }}
      containers:
        - image: {{ include "oriso.immutableImage" (list "frontend.image" .Values.frontend.image) | quote }}
          name: frontend          
          imagePullPolicy: {{ include "oriso.imagePullPolicy" . | quote }}
          envFrom:
            - configMapRef:
                name: frontend-configmap
          ports:
            - containerPort: 8080
          # Readiness requires the built application shell to be served.
          readinessProbe:
            httpGet:
              path: /beratung-hilfe.html
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          # The entrypoint writes build/config.js from the environment at start.
          securityContext:
            {{- include "oriso.containerSecurityContext" (dict "readOnly" false) | nindent 12 }}
          resources: {}
      imagePullSecrets:
        - name: registry-secret
      restartPolicy: Always
