apiVersion: v1
kind: Secret
metadata:
  name: consultingtypeservice-secret
type: Opaque
data:
  {{- $mongourl := printf "mongodb://%s:%s@mongodb.%s:27017/consulting_types?retryWrites=false" .Values.global.secrets.consultingTypeMongoUser .Values.global.secrets.consultingTypeMongoPass .Release.Namespace }}
  SPRING_DATA_MONGODB_URI: {{ $mongourl | b64enc | quote }}
  SPRING_LIQUIBASE_USER: {{ .Values.global.secrets.liquibaseUser | b64enc | quote }}
  SPRING_LIQUIBASE_PASSWORD: {{ .Values.global.secrets.liquibasePassword | b64enc | quote }}
  KEYCLOAK_CONFIG_ADMIN_USERNAME: {{ .Values.global.secrets.keycloakAdminUsername | b64enc | quote }}
  KEYCLOAK_CONFIG_ADMIN_PASSWORD: {{ .Values.global.secrets.keycloakAdminPassword | b64enc | quote }}
  CONSULTINGTYPESERVICE_SPRING_DATASOURCE_USERNAME: {{ .Values.global.secrets.consultingTypeServiceDbUsername | b64enc | quote }}
  CONSULTINGTYPESERVICE_SPRING_DATASOURCE_PASSWORD: {{ .Values.global.secrets.consultingTypeServiceDbPassword | b64enc | quote }}
  # Required (fails deploy if blank); AES key for the global SMTP password at rest
  # (SmtpPasswordEncryptionService). Distinct from the tenantservice key. Generate with
  # `openssl rand -base64 32`; rotation makes stored ENC: values undecryptable.
  SETTINGS_SMTP_PASSWORD_ENCRYPTION_SECRET: {{ required "consultingTypeService.smtpPasswordEncryptionSecret is required (global SMTP password encryption at rest); set it in your environment secrets.yaml" .Values.consultingTypeService.smtpPasswordEncryptionSecret | b64enc | quote }}
