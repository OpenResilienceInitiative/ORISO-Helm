# Pre-Dev overlay for the ORISO chart.
#
# Apply ON TOP of the base values, e.g.:
#   helm template ./ -f values.yaml.default -f secrets.yaml.default -f values-pre-dev.yaml
#
# ORISO-Helm is the current release authority. A merge is still not deployment
# evidence; apply reviewed chart changes through the normal PreDev release flow.
#
# Host ground truth (measured live 2026-09-22): Pre-Dev serves the App at
# https://predev.oriso.org/, the Admin panel under /admin and Keycloak under
# /auth on the same host. The older app./admin.oriso-dev.site hosts in the
# archived ORISO-Kubernetes ingresses belong to another server (404).

global:
  # Existing ORISO Pre-Dev product identity. The operator must separately
  # supply global.emailLegalOrganisationName before deployment.
  emailBrandingName: "ORISO"
  domainName: "predev.oriso.org"
  observability:
    deploymentEnvironment: "pre-dev"

signoz:
  enabled: true
  signoz:
    env:
      # observability-validation.yaml requires it in sync with global.domainName.
      signoz_global_external__url: "https://predev.oriso.org/signoz"

signozCollector:
  enabled: true
  clusterName: "oriso-predev"

userService:
  # Magic Link, password reset and account-invite links derive from
  # global.domainName: https://predev.oriso.org (admin reset
  # https://predev.oriso.org/admin; admin invite base is the bare origin,
  # InviteAcceptUrlBuilder appends /admin/tenant-onboarding/{token}).

  # Operator SMTP transport for the mails above. Credentials (smtpUser/
  # smtpPassword) live in the persistent secret values, never here. Identity
  # matches what was wired by hand on Pre-Dev on 2026-07-28 (PR #169 context).
  smtpHost: "mail.dreambau.com"
  smtpPort: 587
  smtpSecure: false
  smtpFrom: "ORISO Platform <monty.burns@oriso.org>"

  # NOTE — statisticsMessageCountHmacSecret is deliberately NOT set here.
  # It is a mandatory boot config (ConsultantIdentityHasher exits 1 on a blank
  # value), but it is a credential, so it lives in the persistent secret values
  # alongside serviceEncryptionAppkey and the SMTP credentials — see the entry
  # under `userService:` in secrets.yaml.default. The chart marks it `required`,
  # so rendering this overlay without those secret values fails loudly at deploy
  # time instead of shipping an empty key. The value must exist in the Pre-Dev
  # secret values file or the UserService rollout CrashLoops.

# ---------- What Pre-Dev actually runs --------------------------------------

# The app and the call surface come from the `pre-dev` branch, not from a
# release tag.
#
# `values.yaml.default` pins released versions — element-call:2.0.11 and
# oriso-frontend:2.0.12 — which is right for Dev and Prod and wrong here.
# Pre-Dev exists to try a change before it is released, and until now nothing
# consumed the images that a push to `pre-dev` builds: both repositories
# publish `ghcr.io/openresilienceinitiative/<name>:pre-dev` on every push to
# that branch, and the cluster went on pulling the release tags. The images
# were built and nobody pulled them.
#
# Moving tags, deliberately, and only here. `docs/release-documentation.md` is
# right that a RELEASE "never resolves moving Dev/main tips at publication
# time"; this is not a release, it is the environment that exists to see a
# change before one. `values-dev.yaml` already does the same for Storybook.
#
# `oriso.imagePullPolicy` defaults to `Always`, so a moved tag is re-pulled on
# the next rollout rather than being served from the node's cache. Nothing
# below sets `global.imagePullPolicy`, so that default stands — if that ever
# changes, these two lines stop meaning what they say.
elementCall:
  image: "ghcr.io/openresilienceinitiative/element-call:pre-dev"

frontend:
  image: "ghcr.io/openresilienceinitiative/oriso-frontend:pre-dev"
