# Development overlay for the ORISO chart.
#
# Apply ON TOP of your base values, e.g.:
#   helm upgrade --install caritas ./ -n caritas --create-namespace \
#     -f values.yaml -f values-dev.yaml -f secrets.yaml
#
# Only environment DELTAS belong here. This overlay lowers *test friction*
# only. Matrix room encryption rollout is configured separately per environment;
# this generic dev overlay does not opt in. See docs/infrastructure-report-2026-07.md §7.

# Gate sign-in traffic on Keycloak's private application readiness check.
online-counseling-keycloak:
  keycloakProbes:
    useManagementPort: true

global:
  # MariaDB loses no scheduling or eviction contest to stateless pods on Dev
  # (Helm#576). Dev is a single-release cluster, so the chart creates the class.
  datastorePriorityClass:
    name: "oriso-datastore"
    create: true
    value: 1000000
  # Telemetry to the bundled SigNoz (https://dev.oriso.org/signoz). Every trace
  # is kept on Dev; the cluster collector also scrapes nginx, Keycloak, Synapse
  # and the data stores.
  observability:
    deploymentEnvironment: "dev"
    tracingSamplingProbability: "1.0"
    testRunBaggage: true
    appMetrics: true
    # Cluster-wide ingress-nginx (not part of this chart) whose controller metrics
    # the cluster collector scrapes on port 10254. The Dev controller runs with
    # --enable-metrics=true (live change, verified 2026-11-06); on a cluster whose
    # controller has metrics off the target just stays down.
    externalIngressNginxNamespace: "ingress-nginx"
    externalCertManagerNamespace: "cert-manager"
    dbMetrics: true
    webVitals:
      enabled: true
    # Spans of the scheduled Dev E2E run (ORISO-E2E#97). Create the Secret
    # first (runbooks/signoz-dev.md); the chart only references it.
    e2eTraceIngest:
      enabled: true
      authSecret: "signoz-e2e-ingest-auth"
  # Existing ORISO Dev product identity. The operator must separately supply
  # global.emailLegalOrganisationName before this chart can be deployed.
  emailBrandingName: "ORISO"
  # Public host of the Dev environment (main-ingress serves App, /admin, /auth
  # and /_matrix on it). Every public URL and mail link derives from it.
  domainName: "dev.oriso.org"
  # Seed dummy tenants/users so the app is immediately explorable in dev.
  initializeDummyData: true
  matrix:
    matrixServerName: "matrix.oriso.org"

networkPolicies:
  # Only SigNoz, its collector, migrator and the ClickHouse operator reach ClickHouse (#675).
  # Checked 2026-11-25: no other Dev client, and nothing scrapes ClickHouse's 9363.
  clickhouseIngress:
    enabled: true

signoz:
  enabled: true
  # Dashboards and alert rules from files/signoz/observability-catalog.json, applied
  # by a Helm hook. The Editor API-key Secret must exist before the upgrade:
  # runbooks/signoz-managed-observability.md ("First installation").
  orisoObservability:
    enabled: true
    apiKeySecret:
      name: "signoz-observability-api-key"
  signoz:
    # The existing Dev ext4 CSI volume uses fsGroupPolicy: File. Kubelet
    # gives access to the root-owned SQLite data without copying the database.
    devSQLiteFilesystemGroup: 65532
    env:
      signoz_global_external__url: "https://dev.oriso.org/signoz"
  clickhouse:
    # Measured on Dev, 2026-11-03: 1.2-2.6 GiB in use, largest healthy merge 486 MiB.
    # ClickHouse caps itself at 90% of the limit instead of filling the 7.57 GiB worker.
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
    files:
      # Apply per installation so the operator reconciles the changed files.
      # Layered Pre-Dev inherits the policy. Later files may disable a writer.
      config.d/98-oriso-system-log-retention.xml: |
        <clickhouse>
          <query_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </query_log>
          <part_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </part_log>
          <trace_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </trace_log>
          <asynchronous_metric_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </asynchronous_metric_log>
          <metric_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </metric_log>
          <zookeeper_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </zookeeper_log>
          <processors_profile_log>
            <engine replace="1">Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 3 day</engine>
          </processors_profile_log>
          <aggregated_zookeeper_log>
            <ttl replace="1">event_date + INTERVAL 3 DAY</ttl>
          </aggregated_zookeeper_log>
        </clickhouse>
      # Dev's wide metric_log schema caused repeated failed merges. Keep this
      # environment-specific until other SigNoz installations are measured.
      config.d/99-oriso-disable-metric-log.xml: |
        <clickhouse>
          <metric_log remove="1"/>
        </clickhouse>
      # Measured on Dev, 2026-11-06: system.trace_log is the largest system table
      # (8.21 GiB, 338 M rows, about 1 GiB a day) and nothing reads it: no query
      # in the retained system.query_log window (3 days) selects from it. It is
      # ClickHouse's own profiler output; its docs say it is safe to drop.
      config.d/99-oriso-disable-trace-log.xml: |
        <clickhouse>
          <trace_log remove="1"/>
        </clickhouse>
  # Add values-dev-clickhouse-signal-backup.yaml only for an approved rollout.
  orisoDataProtection:
    signalBackup:
      enabled: false
  otelCollector:
    ports:
      otlp-e2e:
        enabled: true
    additionalEnvs:
      ORISO_DEPLOYMENT_ENVIRONMENT: "dev"
  orisoIngress:
    devAliasRedirect: true
  # Replaces the hand-applied, keyed MCP server (#304); callers bring their own key.
  orisoMcpServer:
    enabled: true

# Node agent (pod logs, host and kubelet metrics) and cluster collector.
signozCollector:
  enabled: true
  clusterName: "oriso-dev"

healthDashboard:
  ingress:
    enabled: true
    # Provision before rollout in healthDashboard.namespace, or the release
    # namespace when unset. This name does not provision or verify the Secret.
    authSecret: "health-dashboard-basic-auth"

storybook:
  enabled: true
  image: "ghcr.io/openresilienceinitiative/oriso-storybook:dev"
  adminImage: "ghcr.io/openresilienceinitiative/oriso-storybook:dev"
  imagePullSecrets:
    - name: registry-secret
  ingress:
    # Provision this Secret in the release namespace before enabling the route.
    # It must contain an nginx-compatible `auth` htpasswd entry.
    authSecret: "storybook-basic-auth"

# Spring "dev" profile for the backend services (verbose errors, dev wiring).
agencyService:
  springProfilesActive: "dev"
  liquibaseContexts: "seed"
tenantService:
  springProfilesActive: "dev"
  liquibaseContexts: "seed"
  # The verified legacy Dev UTC writer signed the retained QA fixture on this day.
  legacyDpaSigning:
    zone: "UTC"
    from: "2026-11-07T00:00:00"
    to: "2026-11-07T23:59:59"
consultingTypeService:
  liquibaseContexts: "seed"
  # Frontend#1979 (OBP 2.1 #101): e-mail notification settings are QA'd on Dev.
  # values-pre-dev.yaml clears it again; prod keeps the value stored in MongoDB.
  releaseToggleOverrides: "enableNewNotifications=true"
userService:
  springProfilesActive: "dev"
  # Dev mailbox QA explicitly exercises all seven App mail languages. This is
  # not human language approval and must not be copied to production values.
  emailAllowUnreviewedLocales: true

  # ADR-018 Global Support Access stays off here. Release 1 is exercised on Pre-Dev only; dev is
  # the stable QA environment and must not gain a new privileged access path ahead of it.
  supportAccess:
    enabled: "false"
  # OTP is enabled by default in dev to match the platform security posture.
  # This is login posture only — not encryption.
  otpAllowedForUsers: "true"
  otpAllowedForConsultants: "true"
  otpAllowedForSingleTenantAdmins: "true"
  otpAllowedForTenantSuperAdmins: "true"
  otpAllowedForRestrictedAgencyAdmins: "true"

  # Confirmed against the live dev ingress: this environment serves the App at
  # the host root and the Admin panel under /admin on the same host
  # (main-ingress: dev.oriso.org/ -> frontend, dev.oriso.org/admin -> admin).
  # UserService appends "/password-reset/confirm?token=…" to each base URL, so
  # these produce https://dev.oriso.org/password-reset/confirm and
  # https://dev.oriso.org/admin/password-reset/confirm.
  # Leaving any of them unset makes the feature fail closed: password reset
  # sends no email at all, Magic Link emails a broken link.
  magicLinkFrontendBaseUrl: "https://dev.oriso.org"
  passwordResetFrontendBaseUrl: "https://dev.oriso.org"
  passwordResetAdminFrontendBaseUrl: "https://dev.oriso.org/admin"

  # SMTP transport for Magic Link and password-reset mail. The credentials
  # belong in the persistent secret values, never in this file.
  smtpHost: "mail.dreambau.com"
  smtpPort: 587
  smtpSecure: false
  smtpFrom: "ORISO Platform <monty.burns@oriso.org>"

# Matrix federation identity (ADR-005 canonical server_name). Fixed across
# environments; values.yaml.default ships a placeholder ("your-server.local").
matrix:
  synapseServerName: "matrix.oriso.org"
  matrixServerName: "matrix.oriso.org"
  # Synapse CPU on Dev (2026-11-21). At the shipped 500m limit Synapse was CFS
  # throttled: cgroup cpu.stat showed 20,506 throttled periods and 1,737 s
  # throttled against 1,337 s of CPU used. /livekit/jwt/sfu/get timed out
  # while it waited on Synapse, and 1:1 calls failed with "Call service
  # unavailable (503)". Dev was raised by hand with kubectl set resources;
  # this keeps the value across helm upgrades. Memory stays at the default.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1Gi
  # Stale Matrix devices on Dev (ORISO-Helm#628). On 2026-11-21, 114 users held
  # 2,706 devices (p90 74, max 310; 1,169 unseen for 7+ days), mostly fresh E2E
  # browser profiles and the UserService admin login. Each E2EE key goes to every
  # device, which pushed Synapse into CPU throttling during calls. 7d (product
  # owner decision, 2026-11-21): no device on Dev was older than 30 days, so 30d
  # removed nothing while E2E runs added new devices every day.
  deleteStaleDevicesAfter: "7d"
  # Synapse rc_invites for Dev (ORISO-UserService#1736). A new enquiry in
  # Springfield QA Dev invites ~17 counsellors into its holding room at once;
  # with the shipped burst of 10 the rest waits, and the standing supervisor's
  # invite after an accept was refused for ~270 s (per_user: one invite per
  # ~5.5 min once 5 are used). Room/issuer bursts cover two backfills plus
  # supervisors; per_user allows one invite every 10 s with a burst of 20.
  rateLimits:
    invitesPerRoom:
      perSecond: 1
      burstCount: 40
    invitesPerIssuer:
      perSecond: 1
      burstCount: 40
    invitesPerUser:
      perSecond: 0.1
      burstCount: 20
    # rc_message (ORISO-UserService#1737): the agency service account creates a
    # holding room and invites ~17 counsellors per enquiry; with the shipped
    # 0.2/s burst 10 the next enquiry's room creation was refused (Dev sessions
    # 206, 223, 226). Burst 60 at 1/s covers three back-to-back enquiries.
    messages:
      perSecond: 1
      burstCount: 60
    # rc_joins_per_room (ORISO-UserService#1744): joins into the shared agency
    # holding room returned 429 on 23 Nov (session 258 left without a room).
    joinsPerRoom:
      perSecond: 5
      burstCount: 100
matrixrtcAuth:
  membershipReaderUserId: "@matrixrtc-auth:matrix.oriso.org"

# Remove a person whose call access ends (moderator ban, revoked guest seat;
# ORISO-Admin#1518, ORISO-Frontend#2209) from the running LiveKit call.
# UserService posts to the gateway's /internal/matrixrtc/evict with the existing
# call-policy token (matrixrtcAuth.existingSecret.callPolicyTokenKey); the
# gateway calls LiveKit RemoveParticipant. Needs a gateway image that contains
# token-service/eviction.js (ORISO-Livekit 16eb072 or later).
matrixrtcEviction:
  enabled: true
